<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cantera Madrid</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ea; --card:#ffffff; --ink:#15211b; --muted:#66736b; --line:#e2dfd4;
  --pitch:#0f5132; --pitch2:#16714a; --chalk:#e9f5ee; --accent:#d9480f; --win:#2b8a3e; --draw:#868e96; --loss:#c92a2a;
  --bubble:#e6efe9; --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0e1411;--card:#17201b;--ink:#e8efe9;--muted:#93a39a;--line:#26322b;--chalk:#1d2b24;--bubble:#1f2c25}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
header.top{background:var(--pitch);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 18px 16px;
  background-image:repeating-linear-gradient(90deg,transparent 0 38px,rgba(255,255,255,.05) 38px 76px)}
.top h1{font-family:"Barlow Condensed",sans-serif;font-size:28px;letter-spacing:.5px;margin:0;line-height:1}
.top .sub{opacity:.8;font-size:13px;margin-top:4px}
.toprow{display:flex;align-items:center;gap:10px}
.toprow .grow{flex:1;min-width:0}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff;flex:none}
.iconbtn svg{width:20px;height:20px}
main{flex:1;overflow-y:auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px)}
.section-t{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-size:14px;margin:18px 2px 8px}
.maincta{width:100%;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:left}
.maincta .ic{width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.maincta b{display:block;font-size:16px}
.maincta span{color:var(--muted);font-size:13px}
.team{width:100%;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;text-align:left}
.crest{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:700;font-size:16px;flex:none;border:2px solid rgba(255,255,255,.6);box-shadow:0 0 0 1px var(--line)}
.team .info{flex:1;min-width:0}
.team .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.team .side{text-align:right;font-size:12px;color:var(--muted)}
.team .side b{display:block;font-family:"Barlow Condensed",system-ui,sans-serif;font-size:20px;color:var(--ink)}
.addbtn{width:100%;border:1.5px dashed var(--line);border-radius:var(--radius);padding:14px;color:var(--pitch2);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:20px 10px;font-size:14px}
.demo-note{margin-top:22px;font-size:12px;color:var(--muted);line-height:1.5;background:var(--chalk);padding:12px 14px;border-radius:12px}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;line-height:1.45;white-space:normal}
.msg.u{align-self:flex-end;background:var(--pitch2);color:#fff;border-bottom-right-radius:4px}
.msg.b{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.b.wide{max-width:100%;width:100%}
.composer{border-top:1px solid var(--line);background:var(--card);padding:8px 10px calc(env(safe-area-inset-bottom) + 8px)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;background:var(--chalk);color:var(--pitch2);font-size:13px;font-weight:500;border:1px solid var(--line)}
@media (prefers-color-scheme: dark){.chip{color:#8ce0b0}}
form.inp{display:flex;gap:8px}
form.inp input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:11px 16px;font:inherit;font-size:16px;outline:none}
form.inp input:focus{border-color:var(--pitch2)}
form.inp button{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
/* cards inside answers */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:8px 0 4px;text-align:center}
.score .t{font-size:13px;font-weight:600;line-height:1.2}
.score .r{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:30px;font-weight:700;padding:2px 12px;border-radius:10px;background:var(--chalk)}
.small{font-size:12.5px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:6px;padding:2px 7px;margin-right:4px;font-family:Inter}
.W{background:var(--win)}.D{background:var(--draw)}.L{background:var(--loss)}
table.st{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.st th{font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;padding:4px 3px;text-align:center}
table.st td{padding:6px 3px;text-align:center;border-top:1px solid var(--line)}
table.st td.n{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
table.st tr.me td{background:var(--chalk);font-weight:700}
table.st td.p{font-weight:700}
.next{border-left:4px solid var(--accent);padding:6px 0 6px 10px;margin:8px 0}
.next .when{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:20px;font-weight:700}
a.map{display:inline-flex;align-items:center;gap:6px;margin-top:6px;color:var(--pitch2);font-weight:600;text-decoration:none}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.prow{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:12px}
.prow .dor{width:30px;height:30px;border-radius:8px;background:var(--pitch);color:#fff;display:grid;place-items:center;font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:700}
.prow .grow{flex:1;min-width:0}
.btn{padding:7px 12px;border-radius:10px;background:var(--pitch2);color:#fff;font-size:13px;font-weight:600}
.btn.ghost{background:var(--chalk);color:var(--pitch2)}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
/* sheets */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:80%;overflow-y:auto;transform:translateY(105%);transition:transform .25s;z-index:11}
.sheet.open{transform:none}
.sheet h3{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:22px;margin:0 0 10px}
.sheet input.search{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 14px;font:inherit;font-size:16px;margin-bottom:12px}
.tog{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.tog .grow{flex:1}
.sw{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--win)}.sw.on::after{left:23px}
.hidden{display:none!important}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;padding:11px 14px;border-radius:12px;background:var(--chalk);border:1px solid var(--line);font-weight:600;color:var(--pitch2)}
@media (prefers-color-scheme: dark){.opt{color:#8ce0b0}}
.opt span{font-size:18px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<script>
/* ============================================================
   CANTERA MADRID — fútbol base (Infantil, Cadete, Juvenil) de la Comunidad de Madrid
   Datos: RFFM (www.rffm.es), descargados por el robot del repositorio (data/*.json).
   ============================================================ */
const RAW="https://raw.githubusercontent.com/alexample/cantera-madrid/main/data/";
const DATA_BASE=(()=>{try{return new URLSearchParams(location.search).get("datos")||RAW}catch(e){return RAW}})();
const IA_URL="https://dondeloechan-ia.alexample.workers.dev/cantera-ia";
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const CATN={inf:"Infantil",cad:"Cadete",juv:"Juvenil"};
const CAT_ORDER=["inf","cad","juv"];

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[¿?¡!.,;:'"()\-\/]/g," ").replace(/\s+/g," ").trim();
const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fdate=d=>`${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`;
function rel(d){const diff=Math.round((d-TODAY)/864e5);if(diff===0)return"hoy";if(diff===1)return"mañana";if(diff===-1)return"ayer";if(diff>1&&diff<7)return"este "+DIAS[d.getDay()];return null}
const store={get(k,d){try{const v=localStorage.getItem("cm_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("cm_"+k,JSON.stringify(v))}catch(e){}}};
const SIGLAS=new Set(["a","d","c","f","u","s","e","r","sad","cd","ad","cf","ud","sd","ef","cde","adc","club","de","del","la","el","los","las","futbol","escuela","deportivo","deportiva","agrupacion","asociacion","sociedad","atletico","union","racing","real","rcd","cdf","ac","ce","cp","fc","ss","sporting","y","san"]);
// "A.D. ALCORCON A" -> "A.D. Alcorcón A" (respeta siglas)
function bonito(n){return String(n||"").toLowerCase().split(" ").map(w=>/\./.test(w)||/^[a-z]$/.test(w)||/^(sad|cd|ad|cf|ud|sd|cde|rcd|ef|ii|iii|iv|vi)$/.test(w)?w.toUpperCase():w.charAt(0).toUpperCase()+w.slice(1)).join(" ").replace(/\b(De|Del|La|Las|Los|El|Y)\b/g,x=>x.toLowerCase()).replace(/^./,c=>c.toUpperCase())}
function siglas(club){const w=norm(club).split(" ").filter(x=>x.length>1&&!SIGLAS.has(x));const s=(w[0]||norm(club).replace(/ /g,"")).slice(0,3).toUpperCase();return s}
function colorDe(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return `hsl(${h%360} 55% 38%)`}
const cap=s=>String(s).replace(/(^|\s)\p{L}/gu,c=>c.toUpperCase()).replace(/\b(De|Del|La|Las|Los|El)\b/g,w=>w.toLowerCase());
function km(a,b){if(!a||!b)return null;const R=6371,t=x=>x*Math.PI/180,dl=t(b[0]-a[0]),dn=t(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

/* ---------- datos ---------- */
let IDX=null;          // índice
let TEAMS=[];          // equipos
const TEAM=new Map();  // id -> equipo
const GD={};           // grupo -> datos cargados
const CAMPOS={};       // id -> {name, addr, loc, ll}
async function getJSON(name,{fresh=false}={}){
  const url=DATA_BASE+name+(fresh?(DATA_BASE.startsWith("http")?"?t="+Date.now():""):"");
  const r=await fetch(url,{cache:fresh?"no-store":"default"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}
function buildIndex(ix){
  IDX=ix;TEAMS=[];TEAM.clear();
  for(const [id,v] of Object.entries(ix.campos||{}))CAMPOS[id]={id,name:v[0],addr:v[1],loc:v[2],ll:v[3]!=null&&v[4]!=null?[v[3],v[4]]:null};
  for(let [id,n,c,gs,campo] of ix.equipos){
    const grupos=gs.filter(g=>ix.grupos[g]);if(!grupos.length)continue;
    const g0=ix.grupos[grupos[0]];
    const cp=CAMPOS[campo]||null;
    c=String(c).replace(/\s+[A-Z]{1,2}$/,"");
    const t={id,raw:n,name:bonito(n),club:bonito(c),clubKey:norm(c),cat:g0[0],fem:!!g0[3],grupos,campo:cp,town:cp?cap(cp.loc.toLowerCase()):"",ll:cp?cp.ll:null};
    t.sig=siglas(c);t.color=colorDe(norm(c));
    t.sName=" "+norm(n+" "+c)+" ";t.sPlace=" "+norm([cp&&cp.loc,cp&&cp.name].join(" "))+" ";t.search=t.sName+t.sPlace;
    TEAMS.push(t);TEAM.set(id,t);
  }
}
const grupo=gid=>{const g=IDX.grupos[gid];return g&&{id:gid,cat:g[0],comp:bonito(g[1]),grupo:bonito(g[2]),fem:g[3],compId:g[4],tj:g[5],temp:g[6]}};
const grupoNombre=gid=>{const g=grupo(gid);return g?`${g.comp} · ${g.grupo}`:""};
async function loadGroup(gid,fresh){
  if(GD[gid]&&!fresh)return GD[gid];
  const cached=store.get("g_"+gid,null);
  if(cached&&!fresh&&Date.now()-(cached._t||0)<10*60e3){GD[gid]=prep(cached);return GD[gid]}
  try{const d=await getJSON("g/"+gid+".json",{fresh:true});d._t=Date.now();store.set("g_"+gid,d);GD[gid]=prep(d)}
  catch(e){if(cached){GD[gid]=prep(cached)}else throw e}
  return GD[gid];
}
function prep(d){
  d.matches=(d.part||[]).map(p=>({j:p[0],date:p[1]?new Date(p[1]+"T00:00:00"):null,time:p[2]||"",home:p[3],homeN:bonito(p[4]),away:p[5],awayN:bonito(p[6]),hg:p[7],ag:p[8],campo:p[9],campoN:p[10],played:p[7]!=null&&p[8]!=null}));
  d.matches.sort((a,b)=>(a.j||0)-(b.j||0)||((a.date||0)-(b.date||0)));
  if(d.clas&&d.clas.length)d.table=d.clas.map(r=>({pos:r[0],id:r[1],name:bonito(r[2]),pj:r[3]||0,g:r[4]||0,e:r[5]||0,p:r[6]||0,gf:r[7]||0,gc:r[8]||0,pts:r[9]||0}));
  else{const tab={};const add=(id,n)=>tab[id]||(tab[id]={id,name:n,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0});
    d.matches.forEach(m=>{if(!m.home||!m.away)return;const h=add(m.home,m.homeN),a=add(m.away,m.awayN);if(!m.played)return;h.pj++;a.pj++;h.gf+=m.hg;h.gc+=m.ag;a.gf+=m.ag;a.gc+=m.hg;if(m.hg>m.ag){h.g++;a.p++;h.pts+=3}else if(m.hg<m.ag){a.g++;h.p++;a.pts+=3}else{h.e++;a.e++;h.pts++;a.pts++}});
    d.table=Object.values(tab).sort((x,y)=>y.pts-x.pts||(y.gf-y.gc)-(x.gf-x.gc)).map((r,i)=>({...r,pos:i+1}))}
  return d;
}
const teamGroup=t=>GD[t.grupos[0]];
const teamMatches=t=>{const d=teamGroup(t);return d?d.matches.filter(m=>m.home===t.id||m.away===t.id):[]};
const lastMatch=t=>teamMatches(t).filter(m=>m.played).sort((a,b)=>(a.date||0)-(b.date||0)||a.j-b.j).pop();
const nextMatch=t=>{const ms=teamMatches(t).filter(m=>!m.played);return ms.find(m=>m.date&&m.date>=TODAY)||ms.find(m=>!m.date)};
function outcome(m,id){const my=m.home===id?m.hg:m.ag,ot=m.home===id?m.ag:m.hg;return my>ot?"W":my<ot?"L":"D"}
const fin=s=>/\.$/.test(s)?"":".";
const rivalOf=(m,id)=>m.home===id?{id:m.away,n:m.awayN}:{id:m.home,n:m.homeN};

/* ---------- estado ---------- */
const state={follows:store.get("follows",[]).filter(Boolean),verified:store.get("verified",false),chats:{},iah:{},flow:null,view:"home",team:null};
const ANDROID=typeof window.AndroidApp!=="undefined";
// Pasa a Android los equipos seguidos (para los avisos en segundo plano)
function syncAndroid(){if(!ANDROID||!IDX)return;try{AndroidApp.guardarEquipos(JSON.stringify(state.follows.map(id=>TEAM.get(id)).filter(Boolean).map(t=>({id:t.id,g:t.grupos[0],n:t.name}))))}catch(e){}}
function follow(id){if(!state.follows.includes(id)){state.follows.push(id);store.set("follows",state.follows);syncAndroid();if(ANDROID&&state.follows.length===1)try{AndroidApp.pedirPermiso()}catch(e){}}}
function unfollow(id){state.follows=state.follows.filter(x=>x!==id);store.set("follows",state.follows);syncAndroid()}

/* ---------- piezas visuales ---------- */
const crest=(t,size)=>`<div class="crest" style="background:${t.color};${size?`width:${size}px;height:${size}px;font-size:${Math.round(size*.36)}px`:""}">${esc(t.sig)}</div>`;
const icons={
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>',
  send:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  chat:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  pin:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>'
};
function mapLink(c,label){if(!c)return"";const q=c.ll?c.ll.join(","):encodeURIComponent(c.name+", "+c.addr+", "+c.loc);return `<a class="map" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">${icons.pin} ${label||"Abrir en mapas"}</a>`}
const opts=list=>`<div class="opts">${list.map(o=>`<button class="opt" data-ask="${esc(o.v||o.l||o)}">${o.ic?`<span>${o.ic}</span>`:""}${esc(o.l||o)}</button>`).join("")}</div>`;
function teamRow(t,extra){const f=state.follows.includes(t.id);return `<div class="prow">${crest(t,34)}<div class="grow"><b>${esc(t.name)}</b><div class="small">${extra??esc(grupoNombre(t.grupos[0]))}</div></div><button class="btn ${f?"ghost":""}" data-open="${t.id}">${f?"Abrir":"Seguir"}</button></div>`}

function dist(a,b,max){if(Math.abs(a.length-b.length)>max)return max+1;const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];for(let j=1;j<=b.length;j++)d[i][j]=i?0:j}

function expandir(w){
  const V=vocab();if(w.length<4||V.some(x=>x.includes(w)))return{alts:[w],fixed:null};
  const max=w.length>=7?2:1;let best=max+1,alts=[];
  for(const x of V){if(x.length<3)continue;const d=dist(w,x,max);if(d<best){best=d;alts=[x]}else if(d===best&&d<=max)alts.push(x)}
  return best<=max?{alts,fixed:alts[0]}:{alts:[w],fixed:null};
}

  if(f.step===0)return `Vamos a encontrarlo en tres preguntas.<br><b>1/3 · ¿En qué año nació el jugador?</b> También me vale su edad.${opts([...CAT_ORDER.map(c=>({l:`${yrs(c)} · ${CATN[c]}`,v:"Nació en "+CAT_YEARS[c][0]})),{l:"Otro año",v:"Otro año"}])}`;
  if(f.step===0.5)return `<b>¿Qué tipo de equipo?</b>${opts([{l:"Masculino o mixto",v:"Masculino"},{l:"Femenino",v:"Femenino"},{l:"Cualquiera",v:"Cualquiera"}])}`;
  if(f.step===1)return `<b>2/3 · ¿Dónde vive o dónde juega?</b> Escribe un municipio o barrio (por ejemplo «Alcorcón» o «Carabanchel»).${opts(["Me da igual"])}`;
  if(f.step===2){const near=nearestClubs(d.place&&d.place.ll,d.cat,5,d.fem);
    return `<b>3/3 · ¿Sabes el nombre del club?</b> Puedes escribirlo o elegir uno cercano.${opts([...near.map(x=>({l:x.club+(x.d!=null?` (${Math.round(x.d)} km)`:""),v:"club:"+x.key})),{l:"No lo sé",v:"No lo sé"}])}`}
}
function wizardAnswer(text){
  const f=state.flow,d=f.data,q=norm(text);
  if(f.step===0){
    if(q==="otro ano")return `Escribe el año de nacimiento, por ejemplo «2012». La app cubre Infantil (${yrs("inf")}), Cadete (${yrs("cad")}) y Juvenil (${yrs("juv")}).`;
    let y=(q.match(/\b(19|20)\d{2}\b/)||[])[0];const age=!y&&(q.match(/\b(\d{1,2})\b/)||[])[1];
    if(age){y=SEASON-(+age);d.fromAge=true}
    if(!y)return "No lo he entendido. Escribe el año de nacimiento (por ejemplo «2012») o la edad (por ejemplo «13 años»).";
    y=+y;const r=catFromYear(y);
    if(r.other){state.flow=null;return `Nacido en ${y} juega en <b>${r.other}</b>. De momento la app cubre Infantil, Cadete y Juvenil.${more()}`}
    if(r.none)return `Con ${y} no encaja en fútbol base. Infantil ${yrs("inf")}, Cadete ${yrs("cad")}, Juvenil ${yrs("juv")}.`;
    d.cat=r.cat;d.year=y;f.step=0.5;
    return `Nacido en ${y}${d.fromAge?" (calculado por la edad)":""} → <b>${CATN[d.cat]}</b> esta temporada.<br><br>`+wizardAsk();
  }
  if(f.step===0.5){d.fem=/femen|chica|nina/.test(q)?true:/mascul|mixto|chico|nino/.test(q)?false:null;f.step=1;return wizardAsk()}
  if(f.step===1){
    if(/(me da igual|da igual|cualquier|no se)/.test(q))d.place=null;
    else{const p=findPlace(text);
      if(!p){const byName=searchTeams(text,{cat:d.cat});if(byName.length){state.flow=null;return `He encontrado estos equipos ${CATN[d.cat]}:`+teamCards(byName.slice(0,8))+more()}
        return "No conozco ese sitio. Prueba con el municipio o distrito (por ejemplo «Carabanchel», «Móstoles») o pulsa «Me da igual»."+opts(["Me da igual"])}
      d.place=p}
    f.step=2;return (d.place?`Zona: <b>${esc(cap(d.place.name))}</b>.<br><br>`:"")+wizardAsk();
  }
  if(f.step===2){
    const ll=d.place&&d.place.ll;state.flow=null;
    let club=null;
    if(text.startsWith("club:"))club=text.slice(5);
    else if(!/no (lo )?se|ni idea|ninguno/.test(q)){const r=searchTeams(text,{cat:d.cat,fem:d.fem});if(r.length)club=r[0].clubKey}
    if(club){const ts=TEAMS.filter(t=>t.clubKey===club&&t.cat===d.cat&&(d.fem==null||t.fem===d.fem)).sort(ordenEquipos);
      return `${ts.length===1?"Este es su equipo:":`El club tiene ${ts.length} equipos ${CATN[d.cat]}. Elige el suyo:`}${teamCards(ts,ll)}<div class="small" style="margin-top:6px">Pulsa «Seguir» para tener su ficha con resultados, próximo partido y clasificación.</div>${more()}`}
    const ts=ll?nearestTeams(ll,{cat:d.cat,fem:d.fem,limit:6}):[];
    if(!ts.length)return `Hay ${TEAMS.filter(t=>t.cat===d.cat).length} equipos ${CATN[d.cat]}. Escribe el nombre del club o el municipio para encontrarlo.`+opts(["Buscar un equipo"]);
    return `Equipos <b>${CATN[d.cat]}</b> con campo más cerca de ${esc(cap(d.place.name))}:${teamCards(ts,ll)}${more()}`;
  }
}

/* ---------- IA ---------- */
const CUPO_IA=5;
function noEntiendo(text,t){
  const ia=`<div style="margin-top:10px"><button class="btn ghost" data-ask="${esc("ia:"+text)}">🤖 Preguntar a la IA</button><div class="small" style="margin-top:4px">Solo para preguntas poco habituales (máximo ${CUPO_IA} al día).</div></div>`;
  if(t)return `No estoy seguro de qué me preguntas. Prueba con una de estas:`+opts(CHIPS_TEAM)+ia;
  return HELP_MAIN+opts(MENU)+ia;
}
async function preguntarIAconCupo(key,text,t){
  const hoy=new Date().toISOString().slice(0,10);const c=store.get("ia_cupo",{d:"",n:0});if(c.d!==hoy){c.d=hoy;c.n=0}
  if(c.n>=CUPO_IA)return `Has usado las ${CUPO_IA} preguntas a la IA de hoy. Mañana tendrás más; mientras tanto, pregúntame lo habitual (resultados, próximo partido, clasificación…).`;
  if(!iaDisponible())return "La IA solo está disponible en la app de Android.";
  if(t)await loadGroup(t.grupos[0]);
  const r=await preguntarIA(key,text,t?contextoEquipo(t):contextoGeneral());
  if(r&&!r.includes('class="small">La IA')&&!r.includes("Sin conexión")){c.n++;store.set("ia_cupo",c)}
  return r||"La IA no ha podido responder ahora mismo.";
}
const esPregunta=x=>/[?¿]/.test(x)||/^(que|como|cuando|donde|cual|cuales|quien|cuantos|cuantas|por que|puedo|hay|es|se puede)\b/.test(norm(x));
const iaDisponible=()=>location.host==="appassets.androidplatform.net";
function contextoEquipo(t){
  const d=teamGroup(t);const L=[`FICHA: ${t.name} (${CATN[t.cat]}${t.fem?" femenino":""}). Competición: ${grupoNombre(d.id)}.`,t.campo?`Campo habitual: ${t.campo.name}, ${t.campo.addr}, ${t.campo.loc}.`:"",`Hoy es ${fdate(TODAY)} de ${TODAY.getFullYear()}.`,"","CLASIFICACIÓN (pos equipo PJ G E P GF GC Pts):"];
  d.table.forEach(r=>L.push(`${r.pos}. ${r.name} ${r.pj} ${r.g} ${r.e} ${r.p} ${r.gf} ${r.gc} ${r.pts}`));
  L.push("","ÚLTIMOS Y PRÓXIMOS PARTIDOS DEL EQUIPO:");
  const tm=teamMatches(t);const jug=tm.filter(m=>m.played).slice(-5),pen=tm.filter(m=>!m.played).slice(0,5);
  [...jug,...pen].forEach(m=>{const c=CAMPOS[m.campo];L.push(`J${m.j} ${m.date?fdate(m.date):"fecha por confirmar"} ${m.time} · ${m.homeN} ${m.played?m.hg+"-"+m.ag:"vs"} ${m.awayN}${c?` · ${c.name} (${c.addr}, ${c.loc})`:m.campoN?" · "+m.campoN:""}`)});
  const gol=(d.gol||[]).filter(g=>g[1]===t.id);if(gol.length){L.push("","GOLEADORES DEL EQUIPO:");gol.forEach(g=>L.push(`${nombreJ(g[0])}: ${g[2]}`))}
  return L.join("\n");
}
function contextoGeneral(){return `Hoy es ${fdate(TODAY)} de ${TODAY.getFullYear()}. La app tiene ${TEAMS.length} equipos de fútbol 11 Infantil, Cadete y Juvenil de la Comunidad de Madrid (datos de la RFFM). En este chat se buscan equipos por club, municipio o categoría; las fichas de cada equipo dan resultados, calendario y clasificación. Categorías por año de nacimiento esta temporada: Infantil ${yrs("inf")}, Cadete ${yrs("cad")}, Juvenil ${yrs("juv")}, Alevín ${OTHER_YEARS[0].y.join("–")}.`}
const fmtIA=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^- /gm,"• ").replace(/\n/g,"<br>");
async function preguntarIA(key,text,contexto){
  if(!iaDisponible())return null;
  const hist=state.iah[key]||(state.iah[key]=[]);const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),25000);
  try{const r=await fetch(IA_URL,{method:"POST",headers:{"Content-Type":"application/json"},signal:ctl.signal,body:JSON.stringify({pregunta:text,historial:hist.slice(-6),contexto})});
    const d=await r.json();if(!r.ok||!d.respuesta)return `<span class="small">${esc(d.error||"La IA no ha podido responder ahora mismo.")}</span>`;
    hist.push({rol:"usuario",texto:text},{rol:"asistente",texto:d.respuesta});
    return fmtIA(d.respuesta)+`<div class="small" style="margin-top:6px">IA · puede equivocarse</div>`}
  catch(e){return `<span class="small">${navigator.onLine===false?"Sin conexión: el asistente necesita internet.":"La IA está tardando demasiado. Inténtalo otra vez."}</span>`}
  finally{clearTimeout(tm)}
}

/* ---------- vistas ---------- */
function render(){const app=$("#app");app.onclick=null;
  if(!IDX)return renderLoading(app);
  if(state.view==="home")return renderHome(app);
  if(state.view==="team")return renderTeam(app,TEAM.get(state.team));
  if(state.view==="main")return renderChat(app,null);
}
function renderLoading(app,err){
  app.innerHTML=`<header class="top"><h1>CANTERA MADRID</h1><div class="sub">Fútbol base · Comunidad de Madrid</div></header>
  <main><div class="empty" style="padding-top:60px">${err?`No he podido descargar los datos.<br><span class="small">${esc(err)}</span><br><br><button class="btn" id="retry">Reintentar</button>`:`<span class="typing"><i></i><i></i><i></i></span><br><br>Cargando equipos de la RFFM…`}</div></main>`;
  if(err)$("#retry").onclick=()=>{renderLoading(app);boot()};
}
function homeRow(t){
  const d=GD[t.grupos[0]];let side="",meta=esc(CATN[t.cat])+(t.fem?" fem.":"");
  if(d){const me=d.table.find(r=>r.id===t.id);const lm=lastMatch(t),nm=nextMatch(t);
    side=me?`<b>${me.pos}º</b>${me.pts} pts`:"";
    meta+=` · ${lm?`<span class="badge ${outcome(lm,t.id)}">${lm.hg}-${lm.ag}</span>`:""}${nm&&nm.date?"próx. "+fdate(nm.date).split(" ").slice(0,2).join(" "):""}`}
  return `<button class="team" data-team="${t.id}">${crest(t)}<div class="info"><div class="nm">${esc(t.name)}</div><div class="meta">${meta}</div></div><div class="side">${side}</div></button>`;
}
function renderHome(app){
  const followed=state.follows.map(id=>TEAM.get(id)).filter(Boolean);
  const act=IDX.act?new Date(IDX.act):null;
  app.innerHTML=`<header class="top"><div class="toprow"><div class="grow"><h1>CANTERA MADRID</h1><div class="sub">Fútbol base · temporada ${esc(IDX.temporada||"")}</div></div>
    <button class="iconbtn" id="gear" aria-label="Ajustes">${icons.gear}</button></div></header>
  <main>
    <button class="maincta" id="openMain"><div class="ic">${icons.chat}</div><div><b>Chat principal</b><span>Busca equipos, jugadores y clasificaciones</span></div></button>
    <div class="section-t">Mis equipos</div>
    <div id="mine">${followed.length?followed.map(homeRow).join(""):`<div class="empty">Aún no sigues ningún equipo.<br>Búscalo por su nombre o deja que te ayude.</div>`}</div>
    <button class="addbtn" id="addTeam">+ Seguir un equipo</button>
    <div class="demo-note">Datos de la <b>Real Federación de Fútbol de Madrid</b> (rffm.es): ${TEAMS.length} equipos de fútbol 11 Infantil, Cadete y Juvenil.${act?` Actualizado ${fdate(act)} a las ${String(act.getHours()).padStart(2,"0")}:${String(act.getMinutes()).padStart(2,"0")}.`:""} App no oficial.</div>
  </main>`;
  $("#gear").onclick=openSettings;
  $("#openMain").onclick=()=>{state.view="main";render()};
  $("#addTeam").onclick=()=>{state.view="main";state.chats._main=null;render();setTimeout(()=>window.__ask&&window.__ask("Buscar un equipo"),50)};
  // delegación: sigue funcionando aunque la lista se repinte al cargar resultados
  $("#mine").onclick=e=>{const b=e.target.closest("[data-team]");if(b){state.view="team";state.team=b.dataset.team;render()}};
  // carga los grupos de los equipos seguidos y repinta
  Promise.all(followed.map(t=>loadGroup(t.grupos[0]).catch(()=>null))).then(()=>{if(state.view==="home"&&$("#mine")&&followed.length)$("#mine").innerHTML=followed.map(homeRow).join("")});
}
async function renderTeam(app,t){
  if(!t){state.view="home";return render()}
  if(!GD[t.grupos[0]]){app.innerHTML=`<header class="top"><div class="toprow"><button class="iconbtn" id="back">${icons.back}</button><div class="grow"><h1 style="font-size:22px">${esc(t.name)}</h1></div></div></header><main><div class="empty"><span class="typing"><i></i><i></i><i></i></span></div></main>`;
    $("#back").onclick=()=>{state.view="home";render()};
    try{await loadGroup(t.grupos[0])}catch(e){$("main").innerHTML=`<div class="empty">No he podido cargar los datos del equipo.<br><br><button class="btn" id="rt">Reintentar</button></div>`;$("#rt").onclick=()=>render();return}
    if(state.view!=="team"||state.team!==t.id)return;
  }else loadGroup(t.grupos[0],true).catch(()=>{}); // refresco en segundo plano
  renderChat(app,t);
}
function renderChat(app,t){
  const key=t?t.id:"_main";
  if(!state.chats[key])state.chats[key]=[{r:"b",h:t?`Hola, soy el asistente del <b>${esc(t.name)}</b> (${esc(CATN[t.cat])}). Pregúntame lo que quieras sobre el equipo.`:welcomeMain()}];
  const chips=t?["¿Cómo quedó el último partido?","¿Cuándo y dónde es el próximo?","Clasificación","Goleadores","Racha"]:["Menú","Buscar un equipo","Buscar un jugador","Ayúdame a encontrar un equipo","Ver clasificaciones"];
  app.innerHTML=`<header class="top"><div class="toprow"><button class="iconbtn" id="back" aria-label="Volver">${icons.back}</button>
    ${t?crest(t,40):""}<div class="grow"><h1 style="font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t?esc(t.name):"Chat principal"}</h1><div class="sub" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t?esc(grupoNombre(t.grupos[0])):"Equipos y jugadores de Madrid"}</div></div>
    ${t&&state.follows.includes(t.id)?`<button class="iconbtn" id="unf" aria-label="Dejar de seguir">${icons.trash}</button>`:""}</div></header>
  <main id="scroll"><div class="chat" id="chat"></div></main>
  <div class="composer"><div class="chips">${chips.map(c=>`<button class="chip" data-ask="${esc(c)}">${esc(c)}</button>`).join("")}</div>
  <form class="inp" id="f"><input id="q" placeholder="${t?"Pregunta sobre el equipo…":"Escribe o elige una opción…"}" autocomplete="off" enterkeyhint="send"><button aria-label="Enviar">${icons.send}</button></form></div>`;
  const chat=$("#chat");
  const wide=h=>h&&(h.includes("<table")||h.includes("plist")||h.includes('class="opts'));
  const draw=()=>{chat.innerHTML=state.chats[key].map(m=>`<div class="msg ${m.r}${wide(m.h)?" wide":""}">${m.h}</div>`).join("");$("#scroll").scrollTop=1e9};
  draw();
  const ask=text=>{
    if(!text.trim())return;
    const shown=text.startsWith("ia:")?"🤖 Preguntar a la IA":text.startsWith("q:")||text.startsWith("qc:")?((document.querySelector(`[data-ask="${CSS.escape(text)}"]`)||{}).textContent||"Ese equipo"):text.startsWith("clubteams:")?"Ver equipos de "+((TEAMS.find(t=>t.clubKey===text.split(":")[1])||{}).club||"club"):text.startsWith("comp:")||text.startsWith("grupo:")||text.startsWith("club:")?(document.querySelector(`[data-ask="${CSS.escape(text)}"]`)||{}).textContent||text:text;
    state.chats[key].push({r:"u",h:esc(shown)});state.chats[key].push({r:"b",h:'<span class="typing"><i></i><i></i><i></i></span>'});draw();
    setTimeout(async()=>{let h;
      try{
        if(text.startsWith("ia:")){h=await preguntarIAconCupo(key,text.slice(3),t)}
        else{h=t?answerTeam(t,text):await handleMain(text);
          if(h==null)h=noEntiendo(text,t)}}
      catch(e){h="Ha fallado algo al consultar los datos. Inténtalo otra vez."}
      state.chats[key].pop();state.chats[key].push({r:"b",h});if(state.view===(t?"team":"main"))draw()},250);
  };
  window.__ask=ask;
  $("#f").onsubmit=e=>{e.preventDefault();const v=$("#q").value;$("#q").value="";ask(v)};
  app.onclick=e=>{
    const a=e.target.closest("[data-ask]");if(a){ask(a.dataset.ask);return}
    const o=e.target.closest("[data-open]");if(o){follow(o.dataset.open);state.view="team";state.team=o.dataset.open;render();return}
    const v=e.target.closest("[data-act=verify]");if(v){state.verified=true;store.set("verified",true);if(!t)startFlow("player");state.chats[key].push({r:"b",h:"Listo, cuenta verificada (simulación). Escribe el <b>nombre y apellidos</b> del jugador."});draw()}
  };
  $("#back").onclick=()=>{state.view="home";render()};
  if(t&&$("#unf"))$("#unf").onclick=()=>openConfirmUnfollow(t);
}
function openSheet(html,bind){$("#sheet").innerHTML=html;$("#sheetBg").style.display="block";requestAnimationFrame(()=>$("#sheet").classList.add("open"));bind&&bind()}
function closeSheet(){$("#sheet").classList.remove("open");$("#sheetBg").style.display="none"}
$("#sheetBg").onclick=closeSheet;
function openConfirmUnfollow(t){
  openSheet(`<h3>¿Dejar de seguir?</h3><p>${esc(t.name)} desaparecerá de tus equipos.</p><div style="display:flex;gap:10px"><button class="btn ghost" id="no" style="flex:1;padding:12px">Cancelar</button><button class="btn" id="yes" style="flex:1;padding:12px;background:var(--loss)">Dejar de seguir</button></div>`,()=>{
    $("#no").onclick=closeSheet;$("#yes").onclick=()=>{unfollow(t.id);delete state.chats[t.id];closeSheet();state.view="home";render()}});
}
function leerAvisos(){let a={};if(ANDROID)try{a=JSON.parse(AndroidApp.leerAjustes()||"{}")}catch(e){}return Object.assign({resultado:true,asignado:true,previo:true,horas:3},a)}
function openSettings(){
  const av=leerAvisos();const sw=(k,t,d)=>`<div class="tog"><div class="grow"><b>${t}</b><div class="small">${d}</div></div><button class="sw ${av[k]?"on":""}" data-sw="${k}" aria-label="${t}"></button></div>`;
  const permiso=ANDROID?(()=>{try{return AndroidApp.puedeNotificar()}catch(e){return true}})():true;
  openSheet(`<h3>Ajustes</h3>
   <div class="section-t" style="margin-top:4px">Avisos de mis equipos</div>
   ${ANDROID?"":`<div class="small" style="margin-bottom:8px">Los avisos funcionan en la app de Android.</div>`}
   ${permiso?"":`<div class="small" style="margin-bottom:8px;color:var(--loss)">Las notificaciones están desactivadas para esta app. <button class="btn ghost" id="permiso" style="margin-top:6px">Activarlas</button></div>`}
   ${sw("resultado","Resultados","Cuando la federación publica el resultado.")}
   ${sw("asignado","Partido asignado","Cuando se fija o cambia la fecha, la hora o el campo.")}
   ${sw("previo","Antes del partido","Con el campo y cómo llegar.")}
   <div class="tog"><div class="grow"><b>¿Cuánto antes?</b></div><div class="chips" style="padding:0">${[1,2,3,4,6].map(h=>`<button class="chip" data-h="${h}" style="${av.horas===h?"background:var(--pitch2);color:#fff":""}">${h} h</button>`).join("")}</div></div>
   <div class="section-t">Cuenta</div>
   <div class="tog"><div class="grow"><b>Cuenta verificada</b><div class="small">Permite buscar jugadores por nombre. En la versión final lo validará el club o la familia.</div></div><button class="sw ${state.verified?"on":""}" id="vsw" aria-label="Cuenta verificada"></button></div>
   <div class="tog"><div class="grow"><b>Datos</b><div class="small">Real Federación de Fútbol de Madrid (rffm.es), ${esc(IDX.temporada)}. Se actualizan varias veces al día. App no oficial.</div></div><button class="btn ghost" id="upd">Actualizar</button></div>`,()=>{
    const guardar=()=>{if(ANDROID)try{AndroidApp.guardarAjustes(JSON.stringify(av))}catch(e){}};
    document.querySelectorAll("[data-sw]").forEach(b=>b.onclick=()=>{const k=b.dataset.sw;av[k]=!av[k];b.classList.toggle("on",av[k]);guardar()});
    document.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{av.horas=+b.dataset.h;document.querySelectorAll("[data-h]").forEach(x=>x.style.cssText=+x.dataset.h===av.horas?"background:var(--pitch2);color:#fff":"");guardar()});
    if($("#permiso"))$("#permiso").onclick=()=>{try{AndroidApp.pedirPermiso();AndroidApp.abrirAjustesNotificaciones()}catch(e){}};
    $("#vsw").onclick=()=>{state.verified=!state.verified;store.set("verified",state.verified);$("#vsw").classList.toggle("on",state.verified)};
    $("#upd").onclick=async()=>{$("#upd").textContent="…";await boot(true);closeSheet()};
  });
}
window.atras=()=>{
  if($("#sheet").classList.contains("open")){closeSheet();return true}
  if(state.view!=="home"){state.view="home";render();return true}
  return false;
};
window.abrirEquipo=id=>{if(!IDX||!TEAM.get(id)){window.__pendiente=id;return}closeSheet();state.view="team";state.team=id;render()};
function abrirPendiente(){const h=(location.hash.match(/^#e-(.+)$/)||[])[1];const id=window.__pendiente||h;if(id&&TEAM.get(id)){window.__pendiente=null;try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}state.view="team";state.team=id;render()}}
async function boot(fresh){
  const cached=store.get("indice",null);
  if(cached&&!fresh){buildIndex(cached);addLocalities();render();syncAndroid();abrirPendiente()}
  else if(!IDX)render();
  try{
    const ix=await getJSON("indice.json",{fresh:true});
    if(!cached||ix.act!==cached.act||fresh){store.set("indice",ix);buildIndex(ix);VOCAB=null;addLocalities();Object.keys(GD).forEach(k=>delete GD[k]);if(state.view==="home")render();syncAndroid();abrirPendiente()}
  }catch(e){if(!IDX)renderLoading($("#app"),e.message)}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&IDX)boot()});
boot();

</script>
