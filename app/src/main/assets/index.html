<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cantera Madrid</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ea; --card:#ffffff; --ink:#15211b; --muted:#66736b; --line:#e2dfd4;
  --pitch:#0f5132; --pitch2:#16714a; --chalk:#e9f5ee; --accent:#d9480f; --win:#2b8a3e; --draw:#868e96; --loss:#c92a2a;
  --bubble:#e6efe9; --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0e1411;--card:#17201b;--ink:#e8efe9;--muted:#93a39a;--line:#26322b;--chalk:#1d2b24;--bubble:#1f2c25}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
header.top{background:var(--pitch);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 18px 16px;
  background-image:repeating-linear-gradient(90deg,transparent 0 38px,rgba(255,255,255,.05) 38px 76px)}
.top h1{font-family:"Barlow Condensed",sans-serif;font-size:28px;letter-spacing:.5px;margin:0;line-height:1}
.top .sub{opacity:.8;font-size:13px;margin-top:4px}
.toprow{display:flex;align-items:center;gap:10px}
.toprow .grow{flex:1;min-width:0}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff;flex:none}
.iconbtn svg{width:20px;height:20px}
main{flex:1;overflow-y:auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px)}
.section-t{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-size:14px;margin:18px 2px 8px}
.maincta{width:100%;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:left}
.maincta .ic{width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.maincta b{display:block;font-size:16px}
.maincta span{color:var(--muted);font-size:13px}
.team{width:100%;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;text-align:left}
.crest{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:700;font-size:16px;flex:none;border:2px solid rgba(255,255,255,.6);box-shadow:0 0 0 1px var(--line)}
.team .info{flex:1;min-width:0}
.team .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.team .side{text-align:right;font-size:12px;color:var(--muted)}
.team .side b{display:block;font-family:"Barlow Condensed",system-ui,sans-serif;font-size:20px;color:var(--ink)}
.addbtn{width:100%;border:1.5px dashed var(--line);border-radius:var(--radius);padding:14px;color:var(--pitch2);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:20px 10px;font-size:14px}
.demo-note{margin-top:22px;font-size:12px;color:var(--muted);line-height:1.5;background:var(--chalk);padding:12px 14px;border-radius:12px}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;line-height:1.45;white-space:normal}
.msg.u{align-self:flex-end;background:var(--pitch2);color:#fff;border-bottom-right-radius:4px}
.msg.b{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.b.wide{max-width:100%;width:100%}
.composer{border-top:1px solid var(--line);background:var(--card);padding:8px 10px calc(env(safe-area-inset-bottom) + 8px)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;background:var(--chalk);color:var(--pitch2);font-size:13px;font-weight:500;border:1px solid var(--line)}
@media (prefers-color-scheme: dark){.chip{color:#8ce0b0}}
form.inp{display:flex;gap:8px}
form.inp input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:11px 16px;font:inherit;font-size:16px;outline:none}
form.inp input:focus{border-color:var(--pitch2)}
form.inp button{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
/* cards inside answers */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:8px 0 4px;text-align:center}
.score .t{font-size:13px;font-weight:600;line-height:1.2}
.score .r{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:30px;font-weight:700;padding:2px 12px;border-radius:10px;background:var(--chalk)}
.small{font-size:12.5px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:6px;padding:2px 7px;margin-right:4px;font-family:Inter}
.W{background:var(--win)}.D{background:var(--draw)}.L{background:var(--loss)}
table.st{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.st th{font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;padding:4px 3px;text-align:center}
table.st td{padding:6px 3px;text-align:center;border-top:1px solid var(--line)}
table.st td.n{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
table.st tr.me td{background:var(--chalk);font-weight:700}
table.st td.p{font-weight:700}
.next{border-left:4px solid var(--accent);padding:6px 0 6px 10px;margin:8px 0}
.next .when{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:20px;font-weight:700}
a.map{display:inline-flex;align-items:center;gap:6px;margin-top:6px;color:var(--pitch2);font-weight:600;text-decoration:none}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.prow{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:12px}
.prow .dor{width:30px;height:30px;border-radius:8px;background:var(--pitch);color:#fff;display:grid;place-items:center;font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:700}
.prow .grow{flex:1;min-width:0}
.btn{padding:7px 12px;border-radius:10px;background:var(--pitch2);color:#fff;font-size:13px;font-weight:600}
.btn.ghost{background:var(--chalk);color:var(--pitch2)}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
/* sheets */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:80%;overflow-y:auto;transform:translateY(105%);transition:transform .25s;z-index:11}
.sheet.open{transform:none}
.sheet h3{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:22px;margin:0 0 10px}
.sheet input.search{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 14px;font:inherit;font-size:16px;margin-bottom:12px}
.tog{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.tog .grow{flex:1}
.sw{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--win)}.sw.on::after{left:23px}
.hidden{display:none!important}
.mc-yo{display:flex;flex-direction:column;align-items:center;gap:3px}.mc-yo .crest{border-width:1px}
.crest,.tl-c{position:relative;overflow:hidden}
.crest img,.tl-c img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:12%;border-radius:50%}
.crest.ci{border-color:#fff}
.carr-fijo{flex:none;border-bottom:1px solid var(--line);background:var(--bg);padding-top:10px;box-shadow:0 6px 12px -10px rgba(0,0,0,.35)}
.carr-fijo .carr-wrap{margin:0 0 4px}
.carr-fijo .mc{padding:10px 12px;gap:6px}
.carr-fijo .mc-res{font-size:30px}.carr-fijo .mc-hora{font-size:24px}
.carr-fijo .carr-hint{font-size:11px;margin-top:0}
.clr{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--muted)!important;border:1px solid var(--line)!important;background:transparent!important}
.clr svg{width:19px;height:19px}
html[data-theme="estadio"] .carr-fijo{background:#070b16;border-bottom-color:#1e2a45}
.carr-wrap{margin:-4px -16px 12px}
.carr{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.carr::-webkit-scrollbar{display:none}
.mc{flex:0 0 82%;scroll-snap-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mc.fut{background:linear-gradient(180deg,var(--card),var(--chalk))}
.mc.prox{border:2px solid var(--accent)}
.mc-top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);font-weight:600}
.mc-top .badge{margin:0;font-size:10.5px}
.mc-eq{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;font-size:13px;line-height:1.25}
.mc-res{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:34px;font-weight:700;padding:0 12px;border-radius:10px;background:var(--chalk);white-space:nowrap}
.mc-res span{opacity:.5;margin:0 3px}
.mc-hora{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:26px;font-weight:700;padding:2px 10px;border-radius:10px;border:1.5px dashed var(--line)}
.mc-campo{font-size:12px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-bot{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:32px}
.mc-bot .btn{text-decoration:none;font-size:12.5px;padding:7px 11px}
.carr-hint{text-align:center;opacity:.7;margin-top:2px}
html[data-theme="estadio"] .mc{background:linear-gradient(180deg,#121d35,#0d162a);border-color:#1e2a45}
html[data-theme="estadio"] .mc.prox{border-color:#b8f53d;box-shadow:0 0 18px rgba(184,245,61,.18)}
html[data-theme="estadio"] .mc-res{background:linear-gradient(135deg,#1b2b52,#0e1731);color:#b8f53d}
.cr-head{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;font-weight:600;font-size:13px;margin:10px 0 6px}
.cr-res{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:26px;font-weight:700;padding:0 10px;border-radius:8px;background:var(--chalk)}
.cr{position:relative;margin:6px 0}
.cr::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line);transform:translateX(-1px)}
.cr-row{display:grid;grid-template-columns:1fr 44px 1fr;align-items:center;min-height:32px;position:relative}
.cr-l{text-align:right;padding-right:8px;font-size:13px}.cr-r{text-align:left;padding-left:8px;font-size:13px}
.cr-m{justify-self:center;z-index:1;background:var(--card);border:1.5px solid var(--line);border-radius:999px;font-size:11px;font-weight:700;padding:2px 7px;min-width:34px;text-align:center}
.cr-ic{font-size:14px}.cr-sc{font-size:11px;font-weight:700;color:var(--muted);margin:0 2px;white-space:nowrap}
.cr-al{margin-top:8px}.cr-al summary{cursor:pointer;font-weight:600;color:var(--pitch2)}
.cr-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.meteo{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--chalk);border:1px solid var(--line)}
.mt-head{display:flex;gap:10px;align-items:center;margin-bottom:6px}.mt-ic{font-size:28px;line-height:1}
.mt-icons{display:grid;grid-template-columns:repeat(6,1fr);text-align:center;font-size:17px;margin-bottom:2px}
.mt-icons span{opacity:.75}.mt-icons span.on{opacity:1}
.meteo svg text{font-family:Inter,sans-serif}
.mt-t{font-size:9.5px;fill:var(--muted)}
.mt-x{font-size:10px;fill:var(--muted)}.mt-x.on{fill:var(--ink);font-weight:700}
.mt-val{font-size:11px;font-weight:700;fill:var(--ink)}
.mt-band{fill:var(--card);opacity:.9}
.mt-line{fill:none;stroke:#e8590c;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.mt-dot{fill:#e8590c;stroke:var(--chalk);stroke-width:2}.mt-dot.on{fill:#c2410c}
.mt-bar{fill:#74a9e8}.mt-bar.on{fill:#2563eb}
.mt-base{stroke:var(--line);stroke-width:1}
.mt-det{margin-top:2px;color:var(--ink)}
html[data-theme="estadio"] .meteo{background:#0d1629;border-color:#1e2a45}
html[data-theme="estadio"] .mt-band{fill:#16223d}
html[data-theme="estadio"] .mt-line{stroke:#e2702f}html[data-theme="estadio"] .mt-dot{fill:#e2702f;stroke:#0d1629}html[data-theme="estadio"] .mt-dot.on{fill:#e2702f}
html[data-theme="estadio"] .mt-bar{fill:#2f5a99}html[data-theme="estadio"] .mt-bar.on{fill:#4a86e8}
@media (prefers-color-scheme: dark){html:not([data-theme="estadio"]) .mt-bar{fill:#2f5a99}html:not([data-theme="estadio"]) .mt-bar.on{fill:#4a86e8}html:not([data-theme="estadio"]) .mt-line{stroke:#e2702f}html:not([data-theme="estadio"]) .mt-dot{fill:#e2702f}}
.sug{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 6px}
.sug .chip{font-size:13.5px;padding:8px 13px}
.tl{display:inline-block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;background:var(--chalk);border:1px solid var(--line);border-radius:999px;padding:2px 9px 2px 3px;color:var(--ink);font-weight:600;text-decoration:none;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone;line-height:1.9;white-space:normal;transition:background .12s,transform .12s}
.tl:active{background:var(--pitch2);color:#fff;transform:scale(.97)}
.tl-c{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;color:#fff;font-size:8.5px;font-weight:800;margin-right:5px;vertical-align:1px;font-family:Inter,sans-serif;letter-spacing:-.2px}
.tl-ch{margin-left:4px;font-weight:800;color:var(--pitch2)}
.mc-eq .tl,.score .tl,.cr-head .tl{white-space:normal;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px;padding:6px 6px 5px;font-size:12.5px;line-height:1.2;text-align:center}
.mc-eq .tl .tl-c,.score .tl .tl-c,.cr-head .tl .tl-c{width:26px;height:26px;font-size:9.5px;margin:0}
.mc-eq .tl .tl-ch,.score .tl .tl-ch,.cr-head .tl .tl-ch{margin:0;font-size:11px;line-height:1}
.mc-eq .tl .tl-ch::before,.score .tl .tl-ch::before{content:"Ver ficha ";font-weight:600;font-size:10.5px}
tr.tap td{cursor:pointer}tr.tap:active td{background:var(--chalk)}
tr.tap td.p::after{content:" ›";font-weight:800;color:var(--pitch2)}
html[data-theme="estadio"] .tl{background:rgba(184,245,61,.08);border-color:rgba(184,245,61,.28);color:#eef3ff}
html[data-theme="estadio"] .tl:active{background:#b8f53d;color:#08101f}
.team{cursor:pointer;user-select:none;-webkit-user-select:none}
.drag{width:22px;align-self:stretch;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;margin-left:-6px;flex:none}
.drag svg{width:16px;height:16px}
.bellbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--pitch2);background:var(--chalk)}
.bellbtn svg{width:18px;height:18px}
.bellbtn.off{color:var(--muted);background:transparent;border:1px dashed var(--line)}
.team.dragging{z-index:5;position:relative;box-shadow:0 12px 30px rgba(0,0,0,.25);transform:scale(1.02)}
.team.mute .nm{opacity:.85}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:#1d2b24;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90%;text-align:center}
html[data-theme="estadio"] .toast{background:#b8f53d;color:#08101f}
.tag{display:inline-block;background:var(--accent);color:#fff;font-weight:700;font-size:11px;letter-spacing:.3px;padding:2px 8px;border-radius:999px;margin:0 0 3px;font-family:Inter,sans-serif}
.lbl{display:block;font-weight:600;margin:6px 0 6px}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px}
.theme{border:2px solid var(--line);border-radius:14px;padding:8px;text-align:left;background:var(--bg)}
.theme.on{border-color:var(--pitch2)}
.theme .pv{height:64px;border-radius:9px;margin-bottom:6px;position:relative;overflow:hidden}
.theme b{font-size:13px}
/* ===== Tema «Estadio»: noche de partido, focos y verde lima ===== */
html[data-theme="estadio"]{--bg:#070b16;--card:#101a2e;--ink:#eef3ff;--muted:#8e9bbd;--line:#1e2a45;--pitch:#0c1630;--pitch2:#b8f53d;--chalk:#14223e;--accent:#ff5a36;--win:#22c55e;--draw:#64748b;--loss:#ef4444;--bubble:#14223e;--radius:20px}
html[data-theme="estadio"] body{background:radial-gradient(900px 420px at 50% -180px,rgba(184,245,61,.13),transparent 60%),radial-gradient(700px 380px at 110% 0,rgba(61,123,255,.16),transparent 60%),#070b16;background-attachment:fixed}
html[data-theme="estadio"] header.top{background:radial-gradient(260px 120px at 8% -20px,rgba(255,255,255,.18),transparent 70%),radial-gradient(260px 120px at 92% -20px,rgba(255,255,255,.18),transparent 70%),linear-gradient(165deg,#15275a 0%,#0a1328 75%);border-bottom:1px solid rgba(184,245,61,.28);box-shadow:0 10px 30px rgba(0,0,0,.35)}
html[data-theme="estadio"] .top h1{letter-spacing:2px;text-shadow:0 0 18px rgba(184,245,61,.35)}
html[data-theme="estadio"] .top h1.tn{letter-spacing:.3px}
html[data-theme="estadio"] .top .sub{color:#b8f53d;opacity:.9}
html[data-theme="estadio"] .iconbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08)}
html[data-theme="estadio"] .maincta{border:1.5px solid transparent;background:linear-gradient(#101a2e,#101a2e) padding-box,linear-gradient(135deg,#b8f53d,#3d7bff) border-box;box-shadow:0 8px 24px rgba(61,123,255,.15)}
html[data-theme="estadio"] .maincta .ic{background:linear-gradient(135deg,#b8f53d,#5ee6a8);color:#08101f;box-shadow:0 0 18px rgba(184,245,61,.45)}
html[data-theme="estadio"] .team{background:linear-gradient(180deg,#111c33,#0d162a);border-color:#1e2a45;transition:transform .12s}
html[data-theme="estadio"] .team:active{transform:scale(.985)}
html[data-theme="estadio"] .team .side b{color:#b8f53d;font-size:24px}
html[data-theme="estadio"] .crest{border:none;box-shadow:0 0 0 2px #070b16,0 0 0 3.5px rgba(184,245,61,.55)}
html[data-theme="estadio"] .section-t{color:#6f7da3;letter-spacing:2px}
html[data-theme="estadio"] .addbtn{border-color:#2a3757;color:#b8f53d}
html[data-theme="estadio"] .demo-note{background:#0d1629;border:1px solid #1e2a45}
html[data-theme="estadio"] .msg.u{background:linear-gradient(135deg,#b8f53d,#7be35a);color:#08101f;font-weight:500}
html[data-theme="estadio"] .msg.b{background:#101a2e;border-color:#1e2a45}
html[data-theme="estadio"] .btn{background:#b8f53d;color:#08101f}
html[data-theme="estadio"] .btn.ghost{background:rgba(184,245,61,.12);color:#b8f53d}
html[data-theme="estadio"] .chip{background:rgba(255,255,255,.04);color:#d4f59a;border-color:#24304d}

<body>
<div class="app" id="app"></div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<script>
/* ============================================================
   CANTERA MADRID — fútbol base (Infantil, Cadete, Juvenil) de la Comunidad de Madrid
   Datos: RFFM (www.rffm.es), descargados por el robot del repositorio (data/*.json).
   ============================================================ */
const RAW="https://raw.githubusercontent.com/alexample/cantera-madrid/main/data/";
const DATA_BASE=(()=>{try{return new URLSearchParams(location.search).get("datos")||RAW}catch(e){return RAW}})();
const IA_URL="https://dondeloechan-ia.alexample.workers.dev/cantera-ia";
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const CATN={inf:"Infantil",cad:"Cadete",juv:"Juvenil"};
const CAT_ORDER=["inf","cad","juv"];

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[¿?¡!.,;:'"()\-\/]/g," ").replace(/\s+/g," ").trim();
const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fdate=d=>`${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`;
function rel(d){const diff=Math.round((d-TODAY)/864e5);if(diff===0)return"hoy";if(diff===1)return"mañana";if(diff===-1)return"ayer";if(diff>1&&diff<7)return"este "+DIAS[d.getDay()];return null}
const store={get(k,d){try{const v=localStorage.getItem("cm_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("cm_"+k,JSON.stringify(v))}catch(e){}}};
const SIGLAS=new Set(["a","d","c","f","u","s","e","r","sad","cd","ad","cf","ud","sd","ef","cde","adc","club","de","del","la","el","los","las","futbol","escuela","deportivo","deportiva","agrupacion","asociacion","sociedad","atletico","union","racing","real","rcd","cdf","ac","ce","cp","fc","ss","sporting","y","san"]);
// "A.D. ALCORCON A" -> "A.D. Alcorcón A" (respeta siglas)
function bonito(n){return String(n||"").toLowerCase().split(" ").map(w=>/\./.test(w)||/^[a-z]$/.test(w)||/^(sad|cd|ad|cf|ud|sd|cde|rcd|ef|ii|iii|iv|vi)$/.test(w)?w.toUpperCase():w.charAt(0).toUpperCase()+w.slice(1)).join(" ").replace(/\b(De|Del|La|Las|Los|El|Y)\b/g,x=>x.toLowerCase()).replace(/^./,c=>c.toUpperCase())}
function siglas(club){const w=norm(club).split(" ").filter(x=>x.length>1&&!SIGLAS.has(x));const s=(w[0]||norm(club).replace(/ /g,"")).slice(0,3).toUpperCase();return s}
function colorDe(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return `hsl(${h%360} 55% 38%)`}
const cap=s=>String(s).replace(/(^|\s)\p{L}/gu,c=>c.toUpperCase()).replace(/\b(De|Del|La|Las|Los|El)\b/g,w=>w.toLowerCase());
function km(a,b){if(!a||!b)return null;const R=6371,t=x=>x*Math.PI/180,dl=t(b[0]-a[0]),dn=t(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

/* ---------- datos ---------- */
let IDX=null;          // índice
let TEAMS=[];          // equipos
const TEAM=new Map();  // id -> equipo
const GD={};           // grupo -> datos cargados
const CAMPOS={};       // id -> {name, addr, loc, ll}
async function getJSON(name,{fresh=false}={}){
  const url=DATA_BASE+name+(fresh?(DATA_BASE.startsWith("http")?"?t="+Date.now():""):"");
  const r=await fetch(url,{cache:fresh?"no-store":"default"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}
function buildIndex(ix){
  IDX=ix;TEAMS=[];TEAM.clear();
  for(const [id,v] of Object.entries(ix.campos||{}))CAMPOS[id]={id,name:v[0],addr:v[1],loc:v[2],ll:v[3]!=null&&v[4]!=null?[v[3],v[4]]:null};
  for(let [id,n,c,gs,campo,esc] of ix.equipos){
    const grupos=gs.filter(g=>ix.grupos[g]);if(!grupos.length)continue;
    const g0=ix.grupos[grupos[0]];
    const cp=CAMPOS[campo]||null;
    c=String(c).replace(/\s+[A-Z]{1,2}$/,"");
    const t={id,raw:n,name:bonito(n),club:bonito(c),clubKey:norm(c),cat:g0[0],fem:!!g0[3],grupos,campo:cp,town:cp?cap(cp.loc.toLowerCase()):"",ll:cp?cp.ll:null};
    t.sig=siglas(c);t.color=colorDe(norm(c));t.esc=esc||"";
    t.sName=" "+norm(n+" "+c)+" ";t.sPlace=" "+norm([cp&&cp.loc,cp&&cp.name].join(" "))+" ";t.search=t.sName+t.sPlace;
    TEAMS.push(t);TEAM.set(id,t);
  }
}
const grupo=gid=>{const g=IDX.grupos[gid];return g&&{id:gid,cat:g[0],comp:bonito(g[1]),grupo:bonito(g[2]),fem:g[3],compId:g[4],tj:g[5],temp:g[6]}};
const grupoNombre=gid=>{const g=grupo(gid);return g?`${g.comp} · ${g.grupo}`:""};
async function loadGroup(gid,fresh){
  if(GD[gid]&&!fresh)return GD[gid];
  const cached=store.get("g_"+gid,null);
  if(cached&&!fresh&&Date.now()-(cached._t||0)<10*60e3){GD[gid]=prep(cached);return GD[gid]}
  try{const d=await getJSON("g/"+gid+".json",{fresh:true});d._t=Date.now();store.set("g_"+gid,d);GD[gid]=prep(d)}
  catch(e){if(cached){GD[gid]=prep(cached)}else throw e}
  return GD[gid];
}
function prep(d){
  d.matches=(d.part||[]).map(p=>({j:p[0],date:p[1]?new Date(p[1]+"T00:00:00"):null,time:p[2]||"",home:p[3],homeN:bonito(p[4]),away:p[5],awayN:bonito(p[6]),hg:p[7],ag:p[8],campo:p[9],campoN:p[10],acta:p[11]||"",gid:d.id,played:p[7]!=null&&p[8]!=null}));
  d.matches.sort((a,b)=>(a.j||0)-(b.j||0)||((a.date||0)-(b.date||0)));
  if(d.clas&&d.clas.length)d.table=d.clas.map(r=>({pos:r[0],id:r[1],name:bonito(r[2]),pj:r[3]||0,g:r[4]||0,e:r[5]||0,p:r[6]||0,gf:r[7]||0,gc:r[8]||0,pts:r[9]||0}));
  else{const tab={};const add=(id,n)=>tab[id]||(tab[id]={id,name:n,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0});
    d.matches.forEach(m=>{if(!m.home||!m.away)return;const h=add(m.home,m.homeN),a=add(m.away,m.awayN);if(!m.played)return;h.pj++;a.pj++;h.gf+=m.hg;h.gc+=m.ag;a.gf+=m.ag;a.gc+=m.hg;if(m.hg>m.ag){h.g++;a.p++;h.pts+=3}else if(m.hg<m.ag){a.g++;h.p++;a.pts+=3}else{h.e++;a.e++;h.pts++;a.pts++}});
    d.table=Object.values(tab).sort((x,y)=>y.pts-x.pts||(y.gf-y.gc)-(x.gf-x.gc)).map((r,i)=>({...r,pos:i+1}))}
  return d;
}
const teamGroup=t=>GD[t.grupos[0]];
const teamMatches=t=>{const d=teamGroup(t);return d?d.matches.filter(m=>m.home===t.id||m.away===t.id):[]};
const lastMatch=t=>teamMatches(t).filter(m=>m.played).sort((a,b)=>(a.date||0)-(b.date||0)||a.j-b.j).pop();
const nextMatch=t=>{const ms=teamMatches(t).filter(m=>!m.played);return ms.find(m=>m.date&&m.date>=TODAY)||ms.find(m=>!m.date)};
function outcome(m,id){const my=m.home===id?m.hg:m.ag,ot=m.home===id?m.ag:m.hg;return my>ot?"W":my<ot?"L":"D"}
const L=(id,name)=>{const t=TEAM.get(id);return t?`<a class="tl" data-ver="${esc(id)}" role="button"><span class="tl-c${t.esc?" ci":""}" style="background:${t.color}">${esc(t.sig)}${escudoImg(t)}</span>${esc(name)}<span class="tl-ch">›</span></a>`:esc(name)};
const fin=s=>/\.$/.test(s)?"":".";
const rivalOf=(m,id)=>m.home===id?{id:m.away,n:m.awayN}:{id:m.home,n:m.homeN};

/* ---------- estado ---------- */
const state={pila:[],etq:store.get("etiquetas",{}),avEq:store.get("avEq",{}),tema:store.get("tema","clasico"),follows:store.get("follows",[]).filter(Boolean),verified:store.get("verified",false),chats:{},iah:{},flow:null,view:"home",team:null};
const ANDROID=typeof window.AndroidApp!=="undefined";
// Pasa a Android los equipos seguidos (para los avisos en segundo plano)
function syncAndroid(){if(!ANDROID||!IDX)return;try{AndroidApp.guardarEquipos(JSON.stringify(state.follows.map(id=>TEAM.get(id)).filter(Boolean).map(t=>({id:t.id,g:t.grupos[0],n:t.name,e:state.etq[t.id]||"",av:state.avEq[t.id]||null}))))}catch(e){}}
const etiqueta=t=>state.etq[t.id]||"";
const silenciado=t=>!!(state.avEq[t.id]&&state.avEq[t.id].silencio);
function toast(msg){const d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function silenciar(t,on){
  if(on){const prev=state.avEq[t.id]&&!state.avEq[t.id].silencio?state.avEq[t.id]:null;state.avEq[t.id]={resultado:false,asignado:false,previo:false,horas:3,silencio:true,antes:prev}}
  else{const a=state.avEq[t.id];if(a&&a.antes)state.avEq[t.id]=a.antes;else delete state.avEq[t.id]}
  store.set("avEq",state.avEq);syncAndroid();
}
const tagHTML=t=>etiqueta(t)?`<span class="tag">⭐ ${esc(etiqueta(t))}</span><br>`:"";
/* Tema */
const TEMAS={clasico:{n:"Clásico",barra:"#0F5132"},estadio:{n:"Estadio",barra:"#0A1328"}};
function aplicarTema(){const k=TEMAS[state.tema]?state.tema:"clasico";document.documentElement.dataset.theme=k;if(ANDROID)try{AndroidApp.colorBarras(TEMAS[k].barra)}catch(e){}}
function follow(id){if(!state.follows.includes(id)){state.follows.push(id);store.set("follows",state.follows);syncAndroid();if(ANDROID&&state.follows.length===1)try{AndroidApp.pedirPermiso()}catch(e){}}}
function unfollow(id){state.follows=state.follows.filter(x=>x!==id);store.set("follows",state.follows);syncAndroid()}

/* ---------- piezas visuales ---------- */
// Escudo del club (imagen de la RFFM); si no carga, quedan las iniciales debajo
function escudoImg(t){if(!t||!t.esc)return "";const pth=t.esc.startsWith("http")?t.esc:(t.esc.startsWith("/")?t.esc:"/"+t.esc);
  const a=t.esc.startsWith("http")?t.esc:"https://appweb.rffm.es"+pth,b=t.esc.startsWith("http")?"":"https://www.rffm.es"+pth;
  return `<img src="${esc(a)}" data-alt="${esc(b)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="if(this.dataset.alt){this.src=this.dataset.alt;this.dataset.alt=''}else{this.remove()}">`}
const crest=(t,size)=>`<div class="crest${t.esc?" ci":""}" style="background:${t.color};${size?`width:${size}px;height:${size}px;font-size:${Math.round(size*.36)}px`:""}">${esc(t.sig)}${escudoImg(t)}</div>`;
const icons={
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>',
  send:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  chat:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  pin:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 003.4 0"/></svg>',
  bellOff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.7 3.6A6 6 0 0118 8c0 2.6.4 4.6.9 6M18 17H3s3-2 3-9c0-.7.1-1.3.3-1.9"/><path d="M10.3 21a1.9 1.9 0 003.4 0"/><path d="M3 3l18 18"/></svg>',
  grip:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>'
};
function mapLink(c,label){if(!c)return"";const q=c.ll?c.ll.join(","):encodeURIComponent(c.name+", "+c.addr+", "+c.loc);return `<a class="map" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">${icons.pin} ${label||"Abrir en mapas"}</a>`}
const opts=list=>`<div class="opts">${list.map(o=>`<button class="opt" data-ask="${esc(o.v||o.l||o)}">${o.ic?`<span>${o.ic}</span>`:""}${esc(o.l||o)}</button>`).join("")}</div>`;
function teamRow(t,extra){const f=state.follows.includes(t.id);return `<div class="prow">${crest(t,34)}<div class="grow"><b>${esc(t.name)}</b><div class="small">${extra??esc(grupoNombre(t.grupos[0]))}</div></div><button class="btn ${f?"ghost":""}" data-open="${t.id}">${f?"Abrir":"Seguir"}</button></div>`}
const teamCards=(ts,ll)=>`<div class="plist">${ts.map(t=>{const d=km(ll,t.ll);return teamRow(t,`${esc(CATN[t.cat])}${t.fem?" fem.":""} · ${esc(t.town||"")}${d!=null?` · a ${d<1?"menos de 1":Math.round(d)} km`:""}<br>${esc(grupoNombre(t.grupos[0]))}`)}).join("")}</div>`;

const nombreJ=n=>{const m=String(n).match(/^(.*?),\s*(.+)$/);return m?m[2]+" "+m[1]:n};
/* ---------- respuestas de la ficha ---------- */
function scoreCard(m){
  const c=CAMPOS[m.campo];
  return `<div class="score"><div class="t">${L(m.home,m.homeN)}</div><div class="r">${m.hg} – ${m.ag}</div><div class="t">${L(m.away,m.awayN)}</div></div>
  <div class="small" style="text-align:center">Jornada ${m.j??"?"}${m.date?" · "+fdate(m.date):""}${c||m.campoN?" · "+esc(c?c.name:m.campoN):""}</div>
  ${m.acta?`<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px">${ANDROID?`<button class="btn" data-crono="${esc(m.acta)}">⏱️ Cronología</button>`:""}<a class="btn ghost" style="display:inline-block;text-decoration:none" href="${urlActaRFFM(m)}" target="_blank" rel="noopener">📄 Acta (RFFM)</a></div>`:""}`;
}
function ansLast(t){
  const m=lastMatch(t);if(!m)return "Todavía no tiene resultados esta temporada.";
  const o=outcome(m,t.id);const verb={W:"ganó",D:"empató",L:"perdió"}[o];const r=m.date&&rel(m.date);
  return `${verb[0].toUpperCase()+verb.slice(1)} ${o==="D"?"con":o==="W"?"a":"contra"} <b>${L(rivalOf(m,t.id).id,rivalOf(m,t.id).n)}</b>${r?" "+r:""} (${m.home===t.id?"en casa":"fuera"}).${scoreCard(m)}`;
}
function ansNext(t){
  const m=nextMatch(t);if(!m)return "No quedan partidos en el calendario de este grupo.";
  const home=m.home===t.id;const r=m.date&&rel(m.date);const c=CAMPOS[m.campo];
  const cuando=m.date?`${r?r[0].toUpperCase()+r.slice(1)+" "+m.date.getDate()+" "+MESES[m.date.getMonth()]:fdate(m.date)}${m.time?" · "+m.time:""}`:"Fecha por confirmar";
  return `Próximo partido: <b>${home?"en casa":"fuera"}</b> contra <b>${L(rivalOf(m,t.id).id,rivalOf(m,t.id).n)}</b>${fin(rivalOf(m,t.id).n)}
  <div class="next"><div class="when">${cuando}</div>
  ${c?`<div>${esc(c.name)}</div><div class="small">${esc([c.addr,c.loc].filter(Boolean).join(", "))}</div>${mapLink(c)}`:m.campoN?`<div>${esc(m.campoN)}</div>`:`<div class="small">Campo por confirmar</div>`}</div>
  <div class="small">Jornada ${m.j??"?"} · ${esc(grupoNombre(t.grupos[0]))}</div>${meteoPH(m)}`;
}
function tableHTML(d,hl){
  return `<table class="st"><tr><th>#</th><th style="text-align:left">Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>DG</th><th>Pts</th></tr>

function findRival(t,q){
  const d=teamGroup(t);const rivals=d.table.filter(r=>r.id!==t.id);
  const words=q.split(" ").filter(w=>w.length>3&&!KW.includes(w)&&!["como","contra","nos","fue","partido","equipo","nuestro","vuestro","hemos","habeis","jugado","jugar","ante","frente","versus","esta","este","tal"].includes(w)&&!SIGLAS.has(w));
  const mio=norm(t.name);const ws=words.filter(w=>!mio.includes(w));
  let best=null,score=0;for(const r of rivals){const n=norm(r.name);const s=ws.filter(w=>n.includes(w)).length;if(s>score){score=s;best=r}}
  return best&&best.id;
}

const STOP=new Set(["busca","buscar","equipo","equipos","el","la","los","las","de","del","en","un","una","mi","hijo","hija","que","juega","donde","esta","quiero","ver","club","futbol","a","al","y","infantil","cadete","juvenil","femenino","femenina","masculino"]);
// Distancia de edición (con transposición) acotada: para tolerar faltas de ortografía
function dist(a,b,max){if(Math.abs(a.length-b.length)>max)return max+1;const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];for(let j=1;j<=b.length;j++)d[i][j]=i?0:j}
  for(let i=1;i<=a.length;i++){let best=1e9;for(let j=1;j<=b.length;j++){const c=a[i-1]===b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);best=Math.min(best,d[i][j])}if(best>max)return max+1}return d[a.length][b.length]}
let VOCAB=null;
function vocab(){if(VOCAB)return VOCAB;const v=new Set();for(const t of TEAMS)for(const w of t.search.split(" "))if(w.length>=3)v.add(w);for(const k of Object.keys(PLACES))for(const w of k.split(" "))if(w.length>=3)v.add(w);return VOCAB=[...v]}
// Para cada palabra: ella misma si existe; si no, las palabras parecidas del vocabulario
function expandir(w){
  const V=vocab();if(w.length<4||V.some(x=>x.includes(w)))return{alts:[w],fixed:null};
  const max=w.length>=7?2:1;let best=max+1,alts=[];
  for(const x of V){if(x.length<3)continue;const d=dist(w,x,max);if(d<best){best=d;alts=[x]}else if(d===best&&d<=max)alts.push(x)}
  return best<=max?{alts,fixed:alts[0]}:{alts:[w],fixed:null};
}
let ULTIMA_CORRECCION=null;
function searchTeams(text,{cat,fem}={}){
  const q=norm(text);cat=cat||catInText(q);fem=fem??(femInText(q)||null);
  const words=q.split(" ").filter(w=>w.length>1&&!STOP.has(w));
  ULTIMA_CORRECCION=null;
  let res=TEAMS.filter(t=>(!cat||t.cat===cat)&&(fem==null||t.fem===fem));
  if(words.length){
    const exp=words.map(expandir);const fixes=exp.filter(e=>e.fixed);
    if(fixes.length)ULTIMA_CORRECCION=words.map((w,i)=>exp[i].fixed||w).join(" ");
    res=res.map(t=>{let s=0,hit=0;for(const e of exp){let k=0;for(const w of e.alts){let kk=0;if(t.sName.includes(" "+w+" "))kk=3;else if(t.sName.includes(w))kk=2;else if(t.sPlace.includes(" "+w+" "))kk=1.5;else if(t.sPlace.includes(w))kk=1;k=Math.max(k,kk)}if(k)hit++;s+=k}return{t,s,hit}})
      .filter(x=>x.hit===words.length).sort((a,b)=>b.s-a.s||(a.t.club.length-b.t.club.length)||a.t.name.localeCompare(b.t.name)).map(x=>x.t);
  }else if(!cat)res=[];
  return res;
}

function nearestClubs(ll,cat,limit=5,fem=null){
  const best={};for(const t of TEAMS){if(cat&&t.cat!==cat)continue;if(fem!=null&&t.fem!==fem)continue;const d=ll&&t.ll?km(ll,t.ll):null;const b=best[t.clubKey];if(!b||(d!=null&&(b.d==null||d<b.d)))best[t.clubKey]={club:t.club,key:t.clubKey,d,town:t.town}}
  return Object.values(best).sort((a,b)=>(a.d??1e9)-(b.d??1e9)||a.club.localeCompare(b.club)).slice(0,limit);

const PROTEGIDAS=new Set("cuantos cuantas cuanto bajamos subimos ganados perdidos empatados partido partidos ultimos ultimas puedo preguntar llevamos llevan lleva tal que como esta estan estamos vamos van tenemos hemos habeis donde cuando quien quienes sabes sabe dime hace hacen nuestro nuestra equipo liga grupo semana dias campo campos hijo hija mismo todo todos".split(" "));
const ABREV={q:"que",k:"que",ke:"que",dnd:"donde",dnde:"donde",dond:"donde",ora:"hora",hra:"hora",hr:"hora",xq:"porque",pq:"porque",tb:"tambien",mñn:"manana",mnn:"manana",kdamos:"quedamos",kedamos:"quedamos",keda:"queda",kien:"quien",qien:"quien",cuado:"cuando",cnd:"cuando",cdo:"cuando",prox:"proximo",clasi:"clasificacion",clasif:"clasificacion",resul:"resultado",finde:"finde",jor:"jornada"};
function corregir(q){
  return q.split(" ").map(w=>ABREV[w]||w).map(w=>{if(PROTEGIDAS.has(w))return w;if(w.length<4||KW.includes(w)||/^\d+$/.test(w))return w;let best=w,bd=w.length>=7?2:1;for(const k of KW){if(Math.abs(k.length-w.length)>bd)continue;const d=dist(w,k,bd);if(d<bd||(d===bd&&best===w&&d<=bd)){best=k;bd=d}}return best}).join(" ");
}

  ["proximo",R(/(proxim|siguiente|cuando (jug|juega|es|toca)|a que hora|que hora|hora|horario|donde (jug|juega|es|se juega)|campo|direccion|como (se )?lleg|ubicacion|mapa|contra quien|quien (nos )?toca|que (nos )?toca|rival|hoy|manana|este (sabado|domingo|finde)|\bel (sabado|domingo)$|esta semana|semana que viene)/)],

function intencion(text){
  const q0=norm(text);const q=corregir(q0);
  for(const [id,f] of INTENCIONES)if(f(q))return{id,q};
  return{id:null,q};
}
function ansPuntos(t){
  const d=teamGroup(t);const tab=d.table;const me=tab.find(r=>r.id===t.id);if(!me)return ansTable(t);
  const lider=tab[0],n=tab.length;const ult=tab[n-1];
  const zonaBaja=Math.max(1,n-2);const bajo=tab[zonaBaja-1];
  let s=`<b>${me.pos}º</b> con <b>${me.pts} puntos</b> (${me.pj} jugados).<br>`;
  s+=me.pos===1?`Líder, con ${me.pts-tab[1].pts} de ventaja sobre el 2º.`:`A <b>${lider.pts-me.pts}</b> del líder (${esc(lider.name)}).`;
  if(me.pos>1&&me.pos<n)s+=`<br>Al ${me.pos-1}º: ${tab[me.pos-2].pts-me.pts} pts · Al ${me.pos+1}º: ${me.pts-tab[me.pos].pts} pts de margen.`;
  s+=`<br>El colista tiene ${ult.pts} puntos.`;
  return s+`<div class="small" style="margin-top:6px">Los puestos exactos de ascenso y descenso dependen de las bases de cada competición de la RFFM.</div>`;
}
function ansEstad(t){
  const ms=teamMatches(t).filter(m=>m.played);if(!ms.length)return "Todavía no hay partidos jugados.";
  let g=0,e=0,p=0,gf=0,gc=0,c={g:0,e:0,p:0},f={g:0,e:0,p:0};
  for(const m of ms){const casa=m.home===t.id;const a=casa?m.hg:m.ag,b=casa?m.ag:m.hg;gf+=a;gc+=b;const o=a>b?"g":a<b?"p":"e";({g:()=>g++,e:()=>e++,p:()=>p++})[o]();(casa?c:f)[o]++}

/* ---------- previsión meteorológica (Open-Meteo, sin clave) ----------
   Se muestra en el próximo partido si hay coordenadas del campo y faltan ≤ 15 días.

const METEO={};

  const c=CAMPOS[m.campo];if(!c||!c.ll||!m.date||!m.time)return "";
  const dias=(m.date-TODAY)/864e5;if(dias<0)return "";
  if(dias>15)return `<div class="small" style="margin-top:8px">🌦️ La previsión del tiempo aparecerá 15 días antes del partido.</div>`;
  const iso=`${m.date.getFullYear()}-${String(m.date.getMonth()+1).padStart(2,"0")}-${String(m.date.getDate()).padStart(2,"0")}`;
  return `<div class="meteo" data-m="${c.ll[0]}|${c.ll[1]}|${iso}|${m.time}"><div class="small">🌦️ Cargando la previsión del tiempo…</div></div>`;
}
async function datosMeteo(lat,lon,iso){
  const k=`${lat},${lon},${iso}`;if(METEO[k]&&Date.now()-METEO[k].t<30*60e3)return METEO[k].d;
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m&timezone=Europe%2FMadrid&start_date=${iso}&end_date=${iso}`;
  const r=await fetch(url);if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();METEO[k]={t:Date.now(),d};return d;
}
function meteoHTML(d,hora){
  const H=+hora.split(":")[0];const h=d.hourly;const ini=Math.max(0,Math.min(18,H-2));const idx=[...Array(6).keys()].map(i=>ini+i);
  const T=idx.map(i=>h.temperature_2m[i]),P=idx.map(i=>h.precipitation_probability[i]??0),C=idx.map(i=>h.weather_code[i]),V=idx.map(i=>h.wind_speed_10m[i]),MM=idx.map(i=>h.precipitation[i]??0);

  const tmin=Math.floor(Math.min(...T))-1,tmax=Math.ceil(Math.max(...T))+1;const yT=v=>8+(1-(v-tmin)/(tmax-tmin||1))*44;

  const linea=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");

  const yP=v=>110-v*0.44;

   ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===k?5:3.5}" class="mt-dot${i===k?" on":""}"/>`).join("")}
   <text x="${pts[k][0]}" y="${pts[k][1]-9}" text-anchor="middle" class="mt-val">${Math.round(T[k])}°</text>
   <text x="4" y="70" class="mt-t">Probabilidad de lluvia (%)</text>
   <line x1="0" x2="${W}" y1="110" y2="110" class="mt-base"/>
   ${P.map((v,i)=>{const hgt=Math.max(1.5,v*0.44);return `<path d="M${i*col+pad} 110 V${(110-hgt+4).toFixed(1)} q0 -4 4 -4 H${(i+1)*col-pad-4} q4 0 4 4 V110 Z" class="mt-bar${i===k?" on":""}"/>`}).join("")}
   <text x="${k*col+col/2}" y="${yP(P[k])-5}" text-anchor="middle" class="mt-val">${P[k]}%</text>
   ${idx.map((x,i)=>`<text x="${i*col+col/2}" y="128" text-anchor="middle" class="mt-x${i===k?" on":""}">${String(x).padStart(2,"0")}h</text>`).join("")}
   ${idx.map((x,i)=>`<rect x="${i*col}" y="0" width="${col}" height="136" fill="transparent" data-mh="${i}" style="cursor:pointer"/>`).join("")}
  </svg>`;
  const det=i=>`${String(idx[i]).padStart(2,"0")}:00 · ${WMO(C[i])[0]} ${WMO(C[i])[1]} · ${Math.round(T[i])}° · lluvia ${P[i]}% (${MM[i]} mm) · viento ${Math.round(V[i])} km/h`;
  return `<div class="mt-head"><span class="mt-ic">${ic}</span><div><b>${txt} · ${Math.round(T[k])}°</b><div class="small">A la hora del partido: lluvia ${P[k]}% · viento ${Math.round(V[k])} km/h</div></div></div>
   <div class="mt-icons">${C.map((c,i)=>`<span class="${i===k?"on":""}">${WMO(c)[0]}</span>`).join("")}</div>${svg}

   <div class="small" style="opacity:.7">Toca una hora para ver el detalle · Open-Meteo</div>`;
}

    if(!y)return "No lo he entendido. Escribe el año de nacimiento (por ejemplo «2012») o la edad (por ejemplo «13 años»).";
    y=+y;const r=catFromYear(y);
    if(r.other){state.flow=null;return `Nacido en ${y} juega en <b>${r.other}</b>. De momento la app cubre Infantil, Cadete y Juvenil.${more()}`}
    if(r.none)return `Con ${y} no encaja en fútbol base. Infantil ${yrs("inf")}, Cadete ${yrs("cad")}, Juvenil ${yrs("juv")}.`;
    d.cat=r.cat;d.year=y;f.step=0.5;
    return `Nacido en ${y}${d.fromAge?" (calculado por la edad)":""} → <b>${CATN[d.cat]}</b> esta temporada.<br><br>`+wizardAsk();
  }
  if(f.step===0.5){d.fem=/femen|chica|nina/.test(q)?true:/mascul|mixto|chico|nino/.test(q)?false:null;f.step=1;return wizardAsk()}
  if(f.step===1){
    if(/(me da igual|da igual|cualquier|no se)/.test(q))d.place=null;
    else{const p=findPlace(text);
      if(!p){const byName=searchTeams(text,{cat:d.cat});if(byName.length){state.flow=null;return `He encontrado estos equipos ${CATN[d.cat]}:`+teamCards(byName.slice(0,8))+more()}
        return "No conozco ese sitio. Prueba con el municipio o distrito (por ejemplo «Carabanchel», «Móstoles») o pulsa «Me da igual»."+opts(["Me da igual"])}
      d.place=p}
    f.step=2;return (d.place?`Zona: <b>${esc(cap(d.place.name))}</b>.<br><br>`:"")+wizardAsk();
  }
  if(f.step===2){
    const ll=d.place&&d.place.ll;state.flow=null;
    let club=null;
    if(text.startsWith("club:"))club=text.slice(5);
    else if(!/no (lo )?se|ni idea|ninguno/.test(q)){const r=searchTeams(text,{cat:d.cat,fem:d.fem});if(r.length)club=r[0].clubKey}
    if(club){const ts=TEAMS.filter(t=>t.clubKey===club&&t.cat===d.cat&&(d.fem==null||t.fem===d.fem)).sort(ordenEquipos);
      return `${ts.length===1?"Este es su equipo:":`El club tiene ${ts.length} equipos ${CATN[d.cat]}. Elige el suyo:`}${teamCards(ts,ll)}<div class="small" style="margin-top:6px">Pulsa «Seguir» para tener su ficha con resultados, próximo partido y clasificación.</div>${more()}`}
    const ts=ll?nearestTeams(ll,{cat:d.cat,fem:d.fem,limit:6}):[];
    if(!ts.length)return `Hay ${TEAMS.filter(t=>t.cat===d.cat).length} equipos ${CATN[d.cat]}. Escribe el nombre del club o el municipio para encontrarlo.`+opts(["Buscar un equipo"]);
    return `Equipos <b>${CATN[d.cat]}</b> con campo más cerca de ${esc(cap(d.place.name))}:${teamCards(ts,ll)}${more()}`;
  }
}

/* ---------- IA ---------- */
const CUPO_IA=5;
function noEntiendo(text,t){
  const ia=`<div style="margin-top:10px"><button class="btn ghost" data-ask="${esc("ia:"+text)}">🤖 Preguntar a la IA</button><div class="small" style="margin-top:4px">Solo para preguntas poco habituales (máximo ${CUPO_IA} al día).</div></div>`;
  if(t)return `No estoy seguro de qué me preguntas. Prueba con una de estas:`+opts(CHIPS_TEAM)+ia;
  return HELP_MAIN+opts(MENU)+ia;
}
async function preguntarIAconCupo(key,text,t){
  const hoy=new Date().toISOString().slice(0,10);const c=store.get("ia_cupo",{d:"",n:0});if(c.d!==hoy){c.d=hoy;c.n=0}
  if(c.n>=CUPO_IA)return `Has usado las ${CUPO_IA} preguntas a la IA de hoy. Mañana tendrás más; mientras tanto, pregúntame lo habitual (resultados, próximo partido, clasificación…).`;
  if(!iaDisponible())return "La IA solo está disponible en la app de Android.";
  if(t)await loadGroup(t.grupos[0]);
  const r=await preguntarIA(key,text,t?contextoEquipo(t):contextoGeneral());
  if(r&&!r.includes('class="small">La IA')&&!r.includes("Sin conexión")){c.n++;store.set("ia_cupo",c)}
  return r||"La IA no ha podido responder ahora mismo.";
}
const esPregunta=x=>/[?¿]/.test(x)||/^(que|como|cuando|donde|cual|cuales|quien|cuantos|cuantas|por que|puedo|hay|es|se puede)\b/.test(norm(x));
const iaDisponible=()=>location.host==="appassets.androidplatform.net";
function contextoEquipo(t){
  const d=teamGroup(t);const L=[`FICHA: ${t.name} (${CATN[t.cat]}${t.fem?" femenino":""}). Competición: ${grupoNombre(d.id)}.`,t.campo?`Campo habitual: ${t.campo.name}, ${t.campo.addr}, ${t.campo.loc}.`:"",`Hoy es ${fdate(TODAY)} de ${TODAY.getFullYear()}.`,"","CLASIFICACIÓN (pos equipo PJ G E P GF GC Pts):"];
  d.table.forEach(r=>L.push(`${r.pos}. ${r.name} ${r.pj} ${r.g} ${r.e} ${r.p} ${r.gf} ${r.gc} ${r.pts}`));
  L.push("","ÚLTIMOS Y PRÓXIMOS PARTIDOS DEL EQUIPO:");
  const tm=teamMatches(t);const jug=tm.filter(m=>m.played).slice(-5),pen=tm.filter(m=>!m.played).slice(0,5);
  [...jug,...pen].forEach(m=>{const c=CAMPOS[m.campo];L.push(`J${m.j} ${m.date?fdate(m.date):"fecha por confirmar"} ${m.time} · ${m.homeN} ${m.played?m.hg+"-"+m.ag:"vs"} ${m.awayN}${c?` · ${c.name} (${c.addr}, ${c.loc})`:m.campoN?" · "+m.campoN:""}`)});
  const gol=(d.gol||[]).filter(g=>g[1]===t.id);if(gol.length){L.push("","GOLEADORES DEL EQUIPO:");gol.forEach(g=>L.push(`${nombreJ(g[0])}: ${g[2]}`))}
  return L.join("\n");
}
function contextoGeneral(){return `Hoy es ${fdate(TODAY)} de ${TODAY.getFullYear()}. La app tiene ${TEAMS.length} equipos de fútbol 11 Infantil, Cadete y Juvenil de la Comunidad de Madrid (datos de la RFFM). En este chat se buscan equipos por club, municipio o categoría; las fichas de cada equipo dan resultados, calendario y clasificación. Categorías por año de nacimiento esta temporada: Infantil ${yrs("inf")}, Cadete ${yrs("cad")}, Juvenil ${yrs("juv")}, Alevín ${OTHER_YEARS[0].y.join("–")}.`}
const fmtIA=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^- /gm,"• ").replace(/\n/g,"<br>");
async function preguntarIA(key,text,contexto){
  if(!iaDisponible())return null;
  const hist=state.iah[key]||(state.iah[key]=[]);const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),25000);
  try{const r=await fetch(IA_URL,{method:"POST",headers:{"Content-Type":"application/json"},signal:ctl.signal,body:JSON.stringify({pregunta:text,historial:hist.slice(-6),contexto})});
    const d=await r.json();if(!r.ok||!d.respuesta)return `<span class="small">${esc(d.error||"La IA no ha podido responder ahora mismo.")}</span>`;
    hist.push({rol:"usuario",texto:text},{rol:"asistente",texto:d.respuesta});
    return fmtIA(d.respuesta)+`<div class="small" style="margin-top:6px">IA · puede equivocarse</div>`}
  catch(e){return `<span class="small">${navigator.onLine===false?"Sin conexión: el asistente necesita internet.":"La IA está tardando demasiado. Inténtalo otra vez."}</span>`}
  finally{clearTimeout(tm)}
}

// Arrastrar la manija (⋮⋮) para cambiar el orden de «Mis equipos»
function activarArrastre(cont){
  cont.onpointerdown=e=>{
    const h=e.target.closest("[data-drag]");if(!h)return;
    const row=h.closest(".team");e.preventDefault();h.setPointerCapture(e.pointerId);
    const filas=()=>[...cont.querySelectorAll(".team")];
    const y0=e.clientY;let dy=0;row.classList.add("dragging");window.__arrastrando=true;
    const alto=row.getBoundingClientRect().height+10;
    let base=y0;
    const mover2=ev=>{dy=ev.clientY-base;row.style.transform=`translateY(${dy}px) scale(1.02)`;
      const fs=filas();const i=fs.indexOf(row);
      if(dy>alto*0.6&&i<fs.length-1){fs[i+1].after(row);base+=alto;row.style.transform=`translateY(${ev.clientY-base}px) scale(1.02)`}
      else if(dy<-alto*0.6&&i>0){fs[i-1].before(row);base-=alto;row.style.transform=`translateY(${ev.clientY-base}px) scale(1.02)`}};
    const fin=()=>{h.removeEventListener("pointermove",mover2);h.removeEventListener("pointerup",fin);h.removeEventListener("pointercancel",fin);
      row.classList.remove("dragging");row.style.transform="";
      state.follows=filas().map(r=>r.dataset.team);store.set("follows",state.follows);syncAndroid();
      setTimeout(()=>window.__arrastrando=false,50)};
    h.addEventListener("pointermove",mover2);h.addEventListener("pointerup",fin);h.addEventListener("pointercancel",fin);
  };
}

  if(t&&$("#tfol"))$("#tfol").onclick=()=>{follow(t.id);render();setTimeout(()=>openTeamSettings(t),150)};
}
function openSheet(html,bind){$("#sheet").innerHTML=html;$("#sheetBg").style.display="block";requestAnimationFrame(()=>$("#sheet").classList.add("open"));bind&&bind()}
function closeSheet(){$("#sheet").classList.remove("open");$("#sheetBg").style.display="none"}
$("#sheetBg").onclick=closeSheet;
function openTeamSettings(t){
  const guardado=silenciado(t)?state.avEq[t.id].antes:state.avEq[t.id];
  const propio=!!guardado;const av=Object.assign({},propio?guardado:leerAvisos());let mute=silenciado(t);
  const sw=(k,tt,d)=>`<div class="tog"><div class="grow"><b>${tt}</b><div class="small">${d}</div></div><button class="sw ${av[k]?"on":""}" data-tsw="${k}" aria-label="${tt}"></button></div>`;
  openSheet(`<h3>${esc(t.name)}</h3>
   <span class="lbl">Etiqueta</span>
   <input class="search" id="etq" maxlength="24" placeholder="Ej.: Adrián, Mi hijo, Sobrino…" value="${esc(etiqueta(t))}">
   <div class="chips" style="padding:0 0 6px">${["Mi hijo","Mi hija","Sobrino","Nieto","Mi equipo"].map(x=>`<button class="chip" data-etq="${x}">${x}</button>`).join("")}</div>
   <div style="margin:4px 0 2px">${linkRFFM(urlEquipoRFFM(t),"Ficha oficial y plantilla en la RFFM")}</div>
   <div class="section-t">Avisos de este equipo</div>
   <div class="tog"><div class="grow"><b>Recibir avisos de este equipo</b><div class="small">Desactívalo para seguirlo sin notificaciones.</div></div><button class="sw ${silenciado(t)?"":"on"}" id="activos" aria-label="Recibir avisos"></button></div>
   <div id="detalleAv" class="${silenciado(t)?"hidden":""}">
   <div class="tog"><div class="grow"><b>Usar los ajustes generales</b><div class="small">Desactívalo para elegir avisos solo para este equipo.</div></div><button class="sw ${propio?"":"on"}" id="gen" aria-label="Usar ajustes generales"></button></div>
   <div id="propios" class="${propio?"":"hidden"}">
    ${sw("resultado","Resultados","Cuando se publique el resultado.")}
    ${sw("asignado","Partido asignado","Cuando se fije o cambie fecha, hora o campo.")}
    ${sw("previo","Antes del partido","Con el campo y cómo llegar.")}
    <div class="tog"><div class="grow"><b>¿Cuánto antes?</b></div><div class="chips" style="padding:0">${[1,2,3,4,6].map(h=>`<button class="chip" data-th="${h}" style="${av.horas===h?"background:var(--pitch2);color:var(--bg)":""}">${h} h</button>`).join("")}</div></div>
   </div>
   </div>
   <div style="display:flex;gap:10px;margin-top:16px"><button class="btn ghost" id="unf2" style="flex:1;padding:12px;color:var(--loss)">Dejar de seguir</button><button class="btn" id="ok" style="flex:1;padding:12px">Listo</button></div>`,()=>{
    let usarGen=!propio;
    const guardar=()=>{const e=$("#etq").value.trim();if(e)state.etq[t.id]=e;else delete state.etq[t.id];store.set("etiquetas",state.etq);
      const prop=usarGen?null:{resultado:!!av.resultado,asignado:!!av.asignado,previo:!!av.previo,horas:av.horas||3};
      if(mute)state.avEq[t.id]={resultado:false,asignado:false,previo:false,horas:3,silencio:true,antes:prop};
      else if(prop)state.avEq[t.id]=prop;else delete state.avEq[t.id];
      store.set("avEq",state.avEq);syncAndroid()};
    $("#activos").onclick=()=>{mute=!mute;$("#activos").classList.toggle("on",!mute);$("#detalleAv").classList.toggle("hidden",mute);guardar()};
    document.querySelectorAll("[data-etq]").forEach(b=>b.onclick=()=>{$("#etq").value=b.dataset.etq;guardar()});
    $("#etq").onchange=guardar;
    $("#gen").onclick=()=>{usarGen=!usarGen;$("#gen").classList.toggle("on",usarGen);$("#propios").classList.toggle("hidden",usarGen);guardar()};
    document.querySelectorAll("[data-tsw]").forEach(b=>b.onclick=()=>{const k=b.dataset.tsw;av[k]=!av[k];b.classList.toggle("on",av[k]);guardar()});
    document.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{av.horas=+b.dataset.th;document.querySelectorAll("[data-th]").forEach(x=>x.style.cssText=+x.dataset.th===av.horas?"background:var(--pitch2);color:var(--bg)":"");guardar()});
    $("#ok").onclick=()=>{guardar();closeSheet();delete state.chats[t.id];render()};
    $("#unf2").onclick=()=>{guardar();openConfirmUnfollow(t)};
  });
}
function openConfirmUnfollow(t){
  openSheet(`<h3>¿Dejar de seguir?</h3><p>${esc(t.name)} desaparecerá de tus equipos.</p><div style="display:flex;gap:10px"><button class="btn ghost" id="no" style="flex:1;padding:12px">Cancelar</button><button class="btn" id="yes" style="flex:1;padding:12px;background:var(--loss)">Dejar de seguir</button></div>`,()=>{
    $("#no").onclick=closeSheet;$("#yes").onclick=()=>{delete state.etq[t.id];delete state.avEq[t.id];store.set("etiquetas",state.etq);store.set("avEq",state.avEq);unfollow(t.id);delete state.chats[t.id];closeSheet();state.view="home";render()}});
}
function leerAvisos(){let a={};if(ANDROID)try{a=JSON.parse(AndroidApp.leerAjustes()||"{}")}catch(e){}return Object.assign({resultado:true,asignado:true,previo:true,horas:3},a)}
function openSettings(){
  const av=leerAvisos();const sw=(k,t,d)=>`<div class="tog"><div class="grow"><b>${t}</b><div class="small">${d}</div></div><button class="sw ${av[k]?"on":""}" data-sw="${k}" aria-label="${t}"></button></div>`;
  const permiso=ANDROID?(()=>{try{return AndroidApp.puedeNotificar()}catch(e){return true}})():true;
  openSheet(`<h3>Ajustes</h3>
   <div class="section-t" style="margin-top:4px">Avisos de mis equipos</div>
   ${ANDROID?"":`<div class="small" style="margin-bottom:8px">Los avisos funcionan en la app de Android.</div>`}
   ${permiso?"":`<div class="small" style="margin-bottom:8px;color:var(--loss)">Las notificaciones están desactivadas para esta app. <button class="btn ghost" id="permiso" style="margin-top:6px">Activarlas</button></div>`}
   ${sw("resultado","Resultados","Cuando la federación publica el resultado.")}
   ${sw("asignado","Partido asignado","Cuando se fija o cambia la fecha, la hora o el campo.")}
   ${sw("previo","Antes del partido","Con el campo y cómo llegar.")}
   <div class="tog"><div class="grow"><b>¿Cuánto antes?</b></div><div class="chips" style="padding:0">${[1,2,3,4,6].map(h=>`<button class="chip" data-h="${h}" style="${av.horas===h?"background:var(--pitch2);color:#fff":""}">${h} h</button>`).join("")}</div></div>
   <div class="section-t">Apariencia</div>
   <div class="themes">
    <button class="theme ${state.tema==="clasico"?"on":""}" data-tema="clasico"><div class="pv" style="background:repeating-linear-gradient(90deg,#0f5132 0 16px,#14603d 16px 32px)"><div style="position:absolute;left:8px;right:8px;bottom:8px;height:18px;border-radius:6px;background:#f3f1ea"></div></div><b>Clásico</b><div class="small">Verde césped, claro</div></button>
    <button class="theme ${state.tema==="estadio"?"on":""}" data-tema="estadio"><div class="pv" style="background:radial-gradient(60px 30px at 15% 0,rgba(255,255,255,.35),transparent),radial-gradient(60px 30px at 85% 0,rgba(255,255,255,.35),transparent),linear-gradient(165deg,#15275a,#070b16)"><div style="position:absolute;left:8px;right:8px;bottom:8px;height:18px;border-radius:6px;background:linear-gradient(135deg,#b8f53d,#5ee6a8)"></div></div><b>Estadio</b><div class="small">Noche de partido</div></button>
   </div>
   <div class="section-t">Cuenta</div>
   <div class="tog"><div class="grow"><b>Cuenta verificada</b><div class="small">Permite buscar jugadores por nombre. En la versión final lo validará el club o la familia.</div></div><button class="sw ${state.verified?"on":""}" id="vsw" aria-label="Cuenta verificada"></button></div>
   <div class="tog"><div class="grow"><b>Datos</b><div class="small">Real Federación de Fútbol de Madrid (rffm.es), ${esc(IDX.temporada)}. Se actualizan varias veces al día. App no oficial.</div></div><button class="btn ghost" id="upd">Actualizar</button></div>`,()=>{
    const guardar=()=>{if(ANDROID)try{AndroidApp.guardarAjustes(JSON.stringify(av))}catch(e){}};
    document.querySelectorAll("[data-sw]").forEach(b=>b.onclick=()=>{const k=b.dataset.sw;av[k]=!av[k];b.classList.toggle("on",av[k]);guardar()});
    document.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{av.horas=+b.dataset.h;document.querySelectorAll("[data-h]").forEach(x=>x.style.cssText=+x.dataset.h===av.horas?"background:var(--pitch2);color:#fff":"");guardar()});
    if($("#permiso"))$("#permiso").onclick=()=>{try{AndroidApp.pedirPermiso();AndroidApp.abrirAjustesNotificaciones()}catch(e){}};
    document.querySelectorAll("[data-tema]").forEach(b=>b.onclick=()=>{state.tema=b.dataset.tema;store.set("tema",state.tema);aplicarTema();document.querySelectorAll("[data-tema]").forEach(x=>x.classList.toggle("on",x.dataset.tema===state.tema))});
    $("#vsw").onclick=()=>{state.verified=!state.verified;store.set("verified",state.verified);$("#vsw").classList.toggle("on",state.verified)};
    $("#upd").onclick=async()=>{$("#upd").textContent="…";await boot(true);closeSheet()};
  });
}
function volver(){const p=state.pila.pop();if(p){state.view=p.view;state.team=p.team}else state.view="home";render()}
window.atras=()=>{
  if($("#sheet").classList.contains("open")){closeSheet();return true}
  if(state.view!=="home"){volver();return true}
  return false;
};
window.abrirEquipo=id=>{if(!IDX||!TEAM.get(id)){window.__pendiente=id;return}closeSheet();state.view="team";state.team=id;render()};
function abrirPendiente(){const h=(location.hash.match(/^#e-(.+)$/)||[])[1];const id=window.__pendiente||h;if(id&&TEAM.get(id)){window.__pendiente=null;try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}state.view="team";state.team=id;render()}}
aplicarTema();
async function boot(fresh){
  const cached=store.get("indice",null);
  if(cached&&!fresh){buildIndex(cached);addLocalities();render();syncAndroid();abrirPendiente()}
  else if(!IDX)render();
  try{
    const ix=await getJSON("indice.json",{fresh:true});
    if(!cached||ix.act!==cached.act||fresh){store.set("indice",ix);buildIndex(ix);VOCAB=null;addLocalities();Object.keys(GD).forEach(k=>delete GD[k]);if(state.view==="home")render();syncAndroid();abrirPendiente()}
  }catch(e){if(!IDX)renderLoading($("#app"),e.message)}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&IDX)boot()});
boot();

</script>
</body>
</html>
