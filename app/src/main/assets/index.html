<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cantera Madrid</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ea; --card:#ffffff; --ink:#15211b; --muted:#66736b; --line:#e2dfd4;
  --pitch:#0f5132; --pitch2:#16714a; --chalk:#e9f5ee; --accent:#d9480f; --win:#2b8a3e; --draw:#868e96; --loss:#c92a2a;
  --bubble:#e6efe9; --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0e1411;--card:#17201b;--ink:#e8efe9;--muted:#93a39a;--line:#26322b;--chalk:#1d2b24;--bubble:#1f2c25}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
header.top{background:var(--pitch);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 18px 16px;
  background-image:repeating-linear-gradient(90deg,transparent 0 38px,rgba(255,255,255,.05) 38px 76px)}
.top h1{font-family:"Barlow Condensed",sans-serif;font-size:28px;letter-spacing:.5px;margin:0;line-height:1}
.top .sub{opacity:.8;font-size:13px;margin-top:4px}
.toprow{display:flex;align-items:center;gap:10px}
.toprow .grow{flex:1;min-width:0}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff;flex:none}
.iconbtn svg{width:20px;height:20px}
main{flex:1;overflow-y:auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px)}
.section-t{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-size:14px;margin:18px 2px 8px}
.maincta{width:100%;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:left}
.maincta .ic{width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.maincta b{display:block;font-size:16px}
.maincta span{color:var(--muted);font-size:13px}
.team{width:100%;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;text-align:left}
.crest{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:700;font-size:16px;flex:none;border:2px solid rgba(255,255,255,.6);box-shadow:0 0 0 1px var(--line)}
.team .info{flex:1;min-width:0}
.team .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.team .side{text-align:right;font-size:12px;color:var(--muted)}
.team .side b{display:block;font-family:"Barlow Condensed",system-ui,sans-serif;font-size:20px;color:var(--ink)}
.addbtn{width:100%;border:1.5px dashed var(--line);border-radius:var(--radius);padding:14px;color:var(--pitch2);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:20px 10px;font-size:14px}
.demo-note{margin-top:22px;font-size:12px;color:var(--muted);line-height:1.5;background:var(--chalk);padding:12px 14px;border-radius:12px}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;line-height:1.45;white-space:normal}
.msg.u{align-self:flex-end;background:var(--pitch2);color:#fff;border-bottom-right-radius:4px}
.msg.b{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.b.wide{max-width:100%;width:100%}
.composer{border-top:1px solid var(--line);background:var(--card);padding:8px 10px calc(env(safe-area-inset-bottom) + 8px)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;background:var(--chalk);color:var(--pitch2);font-size:13px;font-weight:500;border:1px solid var(--line)}
@media (prefers-color-scheme: dark){.chip{color:#8ce0b0}}
form.inp{display:flex;gap:8px}
form.inp input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:11px 16px;font:inherit;font-size:16px;outline:none}
form.inp input:focus{border-color:var(--pitch2)}
form.inp button{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
/* cards inside answers */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:8px 0 4px;text-align:center}
.score .t{font-size:13px;font-weight:600;line-height:1.2}
.score .r{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:30px;font-weight:700;padding:2px 12px;border-radius:10px;background:var(--chalk)}
.small{font-size:12.5px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:6px;padding:2px 7px;margin-right:4px;font-family:Inter}
.W{background:var(--win)}.D{background:var(--draw)}.L{background:var(--loss)}
table.st{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.st th{font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;padding:4px 3px;text-align:center}
table.st td{padding:6px 3px;text-align:center;border-top:1px solid var(--line)}
table.st td.n{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
table.st tr.me td{background:var(--chalk);font-weight:700}
table.st td.p{font-weight:700}
.next{border-left:4px solid var(--accent);padding:6px 0 6px 10px;margin:8px 0}
.next .when{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:20px;font-weight:700}
a.map{display:inline-flex;align-items:center;gap:6px;margin-top:6px;color:var(--pitch2);font-weight:600;text-decoration:none}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.prow{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:12px}
.prow .dor{width:30px;height:30px;border-radius:8px;background:var(--pitch);color:#fff;display:grid;place-items:center;font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:700}
.prow .grow{flex:1;min-width:0}
.btn{padding:7px 12px;border-radius:10px;background:var(--pitch2);color:#fff;font-size:13px;font-weight:600}
.btn.ghost{background:var(--chalk);color:var(--pitch2)}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
/* sheets */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:80%;overflow-y:auto;transform:translateY(105%);transition:transform .25s;z-index:11}
.sheet.open{transform:none}
.sheet h3{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:22px;margin:0 0 10px}
.sheet input.search{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 14px;font:inherit;font-size:16px;margin-bottom:12px}
.tog{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.tog .grow{flex:1}
.sw{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--win)}.sw.on::after{left:23px}
.hidden{display:none!important}
.orden{display:flex;gap:6px;overflow-x:auto;align-items:center;padding:0 0 10px;scrollbar-width:none;margin-top:-2px}
.orden::-webkit-scrollbar{display:none}
.orden .small{flex:none;margin-right:2px}
.orden .chip{padding:6px 11px;font-size:12.5px}
.orden .chip.on{background:var(--pitch2);color:#fff;border-color:var(--pitch2)}
html[data-theme="estadio"] .orden .chip.on{color:#08101f}
.grp-t{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:15px;font-weight:700;color:var(--pitch2);margin:12px 2px 6px;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--line);padding-bottom:3px}
.no-drag .drag{display:none}
.mt-alerta{background:#fff4e5;color:#8a4b00;border:1px solid #ffd8a8;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;margin-bottom:8px}
html[data-theme="estadio"] .mt-alerta{background:rgba(255,154,61,.12);color:#ffc078;border-color:rgba(255,154,61,.35)}
.vd{margin:4px 0 4px 2px;border-left:2px solid var(--line);padding-left:8px}
.vd summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--pitch2)}
.vd-row{display:flex;gap:8px;font-size:12.5px;padding:2px 0;border-bottom:1px dashed var(--line)}
.vd-k{color:var(--muted);flex:0 0 42%;word-break:break-word}.vd-v{flex:1;word-break:break-word}
.vd-it{padding:4px 0;border-bottom:1px solid var(--line)}
.cr-al.todo>summary{font-size:14px}
.mc-yo{display:flex;flex-direction:column;align-items:center;gap:3px}.mc-yo .crest{border-width:1px}
.crest,.tl-c{position:relative;overflow:hidden}
.crest img,.tl-c img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:12%;border-radius:50%}
.crest.ci{border-color:#fff}
.carr-fijo{flex:none;border-bottom:1px solid var(--line);background:var(--bg);padding-top:10px;box-shadow:0 6px 12px -10px rgba(0,0,0,.35)}
.carr-fijo .carr-wrap{margin:0 0 4px}
.carr-fijo .mc{padding:10px 12px;gap:6px}
.carr-fijo .mc-res{font-size:30px}.carr-fijo .mc-hora{font-size:24px}
.carr-fijo .carr-hint{font-size:11px;margin-top:0}
.clr{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--muted)!important;border:1px solid var(--line)!important;background:transparent!important}
.clr svg{width:19px;height:19px}
html[data-theme="estadio"] .carr-fijo{background:#070b16;border-bottom-color:#1e2a45}
.carr-wrap{margin:-4px -16px 12px}
.carr{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.carr::-webkit-scrollbar{display:none}
.mc{flex:0 0 82%;scroll-snap-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mc.fut{background:linear-gradient(180deg,var(--card),var(--chalk))}
.mc.prox{border:2px solid var(--accent)}
.mc-top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);font-weight:600}
.mc-top .badge{margin:0;font-size:10.5px}
.mc-eq{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;font-size:13px;line-height:1.25}
.mc-res{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:34px;font-weight:700;padding:0 12px;border-radius:10px;background:var(--chalk);white-space:nowrap}
.mc-res span{opacity:.5;margin:0 3px}
.mc-hora{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:26px;font-weight:700;padding:2px 10px;border-radius:10px;border:1.5px dashed var(--line)}
.mc-campo{font-size:12px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc{cursor:pointer}.mc:active{transform:scale(.985)}.mc.sel{border:2px solid var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.evo svg{display:block;overflow:visible}.evo-g{stroke:var(--line);stroke-width:1}.evo-t{font-size:10px;fill:var(--muted,#888)}
.evo-l{fill:none;stroke:var(--pitch2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.evo-p{stroke:var(--card);stroke-width:2}.evo-p.on{stroke:var(--ink);stroke-width:2}.evo-pb{stroke:var(--card);stroke-width:1.5}.sin-riv .evo-riv{display:none}
.evo-ley{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px;font-size:12.5px}.evo-k{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:600}.evo-k i{width:12px;height:12px;border-radius:3px;display:inline-block}
.evo-tog{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--card)}.evo-x{font-weight:500;color:var(--muted);margin-left:2px}.sin-riv .evo-tog{opacity:.65}.sin-riv .evo-tog i{opacity:.35}.evo-v{font-size:12px;font-weight:700;fill:var(--ink)}.evo-det{margin-top:2px}
.jl{cursor:pointer;color:var(--ink)}.jl:active{opacity:.6}
.jt td{padding:7px 4px}.jt th{padding:6px 4px}
.jf-cab{display:flex;gap:12px;align-items:center;margin-bottom:10px}.jf-dor{flex:none;width:44px;height:44px;border-radius:50%;background:var(--pitch2);color:#fff;display:grid;place-items:center;font:700 19px "Barlow Condensed",sans-serif}
.jf-st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}.jf-st div{background:var(--bg);border-radius:10px;padding:8px 4px;text-align:center}.jf-st b{display:block;font-size:20px}.jf-st span{font-size:11px;color:var(--muted)}
.jp{padding:7px 0;border-top:1px solid var(--line);cursor:pointer}.jp:active{opacity:.6}
.pv{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}.pv td{text-align:center;padding:6px 2px;width:34%}.pv th{font-weight:500;color:var(--muted);font-size:11.5px;padding:6px 2px}
.pv tr+tr{border-top:1px solid var(--line)}.pv td.pv-b{font-weight:800;color:var(--pitch2)}
.badge.vivo-b{background:#e5352b;color:#fff;display:inline-flex;align-items:center;gap:5px}
.vivo-dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:latido 1.2s ease-in-out infinite}
@keyframes latido{0%,100%{opacity:1}50%{opacity:.25}}
.meta .vivo-box{white-space:nowrap}.vivo-t{font-weight:700;color:#ff6b61}.mc-hora.vivo-box .vivo-t{font-size:13px;white-space:nowrap}
.vivo-box.off .vivo-dot{animation:none;opacity:.5}.vivo-box.off .vivo-t{color:var(--muted)}
.mc.vivo{border-color:#e5352b;box-shadow:0 0 0 2px rgba(229,53,43,.35)}
@media (prefers-reduced-motion:reduce){.vivo-dot{animation:none}}
.aq{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:8px}.aq.on{border-color:#e5352b;box-shadow:0 0 0 2px rgba(229,53,43,.25)}
.aq-top{display:flex;justify-content:space-between;align-items:center;gap:6px}.aq-top .vivo-box{white-space:nowrap;flex:none}.aq-eq{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}.aq-res{font-size:16px}.aq-ya{margin-top:10px}.aq-ya summary{cursor:pointer;color:var(--muted);font-size:13px}
.team[style*="--eq"]{border-left:5px solid var(--eq)!important;padding-left:10px}
.team[style*="--eq"] .crest{box-shadow:0 0 0 2.5px var(--eq)}
.colsel{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 10px}.colbt{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.colbt.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--card) inset}
.top.eqcol{border-bottom:4px solid var(--eq)!important}.top.eqcol .crest{box-shadow:0 0 0 3px var(--eq)}
.blqs{margin-top:8px}
.bellbtn{position:relative}.mute-k{position:absolute;right:-2px;bottom:-2px;font-size:12px}
table.st tr.riv td{background:rgba(235,104,52,.13);font-weight:700}table.st tr.riv td:first-child{box-shadow:inset 3px 0 0 #eb6834}
table.st tr.me td:first-child{box-shadow:inset 3px 0 0 var(--pitch2)}
.st-ley{display:flex;align-items:center;gap:6px;margin:4px 0 2px}.st-ley span{width:10px;height:10px;border-radius:2px;display:inline-block}.st-ley .me-k{background:var(--pitch2)}.st-ley .riv-k{background:#eb6834;margin-left:8px}
.blq{border:1px solid var(--line);border-radius:12px;margin-top:8px;background:color-mix(in srgb,var(--card) 92%,var(--ink) 8%);overflow:hidden}
.blq>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer}.blq>summary::-webkit-details-marker{display:none}
.blq-i{font-size:18px;flex:none}.blq-t{flex:1;min-width:0;display:flex;flex-direction:column}.blq-t .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blq-f{flex:none;font-size:20px;color:var(--muted);transition:transform .15s}.blq[open]>summary .blq-f{transform:rotate(90deg)}
.blq-c{padding:0 12px 12px}
.mc-bot{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:32px}
.mc-bot .btn{text-decoration:none;font-size:12.5px;padding:7px 11px}
.carr-hint{text-align:center;opacity:.7;margin-top:2px}
html[data-theme="estadio"] .mc{background:linear-gradient(180deg,#121d35,#0d162a);border-color:#1e2a45}
html[data-theme="estadio"] .mc.prox{border-color:#b8f53d;box-shadow:0 0 18px rgba(184,245,61,.18)}
html[data-theme="estadio"] .mc-res{background:linear-gradient(135deg,#1b2b52,#0e1731);color:#b8f53d}
.cr-head{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;font-weight:600;font-size:13px;margin:10px 0 6px}
.cr-res{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:26px;font-weight:700;padding:0 10px;border-radius:8px;background:var(--chalk)}
.cr{position:relative;margin:6px 0}
.cr::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line);transform:translateX(-1px)}
.cr-row{display:grid;grid-template-columns:1fr 44px 1fr;align-items:center;min-height:32px;position:relative}
.cr-l{text-align:right;padding-right:8px;font-size:13px}.cr-r{text-align:left;padding-left:8px;font-size:13px}
.cr-m{justify-self:center;z-index:1;background:var(--card);border:1.5px solid var(--line);border-radius:999px;font-size:11px;font-weight:700;padding:2px 7px;min-width:34px;text-align:center}
.cr-ic{font-size:14px}.cr-sc{font-size:11px;font-weight:700;color:var(--muted);margin:0 2px;white-space:nowrap}
.cr-al{margin-top:8px}.cr-al summary{cursor:pointer;font-weight:600;color:var(--pitch2)}
.cr-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.meteo{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--chalk);border:1px solid var(--line)}
.mt-head{display:flex;gap:10px;align-items:center;margin-bottom:6px}.mt-ic{font-size:28px;line-height:1}
.mt-icons{display:grid;grid-template-columns:repeat(6,1fr);text-align:center;font-size:17px;margin-bottom:2px}
.mt-icons span{opacity:.75}.mt-icons span.on{opacity:1}
.meteo svg text{font-family:Inter,sans-serif}
.mt-t{font-size:9.5px;fill:var(--muted)}
.mt-x{font-size:10px;fill:var(--muted)}.mt-x.on{fill:var(--ink);font-weight:700}
.mt-val{font-size:11px;font-weight:700;fill:var(--ink)}
.mt-band{fill:var(--card);opacity:.9}
.mt-line{fill:none;stroke:#e8590c;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.mt-dot{fill:#e8590c;stroke:var(--chalk);stroke-width:2}.mt-dot.on{fill:#c2410c}
.mt-bar{fill:#74a9e8}.mt-bar.on{fill:#2563eb}
.mt-base{stroke:var(--line);stroke-width:1}
.mt-det{margin-top:2px;color:var(--ink)}
html[data-theme="estadio"] .meteo{background:#0d1629;border-color:#1e2a45}
html[data-theme="estadio"] .mt-band{fill:#16223d}
html[data-theme="estadio"] .mt-line{stroke:#e2702f}html[data-theme="estadio"] .mt-dot{fill:#e2702f;stroke:#0d1629}html[data-theme="estadio"] .mt-dot.on{fill:#e2702f}
html[data-theme="estadio"] .mt-bar{fill:#2f5a99}html[data-theme="estadio"] .mt-bar.on{fill:#4a86e8}

<body>
<div class="app" id="app"></div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<script>
/* ============================================================
   CANTERA MADRID — fútbol base (Infantil, Cadete, Juvenil) de la Comunidad de Madrid
   Datos: RFFM (www.rffm.es), descargados por el robot del repositorio (data/*.json).
   ============================================================ */
const RAW="https://raw.githubusercontent.com/alexample/cantera-madrid/main/data/";
const DATA_BASE=(()=>{try{return new URLSearchParams(location.search).get("datos")||RAW}catch(e){return RAW}})();
const IA_URL="https://dondeloechan-ia.alexample.workers.dev/cantera-ia";
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const CATN={inf:"Infantil",cad:"Cadete",juv:"Juvenil"};
const CAT_ORDER=["inf","cad","juv"];

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[¿?¡!.,;:'"()\-\/]/g," ").replace(/\s+/g," ").trim();
const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fdate=d=>`${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`;
function rel(d){const diff=Math.round((d-TODAY)/864e5);if(diff===0)return"hoy";if(diff===1)return"mañana";if(diff===-1)return"ayer";if(diff>1&&diff<7)return"este "+DIAS[d.getDay()];return null}
const store={get(k,d){try{const v=localStorage.getItem("cm_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("cm_"+k,JSON.stringify(v))}catch(e){}}};
const SIGLAS=new Set(["a","d","c","f","u","s","e","r","sad","cd","ad","cf","ud","sd","ef","cde","adc","club","de","del","la","el","los","las","futbol","escuela","deportivo","deportiva","agrupacion","asociacion","sociedad","atletico","union","racing","real","rcd","cdf","ac","ce","cp","fc","ss","sporting","y","san"]);
// "A.D. ALCORCON A" -> "A.D. Alcorcón A" (respeta siglas)
function bonito(n){return String(n||"").toLowerCase().split(" ").map(w=>/\./.test(w)||/^[a-z]$/.test(w)||/^(sad|cd|ad|cf|ud|sd|cde|rcd|ef|ii|iii|iv|vi)$/.test(w)?w.toUpperCase():w.charAt(0).toUpperCase()+w.slice(1)).join(" ").replace(/\b(De|Del|La|Las|Los|El|Y)\b/g,x=>x.toLowerCase()).replace(/^./,c=>c.toUpperCase())}
function siglas(club){const w=norm(club).split(" ").filter(x=>x.length>1&&!SIGLAS.has(x));const s=(w[0]||norm(club).replace(/ /g,"")).slice(0,3).toUpperCase();return s}
function colorDe(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return `hsl(${h%360} 55% 38%)`}
const cap=s=>String(s).replace(/(^|\s)\p{L}/gu,c=>c.toUpperCase()).replace(/\b(De|Del|La|Las|Los|El)\b/g,w=>w.toLowerCase());
function km(a,b){if(!a||!b)return null;const R=6371,t=x=>x*Math.PI/180,dl=t(b[0]-a[0]),dn=t(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

/* ---------- datos ---------- */
let IDX=null;          // índice
let TEAMS=[];          // equipos
const TEAM=new Map();  // id -> equipo
const GD={};           // grupo -> datos cargados
const CAMPOS={};       // id -> {name, addr, loc, ll}
async function getJSON(name,{fresh=false}={}){
  const url=DATA_BASE+name+(fresh?(DATA_BASE.startsWith("http")?"?t="+Date.now():""):"");
  const r=await fetch(url,{cache:fresh?"no-store":"default"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}
function buildIndex(ix){
  IDX=ix;TEAMS=[];TEAM.clear();
  for(const [id,v] of Object.entries(ix.campos||{}))CAMPOS[id]={id,name:v[0],addr:v[1],loc:v[2],ll:v[3]!=null&&v[4]!=null?[v[3],v[4]]:null,nav:v[5]!=null&&v[6]!=null?[v[5],v[6]]:null,tipo:v[7]||""};
  for(let [id,n,c,gs,campo,esc] of ix.equipos){
    const grupos=gs.filter(g=>ix.grupos[g]);if(!grupos.length)continue;
    const g0=ix.grupos[grupos[0]];
    const cp=CAMPOS[campo]||null;
    c=String(c).replace(/\s+[A-Z]{1,2}$/,"");
    const t={id,raw:n,name:bonito(n),club:bonito(c),clubKey:norm(c),cat:g0[0],fem:!!g0[3],grupos,campo:cp,town:cp?cap(cp.loc.toLowerCase()):"",ll:cp?cp.ll:null};
    t.sig=siglas(c);t.color=colorDe(norm(c));t.esc=esc||"";
    t.sName=" "+norm(n+" "+c)+" ";t.sPlace=" "+norm([cp&&cp.loc,cp&&cp.name].join(" "))+" ";t.search=t.sName+t.sPlace;
    TEAMS.push(t);TEAM.set(id,t);
  }
}
const grupo=gid=>{const g=IDX.grupos[gid];return g&&{id:gid,cat:g[0],comp:bonito(g[1]),grupo:bonito(g[2]),fem:g[3],compId:g[4],tj:g[5],temp:g[6]}};
const grupoNombre=gid=>{const g=grupo(gid);return g?`${g.comp} · ${g.grupo}`:""};
async function loadGroup(gid,fresh){
  if(GD[gid]&&!fresh)return GD[gid];
  const cached=store.get("g_"+gid,null);
  if(cached&&!fresh&&Date.now()-(cached._t||0)<10*60e3){GD[gid]=prep(cached);return GD[gid]}
  try{const d=await getJSON("g/"+gid+".json",{fresh:true});d._t=Date.now();store.set("g_"+gid,d);GD[gid]=prep(d)}
  catch(e){if(cached){GD[gid]=prep(cached)}else throw e}
  return GD[gid];
}
function prep(d){
  d.matches=(d.part||[]).map(p=>({j:p[0],date:p[1]?new Date(p[1]+"T00:00:00"):null,time:p[2]||"",home:p[3],homeN:bonito(p[4]),away:p[5],awayN:bonito(p[6]),hg:p[7],ag:p[8],campo:p[9],campoN:p[10],acta:p[11]||"",prov:p[12]===1,gid:d.id,played:p[7]!=null&&p[8]!=null}));
  d.matches.sort((a,b)=>(a.j||0)-(b.j||0)||((a.date||0)-(b.date||0)));
  if(d.clas&&d.clas.length)d.table=d.clas.map(r=>({pos:r[0],id:r[1],name:bonito(r[2]),pj:r[3]||0,g:r[4]||0,e:r[5]||0,p:r[6]||0,gf:r[7]||0,gc:r[8]||0,pts:r[9]||0,zona:r[10]??-1}));
  else{const tab={};const add=(id,n)=>tab[id]||(tab[id]={id,name:n,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0});
    d.matches.forEach(m=>{if(!m.home||!m.away)return;const h=add(m.home,m.homeN),a=add(m.away,m.awayN);if(!m.played)return;h.pj++;a.pj++;h.gf+=m.hg;h.gc+=m.ag;a.gf+=m.ag;a.gc+=m.hg;if(m.hg>m.ag){h.g++;a.p++;h.pts+=3}else if(m.hg<m.ag){a.g++;h.p++;a.pts+=3}else{h.e++;a.e++;h.pts++;a.pts++}});
    d.table=Object.values(tab).sort((x,y)=>y.pts-x.pts||(y.gf-y.gc)-(x.gf-x.gc)).map((r,i)=>({...r,pos:i+1}))}
  return d;
}
const teamGroup=t=>GD[t.grupos[0]];
const teamMatches=t=>{const d=teamGroup(t);return d?d.matches.filter(m=>m.home===t.id||m.away===t.id):[]};
const lastMatch=t=>teamMatches(t).filter(m=>m.played).sort((a,b)=>(a.date||0)-(b.date||0)||a.j-b.j).pop();
// ¿Se está jugando ahora? Partes de 40' (35' en infantil) con 10' de descanso, contando desde la hora oficial
function enJuego(t,m,ahora=Date.now()){
  if(!m||m.played||!m.date||!m.time||!/^\d{1,2}:\d{2}/.test(m.time))return null;
  const[h,mi]=m.time.split(":").map(Number);const ini=new Date(m.date);ini.setHours(h,mi,0,0);
  const parte=t&&t.cat==="inf"?35:40,desc=10,fin=parte*2+desc;const min=(ahora-ini)/6e4;
  if(min<0||min>fin+120)return null;
  if(min<parte)return {f:"1",corto:"1ª parte",txt:`1ª parte · ${Math.floor(min)+1}'`};
  if(min<parte+desc)return {f:"d",corto:"Descanso",txt:`Descanso · ${Math.ceil(parte+desc-min)}' para la 2ª`};
  if(min<fin)return {f:"2",corto:"2ª parte",txt:`2ª parte · ${Math.floor(min-desc)+1}'`};
  return {f:"fin",corto:"esperando resultado",txt:"Terminado · esperando resultado"};
}
const vivoAttr=(t,m)=>`data-vivo="${esc(t.id)}|${esc(firma(m))}"`;
// Actualiza cada 30 s los marcadores «en juego» que haya en pantalla
setInterval(()=>{for(const el of document.querySelectorAll("[data-vh]")){const[tid,ms,hora,cat]=el.dataset.vh.split("|");const v=enJuego(TEAM.get(tid)||{cat},{date:new Date(+ms),time:hora});el.textContent=v?v.txt:"";el.closest(".vivo-box")?.classList.toggle("off",!v||v.f==="fin")}
  for(const el of document.querySelectorAll("[data-vivo]")){const p=el.dataset.vivo.split("|"),tid=p[0],f=p.slice(1).join("|");
  const t=TEAM.get(tid);const m=t&&teamMatches(t).find(x=>firma(x)===f);const v=enJuego(t,m);
  el.textContent=v?(el.dataset.corto?v.corto:v.txt):"";el.closest(".vivo-box")?.classList.toggle("off",!v||v.f==="fin")}},30000);
const nextMatch=t=>{const ms=teamMatches(t).filter(m=>!m.played);return ms.find(m=>m.date&&m.date>=TODAY)||ms.find(m=>!m.date)};
function outcome(m,id){const my=m.home===id?m.hg:m.ag,ot=m.home===id?m.ag:m.hg;return my>ot?"W":my<ot?"L":"D"}
const L=(id,name)=>{const t=TEAM.get(id);return t?`<a class="tl" data-ver="${esc(id)}" role="button"><span class="tl-c${t.esc?" ci":""}" style="background:${t.color}">${esc(t.sig)}${escudoImg(t)}</span>${esc(name)}<span class="tl-ch">›</span></a>`:esc(name)};
const fin=s=>/\.$/.test(s)?"":".";
const rivalOf=(m,id)=>m.home===id?{id:m.away,n:m.awayN}:{id:m.home,n:m.homeN};

/* ---------- estado ---------- */
const state={jugs:store.get("jugadores",[]),evoSinRival:store.get("evo_sin_rival",false),abiertos:{},col:store.get("colores",{}),auto:{},foco:{},orden:store.get("orden","manual"),pila:[],etq:store.get("etiquetas",{}),avEq:store.get("avEq",{}),tema:store.get("tema_noche_v1",false)?store.get("tema","noche"):(store.set("tema_noche_v1",true),store.set("tema","noche"),"noche"),follows:store.get("follows",[]).filter(Boolean),verified:store.get("verified",false),chats:{},iah:{},flow:null,view:"home",team:null};
const ANDROID=typeof window.AndroidApp!=="undefined";
// Pasa a Android los equipos seguidos (para los avisos en segundo plano)
function syncAndroid(){if(!ANDROID||!IDX)return;
  try{AndroidApp.guardarJugadores&&AndroidApp.guardarJugadores(JSON.stringify(state.jugs.filter(j=>/^\d{1,12}$/.test(j.k)).map(j=>({tid:j.tid,gid:(TEAM.get(j.tid)||{grupos:[]}).grupos[0]||"",cod:j.k,n:j.n}))))}catch(e){}
  try{AndroidApp.guardarGruposNoche&&AndroidApp.guardarGruposNoche(JSON.stringify([...new Set(state.jugs.map(j=>(TEAM.get(j.tid)||{grupos:[]}).grupos[0]).filter(Boolean))]))}catch(e){}try{AndroidApp.guardarEquipos(JSON.stringify(state.follows.map(id=>TEAM.get(id)).filter(Boolean).map(t=>({id:t.id,g:t.grupos[0],n:t.name,e:state.etq[t.id]||"",av:state.avEq[t.id]||null}))))}catch(e){}}
const etiqueta=t=>state.etq[t.id]||"";
const silenciado=t=>!!(state.avEq[t.id]&&state.avEq[t.id].silencio);
function toast(msg){const d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function silenciar(t,on){
  if(on){const prev=state.avEq[t.id]&&!state.avEq[t.id].silencio?state.avEq[t.id]:null;state.avEq[t.id]={resultado:false,asignado:false,previo:false,meteo:false,horas:3,silencio:true,antes:prev}}

// «Cómo llegar»: navegación hasta la entrada verificada del campo (o su ubicación si no hay entrada en el mapa)
// «Cómo llegar»: Google Maps busca el campo por su nombre y dirección y elige su propia ficha (como si lo buscaras tú)
function nombreCampoGoogle(n){return String(n||"").replace(/\([^)]*\)/g," ").replace(/\bF-?7\b|\bF-?11\b/gi," ").replace(/\s+\d+\s*$/,"")
  .replace(/\bPVO\.?\s*/gi,"Polideportivo ").replace(/\bPOLID(\.\s*|\s+)/gi,"Polideportivo ").replace(/\bC\.?\s?D\.?\s?M\.?\s/gi,"Centro Deportivo Municipal ").replace(/\bI\.?\s?D\.?\s?M\.?\s/gi,"Instalación Deportiva Municipal ")
  .replace(/\bC\.?\s?F\.?\s/gi,"Campo de Fútbol ").replace(/\bMPAL\.?\s/gi,"Municipal ").replace(/\s*-\s*/g," ").replace(/\s+/g," ").trim()}
function consultaCampo(c){const n=nombreCampoGoogle(c.name);return [/campo|estadio|polideportivo|ciudad deportiva|centro deportivo|instalaci/i.test(n)?n:(n?"Campo de fútbol "+n:""),c.addr,c.loc].filter(Boolean).join(", ")}
function navUrl(c){return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(consultaCampo(c))}&travelmode=driving`}
function mapLink(c,label){if(!c)return"";return `<a class="map" href="${navUrl(c)}" target="_blank" rel="noopener">${icons.pin} ${label||"Cómo llegar"}</a>`}
const opts=list=>`<div class="opts">${list.map(o=>`<button class="opt" data-ask="${esc(o.v||o.l||o)}">${o.ic?`<span class="opt-i">${IC[o.ic]?ic(o.ic):o.ic}</span>`:""}${esc(o.l||o)}</button>`).join("")}</div>`;
function teamRow(t,extra){const f=state.follows.includes(t.id);return `<div class="prow">${crest(t,34)}<div class="grow"><b>${esc(t.name)}</b><div class="small">${extra??esc(grupoNombre(t.grupos[0]))}</div></div><button class="btn ${f?"ghost":""}" data-open="${t.id}">${f?"Abrir":"Seguir"}</button></div>`}
const teamCards=(ts,ll)=>`<div class="plist">${ts.map(t=>{const d=km(ll,t.ll);return teamRow(t,`${esc(CATN[t.cat])}${t.fem?" fem.":""} · ${esc(t.town||"")}${d!=null?` · a ${d<1?"menos de 1":Math.round(d)} km`:""}<br>${esc(grupoNombre(t.grupos[0]))}`)}).join("")}</div>`;

function ansLast(t){

  return `${verb[0].toUpperCase()+verb.slice(1)} ${o==="D"?"con":o==="W"?"a":"contra"} <b>${L(rivalOf(m,t.id).id,rivalOf(m,t.id).n)}</b>${r?" "+r:""} (${m.home===t.id?"en casa":"fuera"}).${scoreCard(m)}`;
}

// Gráfica de evolución: puesto del equipo tras cada jornada (1º arriba)
// Gráfica de evolución: puesto tras cada jornada (1º arriba). Si se pasa un rival del mismo grupo, se dibuja también
// y se puede quitar/poner con su botón de la leyenda.
function evolucionHTML(t,jSel,rivId){
  const d=teamGroup(t);if(!d||!d.table||!d.table.find(r=>r.id===t.id))return "";
  const js=[...new Set(d.matches.filter(m=>m.played&&m.j!=null).map(m=>m.j))].sort((a,b)=>a-b);
  if(js.length<2)return "";
  const riv=rivId&&rivId!==t.id&&d.table.find(r=>r.id===rivId)?d.table.find(r=>r.id===rivId):null;
  const mios=teamMatches(t).filter(m=>m.gid===d.id);
  const tablas=js.map(j=>tablaHasta(d,j));
  const serie=id=>js.map((j,i)=>{const r=tablas[i].table.find(x=>x.id===id)||{};const m=mios.find(x=>x.j===j);return {j,pos:r.pos,pts:r.pts,pj:r.pj,fp:m?firma(m):""}});
  const A=serie(t.id),B=riv?serie(riv.id):null;
  const colA=colorEquipo(t)||"#2a78d6",colB=colA.toLowerCase()==="#eb6834"?"#2a78d6":"#eb6834";
  const N=d.table.length,W=330,H=170,ml=26,mr=34,mt=12,mb=24,iw=W-ml-mr,ih=H-mt-mb;
  const x=i=>ml+(js.length===1?iw/2:i*iw/(js.length-1)),y=p=>mt+(N===1?0:(p-1)*ih/(N-1));
  const guias=[1,Math.ceil(N/2),N].filter((v,i,a)=>a.indexOf(v)===i);
  const paso=Math.ceil(js.length/8);
  const linea=S=>S.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.pos).toFixed(1)}`).join("");
  const nc=n=>{n=String(n||"").replace(/^(C\.?D\.?E?|E\.?D\.?|A\.?D\.?|C\.?F\.?|R\.?S\.?D\.?|U\.?D\.?|S\.?A\.?D\.?|CDE|ESC\.? de FUT\.?)\s+/i,"");return n.length>22?n.slice(0,21)+"…":n};
  const nA=nc(t.name),nB=riv?nc(riv.name):"";

/* ---------- Pronóstico de final de liga ----------
   Lo calcula el código, no la IA (los modelos de lenguaje se equivocan con las cuentas):
   1) Matemática exacta: qué está ya asegurado o ya es imposible con los puntos que quedan.
   2) Simulación: se juegan 5.000 veces los partidos que faltan con un modelo de goles (Poisson) según el nivel
      de cada equipo (goles a favor y en contra, con ventaja de jugar en casa) y se cuenta en qué puesto acaba cada uno.
   La IA, si se le pide, solo explica estos números con palabras. */
const PRON={};
function azar(sem){let a=sem>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function poisson(l,r){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=r()}while(p>L&&k<15);return k-1}
function zonasGrupo(d){
  const nombres=(d.zonas||[]).map(z=>z[0]);const Z=[];
  d.table.forEach(r=>{if(r.zona>=0&&nombres[r.zona]!=null){let z=Z.find(x=>x.i===r.zona);if(!z)Z.push(z={i:r.zona,n:nombres[r.zona],c:(d.zonas[r.zona]||[])[1]||"#999",pos:[]});z.pos.push(r.pos)}});
  // Las zonas van por puesto: las de arriba se apilan desde el 1º y las de abajo desde el último
  const N=d.table.length;let arriba=1,abajo=N;
  Z.forEach(z=>z.m=z.pos.reduce((a,b)=>a+b,0)/z.pos.length);
  Z.filter(z=>z.m<=N/2).sort((a,b)=>a.m-b.m).forEach(z=>{z.desde=arriba;z.hasta=arriba+z.pos.length-1;arriba=z.hasta+1});
  Z.filter(z=>z.m>N/2).sort((a,b)=>b.m-a.m).forEach(z=>{z.hasta=abajo;z.desde=abajo-z.pos.length+1;abajo=z.desde-1});
  return Z.sort((a,b)=>a.desde-b.desde);
}
function pronosticoGrupo(d){
  const clave=d.id+"|"+(IDX.act||"");if(PRON[clave])return PRON[clave];
  const T=d.table.filter(r=>r.id);const N=T.length;const idx=new Map(T.map((r,i)=>[r.id,i]));
  const quedan=d.matches.filter(m=>!m.played&&idx.has(m.home)&&idx.has(m.away));
  const jugados=d.matches.filter(m=>m.played&&idx.has(m.home)&&idx.has(m.away));
  if(!N)return null;
  // nivel de cada equipo (con prudencia al principio: se acerca a la media)
  const gl=jugados.reduce((a,m)=>a+m.hg,0),gv=jugados.reduce((a,m)=>a+m.ag,0);
  const mu=jugados.length?(gl+gv)/(2*jugados.length):1.4;const casa=jugados.length>10?Math.min(1.45,Math.max(1,(gl+.5)/(gv+.5))):1.15;
  const fuerza=T.map(r=>{const w=r.pj/(r.pj+10);const at=r.pj?(r.gf/r.pj)/mu:1,de=r.pj?(r.gc/r.pj)/mu:1;return {at:1+w*(at-1),de:1+w*(de-1)}});
  const restan=T.map(()=>0);quedan.forEach(m=>{restan[idx.get(m.home)]++;restan[idx.get(m.away)]++});
  const SIMS=5000;const r=azar(([...String(d.id)].reduce((a,c)=>a*31+c.charCodeAt(0),7)^quedan.length*977)>>>0);
  const cuenta=T.map(()=>new Array(N).fill(0));const ptsFin=T.map(()=>[]);
  const pts=new Array(N),dg=new Array(N),gf=new Array(N),ord=[...Array(N).keys()],des=new Array(N);
  // el nivel real de cada equipo no se conoce con exactitud: en cada simulación se varía un poco (más cuanto menos se ha jugado)
  const nr=()=>{let u=0,v=0;while(!u)u=r();v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
  const sig=T.map(t=>0.45/Math.sqrt(1+t.pj/6));const at=new Array(N),de=new Array(N);
  for(let s=0;s<SIMS;s++){
    for(let i=0;i<N;i++){pts[i]=T[i].pts;dg[i]=T[i].gf-T[i].gc;gf[i]=T[i].gf;des[i]=r();at[i]=fuerza[i].at*Math.exp(sig[i]*nr());de[i]=fuerza[i].de*Math.exp(sig[i]*nr())}
    for(const m of quedan){const h=idx.get(m.home),a=idx.get(m.away);
      const lh=Math.max(.15,mu*at[h]*de[a]*Math.sqrt(casa)),la=Math.max(.15,mu*at[a]*de[h]/Math.sqrt(casa));
      const x=poisson(lh,r),y=poisson(la,r);dg[h]+=x-y;dg[a]+=y-x;gf[h]+=x;gf[a]+=y;
      if(x>y)pts[h]+=3;else if(x<y)pts[a]+=3;else{pts[h]++;pts[a]++}}
    ord.sort((i,j)=>pts[j]-pts[i]||dg[j]-dg[i]||gf[j]-gf[i]||des[j]-des[i]);
    ord.forEach((i,k)=>cuenta[i][k]++);
    if(s%10===0)for(let i=0;i<N;i++)ptsFin[i].push(pts[i]);
  }
  const res={N,quedan:quedan.length,jornadasQuedan:new Set(quedan.map(m=>m.j)).size,jugadas:new Set(jugados.map(m=>m.j)).size,SIMS,
    equipos:T.map((t,i)=>({id:t.id,name:t.name,pts:t.pts,pos:t.pos,max:t.pts+3*restan[i],restan:restan[i],prob:cuenta[i].map(c=>c/SIMS),
      media:ptsFin[i].reduce((a,b)=>a+b,0)/ptsFin[i].length})),zonas:zonasGrupo(d)};
  PRON[clave]=res;return res;
}
// Certezas matemáticas para un equipo y una zona (sin contar desempates: si hay empate posible, no se da por hecho)
function certeza(res,id,z){
  const E=res.equipos,yo=E.find(e=>e.id===id),otros=E.filter(e=>e.id!==id);
  const porEncimaSeguro=otros.filter(e=>e.pts>yo.max).length;   // acabarán delante pase lo que pase
  const porDebajoSeguro=otros.filter(e=>e.max<yo.pts).length;    // acabarán detrás pase lo que pase
  const mejor=1+porEncimaSeguro,peor=res.N-porDebajoSeguro;       // mejor y peor puesto posibles
  if(mejor>=z.desde&&peor<=z.hasta)return "seguro";
  if(peor<z.desde||mejor>z.hasta)return "imposible";
  return null;
}

const certTxt=(z,N)=>{const abajo=z.desde>N/2;return z.cert==="seguro"?(abajo?"descenso matemático":"asegurado"):z.cert==="imposible"?(abajo?"salvado":"ya no es posible"):null};
const pct=x=>x>=.995?"más del 99 %":x<.005&&x>0?"menos del 1 %":Math.round(x*100)+" %";
function pronosticoEquipo(t){
  const d=teamGroup(t);if(!d||!d.table||!d.table.find(r=>r.id===t.id))return null;
  const res=pronosticoGrupo(d);if(!res)return null;const e=res.equipos.find(x=>x.id===t.id);
  const zonas=res.zonas.map(z=>({...z,p:e.prob.slice(z.desde-1,z.hasta).reduce((a,b)=>a+b,0),cert:certeza(res,t.id,z)}));
  const masProb=e.prob.indexOf(Math.max(...e.prob))+1;
  // intervalo que concentra el 80 % de los finales
  let acc=0,lo=1,hi=res.N;const cum=e.prob.map(p=>acc+=p);lo=cum.findIndex(c=>c>=.1)+1;hi=cum.findIndex(c=>c>=.9)+1;
  const mejor=1+res.equipos.filter(o=>o.id!==t.id&&o.pts>e.max).length,peor=res.N-res.equipos.filter(o=>o.id!==t.id&&o.max<e.pts).length;
  return {res,e,zonas,masProb,lo,hi,mejor,peor};
}

/* ===================== Chat de división: estadísticas de equipos y jugadores ===================== */
function statsEquipos(d){
  const E=new Map(d.table.filter(r=>r.id).map(r=>[r.id,{id:r.id,name:r.name,pos:r.pos,pts:r.pts,pj:0,gf:0,gc:0,g:0,e:0,p:0,
    c:{pj:0,pts:0,gf:0,gc:0},f:{pj:0,pts:0,gf:0,gc:0},cero:0,sinGol:0,seq:[]}]));
  const L={partidos:0,goles:0,loc:0,emp:0,vis:0,res:{},goleada:null,masGoles:null};
  for(const m of d.matches.filter(m=>m.played).sort((a,b)=>(a.j??0)-(b.j??0))){
    const h=E.get(m.home),a=E.get(m.away);if(!h||!a)continue;
    L.partidos++;L.goles+=m.hg+m.ag;m.hg>m.ag?L.loc++:m.hg<m.ag?L.vis++:L.emp++;
    const k=Math.max(m.hg,m.ag)+"-"+Math.min(m.hg,m.ag);L.res[k]=(L.res[k]||0)+1;
    if(!L.goleada||Math.abs(m.hg-m.ag)>Math.abs(L.goleada.hg-L.goleada.ag))L.goleada=m;
    if(!L.masGoles||m.hg+m.ag>L.masGoles.hg+L.masGoles.ag)L.masGoles=m;
    for(const[x,f,c,lado]of[[h,m.hg,m.ag,"c"],[a,m.ag,m.hg,"f"]]){
      const pt=f>c?3:f===c?1:0;x.pj++;x.gf+=f;x.gc+=c;f>c?x.g++:f===c?x.e++:x.p++;
      x[lado].pj++;x[lado].pts+=pt;x[lado].gf+=f;x[lado].gc+=c;if(c===0)x.cero++;if(f===0)x.sinGol++;x.seq.push(f>c?"W":f===c?"D":"L")}
  }
  for(const x of E.values()){
    const racha=(cond)=>{let mx=0,cur=0;for(const r of x.seq){if(cond(r)){cur++;mx=Math.max(mx,cur)}else cur=0}return mx};
    x.invicto=racha(r=>r!=="L");x.sinGanar=racha(r=>r!=="W");x.victorias=racha(r=>r==="W");
    let n=0,tp=x.seq[x.seq.length-1];for(let i=x.seq.length-1;i>=0&&x.seq[i]===tp;i--)n++;x.rachaAct={n,tp};
    x.ult5=x.seq.slice(-5)}
  return {E:[...E.values()],L};
}

function addLocalities(){const acc={};for(const c of Object.values(CAMPOS)){if(!c.loc||!c.ll)continue;const k=norm(c.loc);(acc[k]=acc[k]||[]).push(c.ll)}

function findPlace(text){
  const q=norm(text);if(PLACES[q])return{name:q,ll:PLACES[q]};
  const keys=Object.keys(PLACES).sort((a,b)=>b.length-a.length);
  const k=keys.find(k=>(" "+q+" ").includes(" "+k+" "))||(q.length>=4&&keys.find(k=>k.startsWith(q)));

// Distancia de edición (con transposición) acotada: para tolerar faltas de ortografía
function dist(a,b,max){if(Math.abs(a.length-b.length)>max)return max+1;const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];for(let j=1;j<=b.length;j++)d[i][j]=i?0:j}
  for(let i=1;i<=a.length;i++){let best=1e9;for(let j=1;j<=b.length;j++){const c=a[i-1]===b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);best=Math.min(best,d[i][j])}if(best>max)return max+1}return d[a.length][b.length]}
let VOCAB=null;
function vocab(){if(VOCAB)return VOCAB;const v=new Set();for(const t of TEAMS)for(const w of t.search.split(" "))if(w.length>=3)v.add(w);for(const k of Object.keys(PLACES))for(const w of k.split(" "))if(w.length>=3)v.add(w);return VOCAB=[...v]}
// Para cada palabra: ella misma si existe; si no, las palabras parecidas del vocabulario
function expandir(w){
  const V=vocab();if(w.length<4||V.some(x=>x.includes(w)))return{alts:[w],fixed:null};
  const max=w.length>=7?2:1;let best=max+1,alts=[];
  for(const x of V){if(x.length<3)continue;const d=dist(w,x,max);if(d<best){best=d;alts=[x]}else if(d===best&&d<=max)alts.push(x)}
  return best<=max?{alts,fixed:alts[0]}:{alts:[w],fixed:null};
}
let ULTIMA_CORRECCION=null;
function searchTeams(text,{cat,fem}={}){
  const q=norm(text);cat=cat||catInText(q);fem=fem??(femInText(q)||null);
  const words=q.split(" ").filter(w=>w.length>1&&!STOP.has(w));
  ULTIMA_CORRECCION=null;
  let res=TEAMS.filter(t=>(!cat||t.cat===cat)&&(fem==null||t.fem===fem));
  if(words.length){
    const exp=words.map(expandir);const fixes=exp.filter(e=>e.fixed);
    if(fixes.length)ULTIMA_CORRECCION=words.map((w,i)=>exp[i].fixed||w).join(" ");
    res=res.map(t=>{let s=0,hit=0;for(const e of exp){let k=0;for(const w of e.alts){let kk=0;if(t.sName.includes(" "+w+" "))kk=3;else if(t.sName.includes(w))kk=2;else if(t.sPlace.includes(" "+w+" "))kk=1.5;else if(t.sPlace.includes(w))kk=1;k=Math.max(k,kk)}if(k)hit++;s+=k}return{t,s,hit}})
      .filter(x=>x.hit===words.length).sort((a,b)=>b.s-a.s||(a.t.club.length-b.t.club.length)||a.t.name.localeCompare(b.t.name)).map(x=>x.t);
  }else if(!cat)res=[];
  return res;
}

}
function nearestClubs(ll,cat,limit=5,fem=null){
  const best={};for(const t of TEAMS){if(cat&&t.cat!==cat)continue;if(fem!=null&&t.fem!==fem)continue;const d=ll&&t.ll?km(ll,t.ll):null;const b=best[t.clubKey];if(!b||(d!=null&&(b.d==null||d<b.d)))best[t.clubKey]={club:t.club,key:t.clubKey,d,town:t.town}}
  return Object.values(best).sort((a,b)=>(a.d??1e9)-(b.d??1e9)||a.club.localeCompare(b.club)).slice(0,limit);

   Se muestra en el próximo partido si hay coordenadas del campo y faltan ≤ 15 días.

   temperatura (línea) y probabilidad de lluvia (barras).                       */
const METEO={};
const WMO=c=>{const r=c===0?["sol","Despejado"]:c<=2?["solnube","Poco nuboso"]:c===3?["nube","Nublado"]:c<=48?["niebla","Niebla"]:c<=57?["llovizna","Llovizna"]:c<=67?["lluvia","Lluvia"]:c<=77?["nieve","Nieve"]:c<=82?["lluvia","Chubascos"]:c<=86?["nieve","Chubascos de nieve"]:["tormenta","Tormenta"];return [ic(r[0],"w w-"+r[0]),r[1]]};
function meteoPH(m){

  const iso=`${m.date.getFullYear()}-${String(m.date.getMonth()+1).padStart(2,"0")}-${String(m.date.getDate()).padStart(2,"0")}`;
  return `<div class="meteo" data-m="${c.ll[0]}|${c.ll[1]}|${iso}|${m.time}"><div class="small">${ic("solnube")} Cargando la previsión del tiempo…</div></div>`;

async function datosMeteo(lat,lon,iso,hora){
  const k=`${lat},${lon},${iso}`;if(METEO[k]&&Date.now()-METEO[k].t<30*60e3)return METEO[k].d;
  // Primero AEMET (a través del worker; solo da horas para los próximos ~2 días); si no cubre la hora del partido, Open-Meteo
  try{const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),8000);
    const r=await fetch(`${IA_URL.replace("/cantera-ia","/cantera-tiempo")}?lat=${lat}&lon=${lon}&fecha=${iso}`,{signal:ctl.signal});clearTimeout(to);
    if(r.ok){const d=await r.json();const H=+String(hora||"12").split(":")[0];if(d.hourly&&(d.cubre||[]).includes(H)){METEO[k]={t:Date.now(),d};return d}}}catch(e){}
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m&timezone=Europe%2FMadrid&start_date=${iso}&end_date=${iso}`;

function meteoHTML(d,hora){
  const H=+hora.split(":")[0];const h=d.hourly;const ini=Math.max(0,Math.min(18,H-2));const idx=[...Array(6).keys()].map(i=>ini+i);

   <text x="${pts[k][0]}" y="${pts[k][1]-9}" text-anchor="middle" class="mt-val">${Math.round(T[k])}°</text>
   <text x="4" y="70" class="mt-t">Probabilidad de lluvia (%)</text>
   <line x1="0" x2="${W}" y1="110" y2="110" class="mt-base"/>
   ${P.map((v,i)=>{const hgt=Math.max(1.5,v*0.44);return `<path d="M${i*col+pad} 110 V${(110-hgt+4).toFixed(1)} q0 -4 4 -4 H${(i+1)*col-pad-4} q4 0 4 4 V110 Z" class="mt-bar${i===k?" on":""}"/>`}).join("")}
   <text x="${k*col+col/2}" y="${yP(P[k])-5}" text-anchor="middle" class="mt-val">${P[k]}%</text>
   ${idx.map((x,i)=>`<text x="${i*col+col/2}" y="128" text-anchor="middle" class="mt-x${i===k?" on":""}">${String(x).padStart(2,"0")}h</text>`).join("")}
   ${idx.map((x,i)=>`<rect x="${i*col}" y="0" width="${col}" height="136" fill="transparent" data-mh="${i}" style="cursor:pointer"/>`).join("")}
  </svg>`;
  const det=i=>`${String(idx[i]).padStart(2,"0")}:00 · ${WMO(C[i])[1]} · ${Math.round(T[i])}° · lluvia ${P[i]}% (${MM[i]} mm) · viento ${Math.round(V[i])} km/h`;
  const mal=[];if(C[k]>=95)mal.push("tormenta");else if((C[k]>=71&&C[k]<=77)||C[k]===85||C[k]===86)mal.push("nieve");else if(P[k]>=50||MM[k]>=0.5)mal.push("lluvia");if(V[k]>=35)mal.push("viento fuerte");

   <div class="small mt-det" data-dets='${esc(JSON.stringify(idx.map((_,i)=>det(i))))}'>${det(k)}</div>
   <div class="small" style="opacity:.7">Toca una hora para ver el detalle · ${d.fuente==="AEMET"?`Fuente: AEMET${d.municipio?" ("+esc(d.municipio)+")":""}`:"Fuente: Open-Meteo"}</div>`;
}

async function preguntarIAconCupo(key,text,t){
  const hoy=new Date().toISOString().slice(0,10);const c=store.get("ia_cupo",{d:"",n:0});if(c.d!==hoy){c.d=hoy;c.n=0}
  if(c.n>=CUPO_IA)return `Has usado las ${CUPO_IA} preguntas a la IA de hoy. Mañana tendrás más; mientras tanto, pregúntame lo habitual (resultados, próximo partido, clasificación…).`;
  if(!iaDisponible())return "La IA solo está disponible en la app de Android.";
  if(t)await loadGroup(t.grupos[0]);
  const r=await preguntarIA(key,text,t?contextoEquipo(t):contextoGeneral());
  if(r&&!r.includes('class="small">La IA')&&!r.includes("Sin conexión")){c.n++;store.set("ia_cupo",c)}
  return r||"La IA no ha podido responder ahora mismo.";
}
const esPregunta=x=>/[?¿]/.test(x)||/^(que|como|cuando|donde|cual|cuales|quien|cuantos|cuantas|por que|puedo|hay|es|se puede)\b/.test(norm(x));
const iaDisponible=()=>location.host==="appassets.androidplatform.net";
function contextoEquipo(t){
  const d=teamGroup(t);const L=[`FICHA: ${t.name} (${CATN[t.cat]}${t.fem?" femenino":""}). Competición: ${grupoNombre(d.id)}.`,t.campo?`Campo habitual: ${t.campo.name}, ${t.campo.addr}, ${t.campo.loc}.`:"",`Hoy es ${fdate(TODAY)} de ${TODAY.getFullYear()}.`,"","CLASIFICACIÓN (pos equipo PJ G E P GF GC Pts):"];
  d.table.forEach(r=>L.push(`${r.pos}. ${r.name} ${r.pj} ${r.g} ${r.e} ${r.p} ${r.gf} ${r.gc} ${r.pts}`));
  L.push("","ÚLTIMOS Y PRÓXIMOS PARTIDOS DEL EQUIPO:");
  const tm=teamMatches(t);const jug=tm.filter(m=>m.played).slice(-5),pen=tm.filter(m=>!m.played).slice(0,5);
  [...jug,...pen].forEach(m=>{const c=CAMPOS[m.campo];L.push(`J${m.j} ${m.date?fdate(m.date):"fecha por confirmar"} ${m.time} · ${m.homeN} ${m.played?m.hg+"-"+m.ag:"vs"} ${m.awayN}${c?` · ${c.name} (${c.addr}, ${c.loc})`:m.campoN?" · "+m.campoN:""}`)});
  const gol=(d.gol||[]).filter(g=>g[1]===t.id);if(gol.length){L.push("","GOLEADORES DEL EQUIPO:");gol.forEach(g=>L.push(`${nombreJ(g[0])}: ${g[2]}`))}
  return L.join("\n");
}
function contextoGeneral(){return `Hoy es ${fdate(TODAY)} de ${TODAY.getFullYear()}. La app tiene ${TEAMS.length} equipos de fútbol 11 Infantil, Cadete y Juvenil de la Comunidad de Madrid (datos de la RFFM). En este chat se buscan equipos por club, municipio o categoría; las fichas de cada equipo dan resultados, calendario y clasificación. Categorías por año de nacimiento esta temporada: Infantil ${yrs("inf")}, Cadete ${yrs("cad")}, Juvenil ${yrs("juv")}, Alevín ${OTHER_YEARS[0].y.join("–")}.`}
const fmtIA=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^- /gm,"• ").replace(/\n/g,"<br>");
async function preguntarIA(key,text,contexto){
  if(!iaDisponible())return null;
  const hist=state.iah[key]||(state.iah[key]=[]);const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),25000);
  try{const r=await fetch(IA_URL,{method:"POST",headers:{"Content-Type":"application/json"},signal:ctl.signal,body:JSON.stringify({pregunta:text,historial:hist.slice(-6),contexto})});
    const d=await r.json();if(!r.ok||!d.respuesta)return `<span class="small">${esc(d.error||"La IA no ha podido responder ahora mismo.")}</span>`;
    hist.push({rol:"usuario",texto:text},{rol:"asistente",texto:d.respuesta});
    return fmtIA(d.respuesta)+`<div class="small" style="margin-top:6px">IA · puede equivocarse</div>`}
  catch(e){return `<span class="small">${navigator.onLine===false?"Sin conexión: el asistente necesita internet.":"La IA está tardando demasiado. Inténtalo otra vez."}</span>`}
  finally{clearTimeout(tm)}
}

/* ---------- color propio de cada equipo seguido (orden fijo; el color va con el equipo, no con su posición) ---------- */
const COLORES=["#2a78d6","#eb6834","#1baf7a","#eda100","#e87ba4","#0ca30c","#7b6cf0","#e34948"];
function colorEquipo(t){if(!t||!state.follows.includes(t.id))return null;
  if(!state.col[t.id]){const usados=new Set(state.follows.filter(id=>id!==t.id).map(id=>state.col[id]).filter(Boolean));
    state.col[t.id]=COLORES.find(c=>!usados.has(c))||COLORES[state.follows.indexOf(t.id)%COLORES.length];store.set("colores",state.col)}
  return state.col[t.id]}
/* ---------- ordenar «Mis equipos» ---------- */
const ORDENES=[["manual","Mi orden"],["division","División"],["categoria","Categoría"],["proximo","Próximo partido"],["posicion","Posición"],["club","Club"],["etiqueta","Etiqueta"]];
// Nivel de la competición (menor = más alto)
function nivelDivision(nombre){const n=norm(nombre);
  if(/division de honor|liga nacional|nacional/.test(n))return 1;if(/superliga/.test(n))return 2;if(/preferente/.test(n))return 3;
  if(/primera (division )?autonomica|autonomica/.test(n))return 4;if(/primera/.test(n))return 5;if(/segunda/.test(n))return 6;if(/tercera/.test(n))return 7;if(/f ?7|futbol 7/.test(n))return 8;return 9}
function ordenarEquipos(ts){
  const o=state.orden||"manual";const L2=ts.slice();
  const comp=t=>{const g=grupo(t.grupos[0]);return g?g.comp:""};
  const pos=t=>{const d=GD[t.grupos[0]];const r=d&&d.table.find(x=>x.id===t.id);return r?r.pos:999};
  const prox=t=>{if(!GD[t.grupos[0]])return 9e15;const m=nextMatch(t);if(!m||!m.date)return 9e15;const [h,mi]=(m.time||"00:00").split(":");return m.date.getTime()+(+h*60+ +mi)*60000};
  const cat=t=>CAT_ORDER.indexOf(t.cat);
  if(o==="division")L2.sort((a,b)=>nivelDivision(comp(a))-nivelDivision(comp(b))||comp(a).localeCompare(comp(b))||cat(a)-cat(b));
  else if(o==="categoria")L2.sort((a,b)=>cat(a)-cat(b)||(a.fem-b.fem)||nivelDivision(comp(a))-nivelDivision(comp(b)));
  else if(o==="proximo")L2.sort((a,b)=>prox(a)-prox(b));
  else if(o==="posicion")L2.sort((a,b)=>pos(a)-pos(b)||a.name.localeCompare(b.name));
  else if(o==="club")L2.sort((a,b)=>a.club.localeCompare(b.club)||cat(a)-cat(b)||sufijo(a).localeCompare(sufijo(b)));
  else if(o==="etiqueta")L2.sort((a,b)=>(etiqueta(a)?0:1)-(etiqueta(b)?0:1)||etiqueta(a).localeCompare(etiqueta(b))||a.name.localeCompare(b.name));
  return L2;
}
function grupoDe(t){const o=state.orden;const g=grupo(t.grupos[0]);
  if(o==="division")return g?g.comp:"Sin competición";
  if(o==="categoria")return CATN[t.cat]+(t.fem?" femenino":"");
  if(o==="club")return t.club;
  if(o==="etiqueta")return etiqueta(t)||"Sin etiqueta";
  if(o==="proximo"){if(!GD[t.grupos[0]])return "";const m=nextMatch(t);if(!m||!m.date)return "Sin fecha";const d=Math.round((m.date-TODAY)/864e5);return d<=0?"Hoy":d===1?"Mañana":d<7?"Esta semana":d<14?"La semana que viene":"Más adelante"}
  return ""}
function listaMine(followed){
  if(!followed.length)return `<div class="empty">Aún no sigues ningún equipo.<br>Búscalo por su nombre o deja que te ayude.</div>`;
  const ts=ordenarEquipos(followed);let ult=null,h="";
  for(const t of ts){const gname=grupoDe(t);if(gname&&gname!==ult){h+=`<div class="grp-t">${esc(gname)}</div>`;ult=gname}h+=homeRow(t)}
  return h;
}

// Reordenar «Mis equipos»: mantener pulsada una fila (o arrastrar desde ⠿) y moverla. La fila sigue al dedo,
// las demás se apartan con animación y, cerca de los bordes de la pantalla, la lista se desplaza sola.
function activarArrastre(cont){
  let arr=null,espera=null;
  const sc=()=>{let n=cont.parentElement;while(n&&n!==document.body){const st=getComputedStyle(n);if(/(auto|scroll)/.test(st.overflowY)&&n.scrollHeight>n.clientHeight)return n;n=n.parentElement}return document.scrollingElement};
  const filas=()=>[...cont.querySelectorAll(".team")];
  const flip=(antes)=>{for(const f of filas()){if(f===arr.row)continue;const a=antes.get(f);if(a==null)continue;const d=a-f.getBoundingClientRect().top;if(d){f.style.transition="none";f.style.transform=`translateY(${d}px)`;requestAnimationFrame(()=>{f.style.transition="transform .18s ease";f.style.transform=""})}}};
  const empezar=(row,ev)=>{
    if(state.orden!=="manual"){state.orden="manual";store.set("orden","manual");toast("Orden cambiado a «Mi orden». Mantén pulsado otra vez para mover.");render();return}
    const r=row.getBoundingClientRect();const hueco=document.createElement("div");hueco.className="hueco";hueco.style.height=r.height+"px";
    row.after(hueco);row.classList.add("dragging");Object.assign(row.style,{position:"fixed",left:r.left+"px",top:r.top+"px",width:r.width+"px",zIndex:50,transition:"none",pointerEvents:"none"});
    arr={row,hueco,st:row.getAttribute("style")||"",dy:ev.clientY-r.top,y:ev.clientY,sc:sc(),raf:0};window.__arrastrando=true;try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}
    const paso=()=>{if(!arr)return;const H=window.innerHeight,y=arr.y;const v=y<80?-(80-y)/6:y>H-80?(y-(H-80))/6:0;if(v){arr.sc.scrollTop+=v;colocar()}arr.raf=requestAnimationFrame(paso)};arr.raf=requestAnimationFrame(paso);
  };
  const colocar=()=>{const top=arr.y-arr.dy;arr.row.style.top=top+"px";const mid=top+arr.row.offsetHeight/2;
    const fs=filas().filter(f=>f!==arr.row);let destino=null;for(const f of fs){const b=f.getBoundingClientRect();if(mid<b.top+b.height/2){destino=f;break}}
    const antes=new Map(fs.map(f=>[f,f.getBoundingClientRect().top]));
    if(destino){if(arr.hueco.nextElementSibling!==destino)destino.before(arr.hueco);else return}else{const ult=fs[fs.length-1];if(ult&&ult.nextElementSibling!==arr.hueco&&arr.hueco.previousElementSibling!==ult)ult.after(arr.hueco);else if(!ult)return}
    flip(antes)};
  const soltar=()=>{clearTimeout(espera);espera=null;if(!arr)return;cancelAnimationFrame(arr.raf);const{row,hueco,st}=arr;const b=hueco.getBoundingClientRect();
    row.style.transition="top .16s ease";row.style.top=b.top+"px";
    setTimeout(()=>{hueco.replaceWith(row);row.classList.remove("dragging");row.setAttribute("style",st);
      state.follows=filas().map(r=>r.dataset.team);store.set("follows",state.follows);syncAndroid();setTimeout(()=>window.__arrastrando=false,60)},170);arr=null};
  // el desplazamiento de la página se bloquea solo mientras se arrastra
  document.addEventListener("touchmove",ev=>{if(arr)ev.preventDefault()},{passive:false});
  cont.onpointerdown=e=>{
    const row=e.target.closest(".team");if(!row||e.button>0)return;
    const asa=e.target.closest("[data-drag]");const x0=e.clientX,y0=e.clientY;
    if(asa){e.preventDefault();empezar(row,e)}else espera=setTimeout(()=>{espera=null;empezar(row,{clientY:y0})},380);
    const mover=ev=>{if(espera&&(Math.abs(ev.clientX-x0)>8||Math.abs(ev.clientY-y0)>8)){clearTimeout(espera);espera=null}if(arr){arr.y=ev.clientY;colocar()}};
    const fin=()=>{window.removeEventListener("pointermove",mover);window.removeEventListener("pointerup",fin);window.removeEventListener("pointercancel",fin);soltar()};
    window.addEventListener("pointermove",mover);window.addEventListener("pointerup",fin);window.addEventListener("pointercancel",fin);
  };
  cont.oncontextmenu=e=>{if(e.target.closest(".team"))e.preventDefault()};
}
