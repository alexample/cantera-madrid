async function renderTeam(app,t){
  if(!t){state.view="home";return render()}
  if(!GD[t.grupos[0]]){app.innerHTML=`<header class="top"><div class="toprow"><button class="iconbtn" id="back">${icons.back}</button><div class="grow"><h1 style="font-size:22px">${esc(t.name)}</h1></div></div></header><main><div class="empty"><span class="typing"><i></i><i></i><i></i></span></div></main>`;
    $("#back").onclick=volver;
    try{await loadGroup(t.grupos[0])}catch(e){$("main").innerHTML=`<div class="empty">No he podido cargar los datos del equipo.<br><br><button class="btn" id="rt">Reintentar</button></div>`;$("#rt").onclick=()=>render();return}
    if(state.view!=="team"||state.team!==t.id)return;
  }else loadGroup(t.grupos[0],true).catch(()=>{}); // refresco en segundo plano
  renderChat(app,t);
}
function renderChat(app,t){
  const key=t?t.id:"_main";
  if(t&&state.resumen===t.id){state.resumen=null;if(!state.chats[key]||state.chats[key].length<=1)state.chats[key]=[{r:"b",h:ansResumen(t)+`<div class="small" style="margin-top:10px">Pregúntame lo que quieras de este equipo o toca otro rival. ${linkRFFM(urlEquipoRFFM(t),"Ficha en la RFFM")}</div>`}]}
  let cronoInicial=null;
  // La ficha se rehace sola si cambian los datos o el día, salvo que el usuario ya haya preguntado o tocado algo
  const sello=(IDX.act||"")+"|"+isoHoy();
  if(t&&state.chats[key]&&state.auto[key]&&state.auto[key].s!==sello&&state.chats[key].length===state.auto[key].n){delete state.chats[key];delete state.foco[t.id];delete state.abiertos[key]}
  const nuevo=!state.chats[key]&&t;
  if(!state.chats[key]&&t){
    const f=focoPartido(t);
    const tip=`<div class="small" style="margin-top:10px">Toca cada apartado para desplegarlo · desliza los partidos de arriba · toca un equipo con › para ver su ficha${state.follows.includes(t.id)&&!etiqueta(t)?" · "+ic("engranaje","sm")+" para etiquetarlo, elegir avisos y color":""}. ${linkRFFM(urlEquipoRFFM(t),"Ficha RFFM")}</div>`;
    const msgs=[];
    if(lastMatch(t)||nextMatch(t)){
      msgs.push({r:"b",h:`<b>${esc(t.name)}</b>${etiqueta(t)?` · <span class="tag">${ic("estrella","f")} ${esc(etiqueta(t))}</span>`:""}<div class="blqs">${fichaInicialHTML(t,f)}</div>${tip}`});
      const lm=lastMatch(t);if(lm&&lm.acta&&ANDROID)cronoInicial=lm;
    }else msgs.push({r:"b",h:`No hay partidos en el calendario de este equipo.`+tip});
    state.chats[key]=msgs;
    state.auto[key]={s:sello,n:msgs.length};
  }
  if(!state.chats[key])state.chats[key]=[{r:"b",h:welcomeMain()}];
  const chips=t?CHIPS_TEAM:["Menú","Buscar un equipo","Buscar un jugador","Ayúdame a encontrar un equipo","Ver clasificaciones"];
  const colT=t&&colorEquipo(t);
  app.innerHTML=`<header class="top${colT?" eqcol":""}"${colT?` style="--eq:${colT}"`:""}><div class="toprow"><button class="iconbtn" id="back" aria-label="Volver">${icons.back}</button>
    ${t?crest(t,40):""}<div class="grow">${t&&etiqueta(t)?`<span class="tag">${ic("estrella","f")} ${esc(etiqueta(t))}</span>`:""}<h1 class="tn" style="font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t?esc(t.name):"Chat principal"}</h1><div class="sub" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t?esc(grupoNombre(t.grupos[0])):"Equipos y jugadores de Madrid"}</div></div>
    ${t?(state.follows.includes(t.id)?`<button class="iconbtn" id="tset" aria-label="Configuración del equipo">${icons.gear}</button>`:`<button class="btn" id="tfol" style="flex:none">Seguir</button>`):""}</div></header>
  ${t?`<div class="carr-fijo">${carruselHTML(t)}</div>`:""}
  <main id="scroll"><div class="chat" id="chat"></div></main>
  <div class="composer">
  <form class="inp" id="f"><button type="button" id="clr" class="clr" aria-label="Borrar el chat">${icons.trash}</button><input id="q" placeholder="${t?"Pregunta sobre el equipo…":"Escribe o elige una opción…"}" autocomplete="off" enterkeyhint="send"><button aria-label="Enviar">${icons.send}</button></form></div>`;
  const chat=$("#chat");
  const wide=h=>h&&(h.includes("<table")||h.includes("plist")||h.includes('class="jf"')||h.includes('class="blqs"')||h.includes('class="opts'));
  const sugerencias=()=>{const ult=state.chats[key][state.chats[key].length-1];if(!ult||ult.r!=="b"||ult.h.includes("typing"))return "";
    const pregUlt=(state.chats[key].filter(m=>m.r==="u").pop()||{}).h||"";
    const lista=chips.filter(c=>esc(c)!==pregUlt);
    return `<div class="sug">${lista.map(c=>`<button class="chip" data-ask="${esc(c)}">${esc(c)}</button>`).join("")}</div>`};
  const draw=()=>{chat.innerHTML=state.chats[key].map(m=>`<div class="msg ${m.r}${wide(m.h)?" wide":""}">${m.h}</div>`).join("")+sugerencias();marcarNuevos(chat,key);
    if(t)chat.querySelectorAll(`a[data-ver="${CSS.escape(t.id)}"]`).forEach(a=>{a.replaceWith(Object.assign(document.createElement("b"),{textContent:[...a.childNodes].filter(x=>x.nodeType===3).map(x=>x.textContent).join("")}))}); // el propio equipo no es botón
    const ab=state.abiertos[key]||{};chat.querySelectorAll("details[data-b]").forEach(d=>{if(d.dataset.b in ab)d.open=ab[d.dataset.b]});
    $("#scroll").scrollTop=1e9;rellenarMeteo(chat)};
  chat.addEventListener("toggle",e=>{const d=e.target;if(d.matches&&d.matches("details[data-b]")){(state.abiertos[key]=state.abiertos[key]||{})[d.dataset.b]=d.open}},true);
  // Rellena el último mensaje (marcador de carga) con la cronología del partido
  const cargarCrono=m=>leerActa(m).then(a=>{const msgs=state.chats[key];if(!msgs)return;
    const h=a?cronoHTML(m,a.game):`No he podido leer el acta ahora mismo. Puedes verla en la web de la federación:<div>${linkRFFM(urlActaRFFM(m),"Acta en la RFFM")}</div>`;
    const ranura=msgs.find(x=>x.h.includes('data-slot="crono"'));
    if(ranura)ranura.h=ranura.h.replace(/<div data-slot="crono">[\s\S]*?<\/div><!--\/slot-->/,`<div data-slot="crono-ok">${h}</div>`);
    else{const i=msgs.map(x=>x.h).lastIndexOf(msgs.filter(x=>x.h.includes("typing")).pop()?.h);if(i>=0)msgs[i]={r:"b",h};else msgs.push({r:"b",h})}
    if(t?(state.view==="team"&&state.team===t.id):state.view==="main"){const sc=$("#scroll"),st=sc.scrollTop;draw();sc.scrollTop=st}});
  draw();if(t||state.chats[key].length===1)$("#scroll").scrollTop=0; // la ficha se lee desde arriba
  if(cronoInicial)cargarCrono(cronoInicial);
  if(t)colocarCarrusel(t);
  progresoChat=txt=>{const msgs=state.chats[key];const u=msgs&&msgs[msgs.length-1];if(!u||!u.h.includes("typing"))return;u.h=`<span class="typing"><i></i><i></i><i></i></span> <span class="small">${esc(txt)}</span>`;if(state.view===(t?"team":"main")){const sc=$("#scroll"),st=sc.scrollTop;draw();sc.scrollTop=st}};
  window.__preguntar=t?null:text=>ask(text);
  const ask=text=>{
    if(!text.trim())return;
    const shown=text.startsWith("aqui:")?ic("pin")+" "+esc((CAMPOS[text.slice(5)]||{}).name||"Campo"):text.startsWith("ia:")?ic("ia")+" Preguntar a la IA":text.startsWith("q:")||text.startsWith("qc:")?((document.querySelector(`[data-ask="${CSS.escape(text)}"]`)||{}).textContent||"Ese equipo"):text.startsWith("clubteams:")?"Ver equipos de "+((TEAMS.find(t=>t.clubKey===text.split(":")[1])||{}).club||"club"):text.startsWith("comp:")||text.startsWith("grupo:")||text.startsWith("club:")?(document.querySelector(`[data-ask="${CSS.escape(text)}"]`)||{}).textContent||text:text;
    state.chats[key].push({r:"u",h:esc(shown)});state.chats[key].push({r:"b",h:'<span class="typing"><i></i><i></i><i></i></span>'});draw();
    setTimeout(async()=>{let h;
      try{
        if(text.startsWith("ia:")){h=await preguntarIAconCupo(key,text.slice(3),t)}
        else{h=t?await answerTeam(t,text):await handleMain(text);
          if(h==null)h=noEntiendo(text,t)}}
      catch(e){h="Ha fallado algo al consultar los datos. Inténtalo otra vez."}
      state.chats[key].pop();state.chats[key].push({r:"b",h});if(state.view===(t?"team":"main")){draw();
        // Respuestas largas (p. ej. los partidos de un campo): se ve desde el principio de la respuesta
        if(typeof h==="string"&&h.includes('class="aq')){const ms=chat.querySelectorAll(".msg"),el=ms[ms.length-2];if(el){const sc=$("#scroll");sc.scrollTop+=el.getBoundingClientRect().top-sc.getBoundingClientRect().top-8}}}},250);
  };
  window.__ask=ask;
  $("#f").onsubmit=e=>{e.preventDefault();const v=$("#q").value;$("#q").value="";ask(v)};
  app.onclick=e=>{
    const a=e.target.closest("[data-ask]");if(a){ask(a.dataset.ask);return}
    const pnb=e.target.closest("[data-pron]");if(pnb){const eq=TEAM.get(pnb.dataset.pron);const datos=pronosticoTexto(eq);
      state.chats[key].push({r:"u",h:ic("ia")+" Explícame el pronóstico"});state.chats[key].push({r:"b",h:'<span class="typing"><i></i><i></i><i></i></span> <span class="small">Preparando la explicación…</span>'});draw();
      previaIA(datos,"pronostico").then(txt=>{const msgs=state.chats[key];msgs.pop();msgs.push({r:"b",h:`<b>${ic("ia")} Pronóstico explicado</b><div style="margin-top:4px">${fmtIA(txt)}</div><div class="small" style="opacity:.7;margin-top:6px">La IA solo explica los números calculados por la app; no hace cuentas propias.</div>`});if(state.view===(t?"team":"main"))draw()});return}
    const pb=e.target.closest("[data-previa]");if(pb){const datos=pb.parentElement.querySelector(".pv-datos").value;
      state.chats[key].push({r:"u",h:ic("ia")+" Previa de la IA"});state.chats[key].push({r:"b",h:'<span class="typing"><i></i><i></i><i></i></span> <span class="small">Preparando la previa…</span>'});draw();
      previaIA(datos).then(txt=>{const msgs=state.chats[key];msgs.pop();msgs.push({r:"b",h:`<b>${ic("ia")} Previa</b><div style="margin-top:4px">${fmtIA(txt)}</div><div class="small" style="opacity:.7;margin-top:6px">Texto de la IA a partir de los números de arriba; puede equivocarse.</div>`});if(state.view===(t?"team":"main"))draw()});return}
    const jg=e.target.closest("[data-jug]");if(jg){const[eid,k]=jg.dataset.jug.split("|");const eq=TEAM.get(eid);if(!eq)return;
      state.chats[key].push({r:"u",h:ic("persona")+" "+esc(((jg.querySelector(".tl-row")||jg).textContent||"").replace("›","").replace(/^\s*\d+\s+/,"").replace(/\s+/g," ").trim())});state.chats[key].push({r:"b",h:'<span class="typing"><i></i><i></i><i></i></span>'});draw();
      actasEquipo(eq,(n,tot)=>progresoChat(`Leyendo las actas de ${eq.name} ${n}/${tot}…`)).then(lista=>{const st=statsJugadores(eq,lista);const p=st.find(x=>x.k===k);
        const msgs=state.chats[key];msgs.pop();msgs.push({r:"b",h:p?fichaJugadorHTML(eq,p,lista.length):"No encuentro a ese jugador en las actas del equipo."});
        if(state.view===(t?"team":"main"))draw()});return}
    const fp=!e.target.closest("a,[data-ver],[data-ask]")&&e.target.closest("[data-fp]");if(fp&&t){
      const m=teamMatches(t).find(x=>firma(x)===fp.dataset.fp);if(!m)return;
      state.foco[t.id]=firma(m);
      const cab=m.played?`${ic("hoja")} J${m.j} · ${esc(m.homeN)} ${m.hg}–${m.ag} ${esc(m.awayN)}`:`${ic("hoja")} J${m.j??"?"} · ${esc(m.homeN)} – ${esc(m.awayN)}`;
      state.chats[key]=[{r:"u",h:cab},...(m.played?fichaPartidoMsgs(t,m):fichaProxMsgs(t,m))];delete state.abiertos[key];
      colocarCarrusel(t);
      draw();$("#scroll").scrollTop=0;
      if(m.played&&m.acta&&ANDROID)cargarCrono(m);return}
    const cr=e.target.closest("[data-crono]");if(cr){const m=buscarPartido(cr.dataset.crono);if(!m)return;
      state.chats[key].push({r:"u",h:ic("reloj")+" Cronología del partido"});state.chats[key].push({r:"b",h:'<span class="typing"><i></i><i></i><i></i></span>'});draw();
      cargarCrono(m);return}
    const cp=e.target.closest("[data-copiar]");if(cp){const a=ACTAS[cp.dataset.copiar];const mm=buscarPartido(cp.dataset.copiar);if(!a||!mm)return;const txt=resumenTexto(mm,a.game);
      (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Acta copiada"),()=>{const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Acta copiada")}catch(_){toast("No se ha podido copiar")}ta.remove()});return}
    const tg=e.target.closest("[data-evo-tog]");if(tg){state.evoSinRival=!state.evoSinRival;store.set("evo_sin_rival",state.evoSinRival);
      document.querySelectorAll(".evo").forEach(ev=>{if(!ev.querySelector("[data-evo-tog]"))return;ev.classList.toggle("sin-riv",state.evoSinRival);const b=ev.querySelector("[data-evo-tog]");b.setAttribute("aria-pressed",String(!state.evoSinRival));b.querySelector(".evo-x").textContent=state.evoSinRival?"＋ mostrar":"✕ quitar"});return}
    const ep=e.target.closest("[data-evp]");if(ep){const box=ep.closest(".evo");box.querySelector(".evo-det").textContent=ep.dataset.evp;box.querySelectorAll(".evo-p").forEach(c=>{c.classList.remove("on");c.setAttribute("r",4)});const c=ep.querySelector("circle");c.classList.add("on");c.setAttribute("r",6);return}
    const mh=e.target.closest("[data-mh]");if(mh){const box=mh.closest(".meteo");const det=box.querySelector(".mt-det");det.textContent=JSON.parse(det.dataset.dets)[+mh.dataset.mh];box.querySelectorAll(".mt-band").forEach(b=>b.setAttribute("x",(+mh.dataset.mh)*50+1));return}
    const dv=e.target.closest("[data-div]");if(dv){state.pila.push({view:state.view,team:state.team});state.view="div";state.div=dv.dataset.div;render();return}
    const vr=e.target.closest("[data-ver]");if(vr){const id=vr.dataset.ver;if(id===state.team&&state.view==="team")return;state.pila.push({view:state.view,team:state.team});state.resumen=id;state.view="team";state.team=id;render();return}
    const o=e.target.closest("[data-open]");if(o){follow(o.dataset.open);state.view="team";state.team=o.dataset.open;render();return}
    const v=e.target.closest("[data-act=verify]");if(v){state.verified=true;store.set("verified",true);if(!t)startFlow("player");state.chats[key].push({r:"b",h:"Listo, cuenta verificada (simulación). Escribe el <b>nombre y apellidos</b> del jugador."});draw()}
  };
  $("#back").onclick=volver;
  $("#clr").onclick=()=>openSheet(`<h3>¿Borrar la conversación?</h3><p class="small">Se borran los mensajes de este chat. ${t?"El equipo sigue en tus equipos y sus avisos no cambian.":""}</p>
    <div style="display:flex;gap:10px"><button class="btn ghost" id="no" style="flex:1;padding:12px">Cancelar</button><button class="btn" id="yes" style="flex:1;padding:12px;background:var(--loss);color:#fff">Borrar</button></div>`,()=>{
    $("#no").onclick=closeSheet;
    $("#yes").onclick=()=>{delete state.chats[key];state.iah[key]=[];if(!t)state.flow=null;closeSheet();render();toast("Chat borrado")}});
  if(t&&$("#tset"))$("#tset").onclick=()=>openTeamSettings(t);
  if(t&&$("#tfol"))$("#tfol").onclick=()=>{follow(t.id);render();setTimeout(()=>openTeamSettings(t),150)};
}
function openSheet(html,bind){$("#sheet").innerHTML=html;$("#sheetBg").style.display="block";requestAnimationFrame(()=>$("#sheet").classList.add("open"));bind&&bind()}
function closeSheet(){$("#sheet").classList.remove("open");$("#sheetBg").style.display="none"}
$("#sheetBg").onclick=closeSheet;
function openTeamSettings(t){
  const guardado=silenciado(t)?state.avEq[t.id].antes:state.avEq[t.id];
  const propio=!!guardado;const av=Object.assign({},propio?guardado:leerAvisos());let mute=silenciado(t);
  const sw=(k,tt,d)=>`<div class="tog"><div class="grow"><b>${tt}</b><div class="small">${d}</div></div><button class="sw ${av[k]?"on":""}" data-tsw="${k}" aria-label="${tt}"></button></div>`;
  openSheet(`<h3>${esc(t.name)}</h3>
   <span class="lbl">Etiqueta</span>
   <input class="search" id="etq" maxlength="24" placeholder="Ej.: Adrián, Mi hijo, Sobrino…" value="${esc(etiqueta(t))}">
   <div class="chips" style="padding:0 0 6px">${["Mi hijo","Mi hija","Sobrino","Nieto","Mi equipo"].map(x=>`<button class="chip" data-etq="${x}">${x}</button>`).join("")}</div>
   <span class="lbl">Color del equipo</span>
   <div class="colsel">${COLORES.map(c=>`<button class="colbt${colorEquipo(t)===c?" on":""}" data-col="${c}" style="background:${c}" aria-label="Color ${c}"></button>`).join("")}</div>
   <div style="margin:4px 0 2px">${linkRFFM(urlEquipoRFFM(t),"Ficha oficial y plantilla en la RFFM")}</div>
   <div class="section-t">Avisos de este equipo</div>
   <div class="tog"><div class="grow"><b>Recibir avisos de este equipo</b><div class="small">Desactívalo para seguirlo sin notificaciones.</div></div><button class="sw ${silenciado(t)?"":"on"}" id="activos" aria-label="Recibir avisos"></button></div>
   <div id="detalleAv" class="${silenciado(t)?"hidden":""}">
   <div class="tog"><div class="grow"><b>Usar los ajustes generales</b><div class="small">Desactívalo para elegir avisos solo para este equipo.</div></div><button class="sw ${propio?"":"on"}" id="gen" aria-label="Usar ajustes generales"></button></div>
   <div id="propios" class="${propio?"":"hidden"}">
    ${sw("resultado","Resultados","Cuando se publique el resultado.")}
    ${sw("asignado","Partido asignado","Cuando se fije o cambie fecha, hora o campo.")}
    ${sw("previo","Antes del partido","Con el campo y cómo llegar.")}
    ${sw("meteo","Mal tiempo (24 h antes)","Lluvia, nieve, tormenta, viento o aviso oficial.")}
    <div class="tog"><div class="grow"><b>¿Cuánto antes?</b></div><div class="chips" style="padding:0">${[1,2,3,4,6].map(h=>`<button class="chip" data-th="${h}" style="${av.horas===h?"background:var(--pitch2);color:var(--bg)":""}">${h} h</button>`).join("")}</div></div>
   </div>
   </div>
   <div style="display:flex;gap:10px;margin-top:16px"><button class="btn ghost" id="unf2" style="flex:1;padding:12px;color:var(--loss)">Dejar de seguir</button><button class="btn" id="ok" style="flex:1;padding:12px">Listo</button></div>`,()=>{
    let usarGen=!propio;
    $("#sheet").querySelectorAll("[data-col]").forEach(b=>b.onclick=()=>{const c=b.dataset.col;const otro=Object.keys(state.col).find(id=>id!==t.id&&state.col[id]===c&&state.follows.includes(id));
      if(otro)state.col[otro]=state.col[t.id];state.col[t.id]=c;store.set("colores",state.col);$("#sheet").querySelectorAll("[data-col]").forEach(x=>x.classList.toggle("on",x===b))});
    const guardar=()=>{const e=$("#etq").value.trim();if(e)state.etq[t.id]=e;else delete state.etq[t.id];store.set("etiquetas",state.etq);
      const prop=usarGen?null:{resultado:!!av.resultado,asignado:!!av.asignado,previo:!!av.previo,meteo:av.meteo!==false,horas:av.horas||3};
      if(mute)state.avEq[t.id]={resultado:false,asignado:false,previo:false,meteo:false,horas:3,silencio:true,antes:prop};
      else if(prop)state.avEq[t.id]=prop;else delete state.avEq[t.id];
      store.set("avEq",state.avEq);syncAndroid()};
    $("#activos").onclick=()=>{mute=!mute;$("#activos").classList.toggle("on",!mute);$("#detalleAv").classList.toggle("hidden",mute);guardar()};
    document.querySelectorAll("[data-etq]").forEach(b=>b.onclick=()=>{$("#etq").value=b.dataset.etq;guardar()});
    $("#etq").onchange=guardar;
    $("#gen").onclick=()=>{usarGen=!usarGen;$("#gen").classList.toggle("on",usarGen);$("#propios").classList.toggle("hidden",usarGen);guardar()};
    document.querySelectorAll("[data-tsw]").forEach(b=>b.onclick=()=>{const k=b.dataset.tsw;av[k]=!av[k];b.classList.toggle("on",av[k]);guardar()});
    document.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{av.horas=+b.dataset.th;document.querySelectorAll("[data-th]").forEach(x=>x.style.cssText=+x.dataset.th===av.horas?"background:var(--pitch2);color:var(--bg)":"");guardar()});
    $("#ok").onclick=()=>{guardar();closeSheet();delete state.chats[t.id];render()};
    $("#unf2").onclick=()=>{guardar();openConfirmUnfollow(t)};
  });
}
function openConfirmUnfollow(t){
  openSheet(`<h3>¿Dejar de seguir?</h3><p>${esc(t.name)} desaparecerá de tus equipos.</p><div style="display:flex;gap:10px"><button class="btn ghost" id="no" style="flex:1;padding:12px">Cancelar</button><button class="btn" id="yes" style="flex:1;padding:12px;background:var(--loss)">Dejar de seguir</button></div>`,()=>{
    $("#no").onclick=closeSheet;$("#yes").onclick=()=>{delete state.etq[t.id];delete state.avEq[t.id];store.set("etiquetas",state.etq);store.set("avEq",state.avEq);unfollow(t.id);delete state.chats[t.id];closeSheet();state.view="home";render()}});
}
function leerAvisos(){let a={};if(ANDROID)try{a=JSON.parse(AndroidApp.leerAjustes()||"{}")}catch(e){}return Object.assign({resultado:true,asignado:true,previo:true,meteo:true,horas:3},a)}
function openSettings(){
  const av=leerAvisos();const sw=(k,t,d)=>`<div class="tog"><div class="grow"><b>${t}</b><div class="small">${d}</div></div><button class="sw ${av[k]?"on":""}" data-sw="${k}" aria-label="${t}"></button></div>`;
  const permiso=ANDROID?(()=>{try{return AndroidApp.puedeNotificar()}catch(e){return true}})():true;
  openSheet(`<h3>Ajustes</h3>
   <div class="section-t" style="margin-top:4px">Avisos de mis equipos</div>
   ${ANDROID?"":`<div class="small" style="margin-bottom:8px">Los avisos funcionan en la app de Android.</div>`}
   ${permiso?"":`<div class="small" style="margin-bottom:8px;color:var(--loss)">Las notificaciones están desactivadas para esta app. <button class="btn ghost" id="permiso" style="margin-top:6px">Activarlas</button></div>`}
   ${sw("resultado","Resultados","Cuando la federación publica el resultado.")}
   ${sw("asignado","Partido asignado","Cuando se fija o cambia la fecha, la hora o el campo.")}
   ${sw("previo","Antes del partido","Con el campo y cómo llegar.")}
   ${sw("meteo","Mal tiempo (24 h antes)","Si se prevé lluvia, nieve, tormenta, viento fuerte o hay aviso meteorológico oficial.")}
   <div class="tog"><div class="grow"><b>¿Cuánto antes?</b></div><div class="chips" style="padding:0">${[1,2,3,4,6].map(h=>`<button class="chip" data-h="${h}" style="${av.horas===h?"background:var(--pitch2);color:#fff":""}">${h} h</button>`).join("")}</div></div>
   <div class="section-t">Apariencia</div>
   <div class="themes">
    <button class="theme ${state.tema==="noche"?"on":""}" data-tema="noche"><div class="pv" style="background:radial-gradient(circle,rgba(255,255,255,.6) 1px,transparent 1.6px) 0 0/23px 19px,linear-gradient(180deg,#0e0930,#2a1e6e)"><div style="position:absolute;left:8px;right:8px;bottom:8px;height:18px;border-radius:6px;background:#e9e5ff;box-shadow:inset 0 -6px 0 #5b4bd6"></div></div><b>Noche</b><div class="small">Violeta, billetes</div></button>
    <button class="theme ${state.tema==="clasico"?"on":""}" data-tema="clasico"><div class="pv" style="background:repeating-linear-gradient(90deg,#0f5132 0 16px,#14603d 16px 32px)"><div style="position:absolute;left:8px;right:8px;bottom:8px;height:18px;border-radius:6px;background:#f3f1ea"></div></div><b>Clásico</b><div class="small">Verde césped, claro</div></button>
    <button class="theme ${state.tema==="estadio"?"on":""}" data-tema="estadio"><div class="pv" style="background:radial-gradient(60px 30px at 15% 0,rgba(255,255,255,.35),transparent),radial-gradient(60px 30px at 85% 0,rgba(255,255,255,.35),transparent),linear-gradient(165deg,#15275a,#070b16)"><div style="position:absolute;left:8px;right:8px;bottom:8px;height:18px;border-radius:6px;background:linear-gradient(135deg,#b8f53d,#5ee6a8)"></div></div><b>Estadio</b><div class="small">Noche de partido</div></button>
   </div>
   <div class="section-t">Cuenta</div>
   <div class="tog"><div class="grow"><b>Cuenta verificada</b><div class="small">Permite buscar jugadores por nombre. En la versión final lo validará el club o la familia.</div></div><button class="sw ${state.verified?"on":""}" id="vsw" aria-label="Cuenta verificada"></button></div>
   <div class="tog"><div class="grow"><b>Datos</b><div class="small">Real Federación de Fútbol de Madrid (rffm.es), ${esc(IDX.temporada)}. Se actualizan varias veces al día. App no oficial.</div></div><button class="btn ghost" id="upd">Actualizar</button></div>`,()=>{
    const guardar=()=>{if(ANDROID)try{AndroidApp.guardarAjustes(JSON.stringify(av))}catch(e){}};
    document.querySelectorAll("[data-sw]").forEach(b=>b.onclick=()=>{const k=b.dataset.sw;av[k]=!av[k];b.classList.toggle("on",av[k]);guardar()});
    document.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{av.horas=+b.dataset.h;document.querySelectorAll("[data-h]").forEach(x=>x.style.cssText=+x.dataset.h===av.horas?"background:var(--pitch2);color:#fff":"");guardar()});
    if($("#permiso"))$("#permiso").onclick=()=>{try{AndroidApp.pedirPermiso();AndroidApp.abrirAjustesNotificaciones()}catch(e){}};
    document.querySelectorAll("[data-tema]").forEach(b=>b.onclick=()=>{state.tema=b.dataset.tema;store.set("tema",state.tema);aplicarTema();document.querySelectorAll("[data-tema]").forEach(x=>x.classList.toggle("on",x.dataset.tema===state.tema))});
    $("#vsw").onclick=()=>{state.verified=!state.verified;store.set("verified",state.verified);$("#vsw").classList.toggle("on",state.verified)};
    $("#upd").onclick=async()=>{$("#upd").textContent="…";await boot(true);closeSheet()};
  });
}
function volver(){VOLVIENDO=true;const p=state.pila.pop();if(p){state.view=p.view;state.team=p.team;if(p.div)state.div=p.div;if(p.jug!=null)state.jug=p.jug}else state.view="home";render()}
window.atras=()=>{
  if($("#sheet").classList.contains("open")){closeSheet();return true}
  if(state.view!=="home"){volver();return true}
  return false;
};
window.abrirEquipo=id=>{if(!IDX||!TEAM.get(id)){window.__pendiente=id;return}closeSheet();state.view="team";state.team=id;render()};
function abrirPendiente(){const h=(location.hash.match(/^#e-(.+)$/)||[])[1];const id=window.__pendiente||h;if(id&&TEAM.get(id)){window.__pendiente=null;try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}state.view="team";state.team=id;render()}}
aplicarTema();
async function boot(fresh){
  const cached=store.get("indice",null);
  if(cached&&!fresh){buildIndex(cached);addLocalities();render();syncAndroid();abrirPendiente()}
  else if(!IDX)render();
  try{
    const ix=await getJSON("indice.json",{fresh:true});
    if(!cached||ix.act!==cached.act||fresh){store.set("indice",ix);buildIndex(ix);VOCAB=null;addLocalities();Object.keys(GD).forEach(k=>delete GD[k]);if(state.view==="home")render();syncAndroid();abrirPendiente()}
  }catch(e){if(!IDX)renderLoading($("#app"),e.message)}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&IDX)boot()});
boot();

</script>
</body>
</html>
