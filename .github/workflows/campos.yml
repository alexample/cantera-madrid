name: Verificar ubicación de los campos

# Contrasta cada campo con su dirección y con OpenStreetMap, y calcula el punto de entrada
# al que lleva «Cómo llegar». Pasada completa al cambiar el script, cada lunes o a mano.
on:
  push:
    branches: [main]
    paths:
      - "robot/campos.py"
      - ".github/workflows/campos.yml"
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: campos
  cancel-in-progress: false

jobs:
  campos:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar los campos pendientes
        # Para repasarlos todos de nuevo: añadir --todos (se hace por tandas de 45 min)
        run: python robot/campos.py | tee campos.log
      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "Robot de datos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Campos: ubicación verificada y punto de entrada (robot)"
          git pull --rebase origin main
          git push
