name: Sonda RFFM (diagnóstico)
on:
  workflow_dispatch:
    inputs:
      grupo:
        default: "26737740"
jobs:
  sonda:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python robot/sonda.py "${{ github.event.inputs.grupo }}"
