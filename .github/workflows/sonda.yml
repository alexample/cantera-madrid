name: Sonda tiempo (diagnóstico)
on:
  workflow_dispatch:
jobs:
  sonda:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for f in 2026-11-15 2026-11-16 2026-11-21; do
            echo "== worker $f"; curl -sS -m 20 -H "Origin: https://appassets.androidplatform.net" "https://dondeloechan-ia.alexample.workers.dev/cantera-tiempo?lat=40.3755&lon=-3.7368&fecha=$f" | head -c 700; echo
          done
          echo "== open-meteo"; curl -sS -m 20 "https://api.open-meteo.com/v1/forecast?latitude=40.3755&longitude=-3.7368&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m&timezone=Europe%2FMadrid&start_date=2026-11-21&end_date=2026-11-21" | head -c 400; echo
