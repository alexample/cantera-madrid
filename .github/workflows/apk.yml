name: Compilar APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "keystore/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    # Ubuntu 24.04 trae el SDK de Android instalado.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK de Android
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK en: $SDK"
          ls "$SDK" || { echo "No hay SDK de Android en la máquina"; exit 1; }
          echo "sdk.dir=$SDK" > local.properties
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Guardar registro del fallo
        if: failure()
        run: |
          mkdir /tmp/log && cp build.log /tmp/log/ && cd /tmp/log
          git init -q -b build-log && git add build.log
          git -c user.name="Robot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Registro de compilación fallida"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build-log

      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk CanteraMadrid.apk

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CanteraMadrid-apk
          path: CanteraMadrid.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Cantera Madrid 0.1.${{ github.run_number }}
          make_latest: "true"
          body: |
            Descarga **CanteraMadrid.apk** desde el móvil y ábrela para instalar.
            Prototipo con datos inventados. Si ya tenías una versión anterior, se instala encima.
          files: CanteraMadrid.apk
