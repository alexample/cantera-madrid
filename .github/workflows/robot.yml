name: Robot de datos RFFM

# Descarga calendario, resultados, clasificaciones y campos de la RFFM y los guarda en data/.
# La app lee esos archivos de GitHub al abrirse.
#
# Lo lanza el worker de Cloudflare (dondeloechan-ia) con repository_dispatch, porque los
# horarios de GitHub se retrasan mucho:
#   - completo: fines de semana cada 2 h (8–22 h); entre semana a las 7, 15 y 21 h (hora de Madrid)
#   - rapido:   fines de semana cada 20 min (10–23 h), solo grupos con resultados pendientes
# El horario de GitHub queda solo como red de seguridad, una vez al día.
on:
  repository_dispatch:
    types: [robot]
  schedule:
    - cron: "20 4 * * *"
  push:
    branches: [main]
    paths:
      - "robot/**"
      - ".github/workflows/robot.yml"
  workflow_dispatch:
    inputs:
      modo:
        description: "completo o rapido"
        default: "completo"

permissions:
  contents: write

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar datos de la RFFM
        env:
          MODO: ${{ github.event.client_payload.modo || github.event.inputs.modo || 'completo' }}
        run: |
          echo "Modo: $MODO"
          if [ "$MODO" = "rapido" ]; then python robot/rffm.py --rapido; else python robot/rffm.py; fi
      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "Robot de datos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Datos RFFM $(date -u +'%Y-%m-%d %H:%M') (robot)"
          git pull --rebase origin main
          git push
